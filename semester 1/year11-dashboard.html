<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 11 — Trinity CE High School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161A2E;
    --ink-soft:#4B4F63;
    --paper:#FFFFFF;
    --wash:#F1F2F5;
    --line:#E1E2E8;
    --line-strong:#C7C9D4;

    --exam:#D85A30;      --exam-tint:#FAECE7;      --exam-deep:#712B13;
    --entrance:#BA7517;  --entrance-tint:#FAEEDA;  --entrance-deep:#633806;
    --practical:#0F6E56; --practical-tint:#E1F5EE; --practical-deep:#04342C;
    --lang:#534AB7;      --lang-tint:#EEEDFE;      --lang-deep:#26215C;
    --event:#993556;     --event-tint:#FBEAF0;     --event-deep:#4B1528;

    --radius: 10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--wash);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:grid;
    grid-template-columns:300px 1fr;
    min-height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--ink);
    color:#E9EAF2;
    padding:32px 26px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .brand{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .brand svg{flex-shrink:0; margin-top:3px;}
  .brand-text h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:.2px;
  }
  .brand-text p{
    margin:0;
    font-size:12.5px;
    color:#9EA2BC;
    line-height:1.5;
  }

  .next-up{
    background:#20233B;
    border:1px solid #2E3151;
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .next-up .label{
    font-size:11.5px;
    color:#9199C4;
    margin:0 0 10px;
  }
  .next-up .when{
    font-family:'Fraunces',serif;
    font-size:15px;
    color:#fff;
    margin:0 0 2px;
  }
  .next-up .title{
    font-size:14px;
    color:#C7CAE6;
    margin:0 0 10px;
    line-height:1.4;
  }
  .next-up .count{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .next-up .count .n{
    font-family:'Fraunces',serif;
    font-size:32px;
    font-weight:600;
    color:#fff;
  }
  .next-up .count .u{
    font-size:12.5px;
    color:#9199C4;
  }

  nav.views{
    display:flex;
    background:#20233B;
    border-radius:8px;
    padding:3px;
    gap:3px;
  }
  nav.views button{
    flex:1;
    background:transparent;
    border:none;
    color:#9199C4;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 0;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  nav.views button.active{
    background:#3A3E63;
    color:#fff;
  }

  .filters{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .filters .heading{
    font-size:11.5px;
    color:#9199C4;
    margin:0 0 2px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:9px;
    background:#20233B;
    border:1px solid #2E3151;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:13.5px;
    color:#D3D5E6;
    user-select:none;
    transition:opacity .15s ease;
  }
  .chip .dot{
    width:10px;height:10px;border-radius:50%;flex-shrink:0;
  }
  .chip .count{
    margin-left:auto;
    font-size:12px;
    color:#8489AD;
  }
  .chip.off{opacity:.35;}

  .legend-note{
    font-size:11.5px;
    color:#7C81A6;
    line-height:1.6;
    border-top:1px solid #2A2D4A;
    padding-top:16px;
  }

  /* ---------- MAIN ---------- */
  main{
    padding:32px 40px 60px;
    max-width:1100px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:14px;
  }
  .topbar h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
  }
  .nav-btns{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .nav-btns button{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    cursor:pointer;
    font-size:15px;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .nav-btns button:hover{background:var(--wash);}
  .nav-btns .today{
    width:auto;
    padding:0 14px;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
  }

  /* Month grid */
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .weekday-row div{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
    text-align:left;
    padding:0 6px;
  }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:112px;
    gap:6px;
  }
  .day-cell{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 8px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .day-cell.pad{background:transparent;border-color:transparent;}
  .day-cell.today{border-color:var(--ink); border-width:1.5px;}
  .day-num{
    font-family:'Fraunces',serif;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  .day-cell.pad .day-num{color:var(--line-strong);}
  .ev-pill{
    font-size:10.5px;
    line-height:1.35;
    padding:2px 6px;
    border-radius:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:600;
    cursor:default;
  }
  .ev-more{
    font-size:10px;
    color:var(--ink-soft);
    padding:1px 6px;
  }

  /* Week view */
  .week-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .week-day{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 18px;
  }
  .week-day.today{border-color:var(--ink);}
  .week-day .wd-head{
    display:flex;
    align-items:baseline;
    gap:9px;
    margin-bottom:8px;
  }
  .week-day .wd-head .dow{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .week-day .wd-head .dnum{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:600;
  }
  .week-day .wd-empty{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .wk-ev{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:7px 0;
    border-top:1px solid var(--line);
  }
  .wk-ev:first-of-type{border-top:none;}
  .wk-ev .bar{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0;}
  .wk-ev .time{
    font-size:12px;
    color:var(--ink-soft);
    min-width:52px;
    font-variant-numeric:tabular-nums;
    padding-top:1px;
  }
  .wk-ev .txt .t{font-size:14px;font-weight:600;}
  .wk-ev .txt .d{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}

  /* Agenda view */
  .agenda-month{margin-bottom:28px;}
  .agenda-month h3{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
    color:var(--ink-soft);
  }
  .agenda-row{
    display:flex;
    gap:16px;
    padding:11px 4px;
    border-top:1px solid var(--line);
    align-items:flex-start;
  }
  .agenda-row:first-child{border-top:none;}
  .agenda-date{
    width:74px;
    flex-shrink:0;
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    padding-top:1px;
  }
  .agenda-date span{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .agenda-body{flex:1;}
  .agenda-tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:5px;
    margin-bottom:4px;
  }
  .agenda-title{font-size:14.5px;font-weight:600;margin:0 0 2px;}
  .agenda-detail{font-size:13px;color:var(--ink-soft);margin:0;}

  .empty-msg{
    text-align:center;
    padding:60px 0;
    color:var(--ink-soft);
    font-size:14px;
  }

  @media (max-width: 860px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      flex-direction:row;
      flex-wrap:wrap;
      align-items:center;
      padding:18px 20px;
    }
    .brand{width:100%;}
    .next-up{flex:1;min-width:220px;}
    nav.views{flex:1;min-width:200px;}
    .filters{width:100%;flex-direction:row;flex-wrap:wrap;}
    .chip{flex:1;min-width:130px;}
    .legend-note{display:none;}
    main{padding:24px 18px 50px;}
    .month-grid{grid-auto-rows:88px;}
    .ev-pill{font-size:9.5px;}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <svg width="30" height="26" viewBox="0 0 30 26" fill="none">
        <path d="M15 0L30 15L15 8L0 15L15 0Z" fill="#D85A30"/>
        <path d="M15 8L30 23L15 16L0 23L15 8Z" fill="#E9EAF2"/>
      </svg>
      <div class="brand-text">
        <h1>Year 11 tracker</h1>
        <p>Trinity CE High School — exams &amp; milestones, 2026/27</p>
      </div>
    </div>

    <div class="next-up" id="nextUp"></div>

    <nav class="views" id="viewSwitch">
      <button data-view="month" class="active">Month</button>
      <button data-view="week">Week</button>
      <button data-view="agenda">Agenda</button>
    </nav>

    <div class="filters">
      <p class="heading">Categories</p>
      <div id="filterList"></div>
    </div>

    <p class="legend-note">Two dates (6 &amp; 8 Oct) list a different calculator rule on the exam letter versus the milestones sheet — check with school which paper is calculator and which isn't.</p>
  </aside>

  <main>
    <div class="topbar">
      <h2 id="periodLabel"></h2>
      <div class="nav-btns" id="navBtns">
        <button id="prevBtn" aria-label="Previous">‹</button>
        <button class="today" id="todayBtn">Today</button>
        <button id="nextBtn" aria-label="Next">›</button>
      </div>
    </div>
    <div id="viewRoot"></div>
  </main>

</div>

<script>
const CATS = {
  exam:      { label: "GCSE exams",        color: "var(--exam)",      tint: "var(--exam-tint)",      deep: "var(--exam-deep)" },
  entrance:  { label: "Sixth form entrance",color: "var(--entrance)",  tint: "var(--entrance-tint)",  deep: "var(--entrance-deep)" },
  practical: { label: "Practicals",         color: "var(--practical)", tint: "var(--practical-tint)", deep: "var(--practical-deep)" },
  lang:      { label: "Languages",          color: "var(--lang)",      tint: "var(--lang-tint)",      deep: "var(--lang-deep)" },
  event:     { label: "School events",      color: "var(--event)",     tint: "var(--event-tint)",     deep: "var(--event-deep)" }
};

const EVENTS = [
  {date:"2026-09-10", time:"18:30", title:"Y11 Scene Setting", detail:"Exam support & next steps talk", cat:"event"},
  {date:"2026-09-22", time:"", title:"Sixth form talk", detail:"Periods 1 & 2", cat:"event"},
  {date:"2026-09-24", time:"18:00", title:"Sixth form open evening", detail:"", cat:"event"},

  {date:"2026-10-05", time:"", title:"Entrance exam week begins", detail:"Maths & English, week of 5 Oct", cat:"entrance"},
  {date:"2026-10-06", time:"09:00", title:"Maths paper 1", detail:"Letter says calculator; milestones sheet says non-calculator — confirm with school", cat:"entrance"},
  {date:"2026-10-07", time:"09:00", title:"English Literature paper 2", detail:"", cat:"entrance"},
  {date:"2026-10-08", time:"09:00", title:"Maths paper 2", detail:"Letter says non-calculator; milestones sheet says calculator — confirm with school", cat:"entrance"},

  {date:"2026-11-02", time:"", title:"No exams today", detail:"Y7–11 flu immunisations", cat:"event"},
  {date:"2026-11-03", time:"09:00", title:"RE paper 1", detail:"", cat:"exam"},
  {date:"2026-11-03", time:"13:00", title:"Geography", detail:"", cat:"exam"},
  {date:"2026-11-04", time:"09:00", title:"Science / Biology", detail:"", cat:"exam"},
  {date:"2026-11-04", time:"13:00", title:"GCSE PE", detail:"", cat:"exam"},
  {date:"2026-11-04", time:"13:00", title:"Food and Nutrition", detail:"", cat:"exam"},
  {date:"2026-11-05", time:"09:00", title:"Business Studies", detail:"", cat:"exam"},
  {date:"2026-11-05", time:"11:30", title:"French & Spanish — listening/reading", detail:"", cat:"lang"},
  {date:"2026-11-06", time:"", title:"PE mock practical exam", detail:"", cat:"practical"},
  {date:"2026-11-09", time:"", title:"PE mock practical exam", detail:"", cat:"practical"},
  {date:"2026-11-10", time:"09:00", title:"Science / Chemistry", detail:"", cat:"exam"},
  {date:"2026-11-11", time:"09:00", title:"English Language paper 1", detail:"", cat:"exam"},
  {date:"2026-11-12", time:"11:00", title:"French & Spanish — writing", detail:"", cat:"lang"},
  {date:"2026-11-12", time:"", title:"Science / Physics", detail:"In lessons", cat:"exam"},
  {date:"2026-11-13", time:"09:00", title:"History", detail:"", cat:"exam"},
  {date:"2026-11-13", time:"13:00", title:"Computer Science", detail:"", cat:"exam"},
  {date:"2026-11-13", time:"13:00", title:"GCSE Music", detail:"", cat:"exam"},

  {date:"2026-11-16", time:"", title:"MFL mock speaking exams begin", detail:"8 school days", cat:"lang"},
  {date:"2026-11-19", time:"", title:"Component 2 acting practical — 11B", detail:"", cat:"practical"},
  {date:"2026-11-20", time:"", title:"Component 2 acting practical — 11C", detail:"", cat:"practical"},

  {date:"2026-12-02", time:"", title:"BTEC Music Component 2 recording", detail:"", cat:"practical"},
  {date:"2026-12-03", time:"", title:"Sixth form entrance results day", detail:"", cat:"entrance"},
  {date:"2026-12-03", time:"", title:"Y11 parents consultation evening", detail:"", cat:"event"},

  {date:"2027-01-12", time:"", title:"Y11 mock interviews", detail:"", cat:"event"},

  {date:"2027-02-01", time:"", title:"Food & Nutrition practical", detail:"Provisional", cat:"practical"},
  {date:"2027-02-02", time:"", title:"Food & Nutrition practical", detail:"Provisional", cat:"practical"},
  {date:"2027-02-09", time:"", title:"Food & Nutrition practical", detail:"Provisional", cat:"practical"},
  {date:"2027-02-10", time:"", title:"Y11 profile reports issued", detail:"", cat:"event"},
  {date:"2027-02-10", time:"", title:"Food & Nutrition practical", detail:"Provisional", cat:"practical"},

  {date:"2027-02-22", time:"", title:"Entrance exam week 2 begins", detail:"", cat:"entrance"},
  {date:"2027-02-23", time:"09:00", title:"Maths paper 1", detail:"Entrance exam 2", cat:"entrance"},
  {date:"2027-02-24", time:"09:00", title:"Maths paper 2", detail:"Entrance exam 2", cat:"entrance"},
  {date:"2027-02-25", time:"09:00", title:"English Literature paper 1", detail:"Entrance exam 2", cat:"entrance"},
  {date:"2027-02-26", time:"09:00", title:"Maths paper 3", detail:"Entrance exam 2", cat:"entrance"},
  {date:"2027-03-01", time:"09:00", title:"English Language paper 2", detail:"Entrance exam 2", cat:"entrance"},

  {date:"2027-03-02", time:"", title:"MFL speaking mock exams begin", detail:"8 school days", cat:"lang"},
  {date:"2027-03-09", time:"", title:"Art examination", detail:"", cat:"exam"},
  {date:"2027-03-11", time:"", title:"Art examination", detail:"", cat:"exam"},
  {date:"2027-03-18", time:"", title:"Art examination", detail:"", cat:"exam"},
  {date:"2027-03-19", time:"08:30", title:"Y11 photos", detail:"Whole year group photo", cat:"event"},
  {date:"2027-03-24", time:"", title:"Component 3 Performing Arts practical — 11C", detail:"", cat:"practical"},
  {date:"2027-03-25", time:"", title:"Component 3 Performing Arts practical — 11B", detail:"", cat:"practical"},

  {date:"2027-04-26", time:"", title:"MFL GCSE speaking exams begin", detail:"10 school days", cat:"lang"},
  {date:"2027-04-28", time:"", title:"BTEC Music Component 3 recording", detail:"", cat:"practical"},

  {date:"2027-05-04", time:"", title:"GCSE examinations begin", detail:"", cat:"exam"},
  {date:"2027-05-21", time:"", title:"Y11 shirt signing day", detail:"", cat:"event"},

  {date:"2027-06-23", time:"", title:"Y11 prom", detail:"", cat:"event"},
  {date:"2027-06-24", time:"14:30", title:"Y11 celebration assembly", detail:"", cat:"event"}
];

EVENTS.forEach(e => e._d = new Date(e.date + "T00:00:00"));
EVENTS.sort((a,b) => a._d - b._d || (a.time||"").localeCompare(b.time||""));

let activeCats = new Set(Object.keys(CATS));
let view = "month";
let cursor = new Date(2026, 8, 11);
const TODAY = new Date(2026, 8, 11);

function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function visibleEvents(){return EVENTS.filter(e=>activeCats.has(e.cat));}
function startOfWeek(d){const nd=new Date(d);const day=(nd.getDay()+6)%7;nd.setDate(nd.getDate()-day);nd.setHours(0,0,0,0);return nd;}

function renderFilters(){
  const box = document.getElementById("filterList");
  box.innerHTML = "";
  Object.entries(CATS).forEach(([key,c])=>{
    const n = EVENTS.filter(e=>e.cat===key).length;
    const chip = document.createElement("div");
    chip.className = "chip" + (activeCats.has(key) ? "" : " off");
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}<span class="count">${n}</span>`;
    chip.onclick = ()=>{
      if(activeCats.has(key)) activeCats.delete(key); else activeCats.add(key);
      renderFilters(); renderView();
    };
    box.appendChild(chip);
  });
}

function renderNextUp(){
  const now = TODAY;
  const upcoming = visibleEvents().filter(e=>e._d >= now);
  const box = document.getElementById("nextUp");
  if(!upcoming.length){
    box.innerHTML = `<p class="label">Next up</p><p class="title">Nothing scheduled in the selected categories.</p>`;
    return;
  }
  const e = upcoming[0];
  const days = Math.round((e._d - now)/86400000);
  const when = e._d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
  box.innerHTML = `
    <p class="label">Next up</p>
    <p class="when">${when}${e.time ? " · " + e.time : ""}</p>
    <p class="title">${e.title}</p>
    <div class="count"><span class="n">${days===0?"Today":days}</span><span class="u">${days===0?"":(days===1?"day away":"days away")}</span></div>
  `;
}

function renderView(){
  renderNextUp();
  const root = document.getElementById("viewRoot");
  root.innerHTML = "";
  if(view==="month") renderMonth(root);
  else if(view==="week") renderWeek(root);
  else renderAgenda(root);
}

function renderMonth(root){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById("periodLabel").textContent = cursor.toLocaleDateString('en-GB',{month:'long', year:'numeric'});

  const wrap = document.createElement("div");
  const wdRow = document.createElement("div");
  wdRow.className = "weekday-row";
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d=>{
    const c = document.createElement("div"); c.textContent = d; wdRow.appendChild(c);
  });
  wrap.appendChild(wdRow);

  const grid = document.createElement("div");
  grid.className = "month-grid";

  const firstOfMonth = new Date(y,m,1);
  const startPad = (firstOfMonth.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const gridStart = new Date(y,m,1-startPad);

  const evs = visibleEvents();

  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const inMonth = d.getMonth()===m;
    if(i>=35 && d.getMonth()!==m && daysInMonth+startPad<=35) continue;
    const cell = document.createElement("div");
    cell.className = "day-cell" + (inMonth?"":" pad") + (sameDay(d,TODAY)?" today":"");
    const num = document.createElement("div");
    num.className = "day-num";
    num.textContent = d.getDate();
    cell.appendChild(num);

    const dayEvs = evs.filter(e=>sameDay(e._d,d));
    const maxShow = 3;
    dayEvs.slice(0,maxShow).forEach(e=>{
      const p = document.createElement("div");
      p.className = "ev-pill";
      p.style.background = CATS[e.cat].tint;
      p.style.color = CATS[e.cat].deep;
      p.textContent = (e.time? e.time+" " : "") + e.title;
      p.title = e.title + (e.detail? " — "+e.detail : "");
      cell.appendChild(p);
    });
    if(dayEvs.length>maxShow){
      const more = document.createElement("div");
      more.className = "ev-more";
      more.textContent = `+${dayEvs.length-maxShow} more`;
      cell.appendChild(more);
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  root.appendChild(wrap);
}

function renderWeek(root){
  const start = startOfWeek(cursor);
  const end = new Date(start); end.setDate(start.getDate()+6);
  document.getElementById("periodLabel").textContent =
    start.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + " – " + end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  const list = document.createElement("div");
  list.className = "week-list";
  const evs = visibleEvents();

  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const dayEvs = evs.filter(e=>sameDay(e._d,d));
    const card = document.createElement("div");
    card.className = "week-day" + (sameDay(d,TODAY)?" today":"");
    const head = document.createElement("div");
    head.className = "wd-head";
    head.innerHTML = `<span class="dow">${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><span class="dnum">${d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</span>`;
    card.appendChild(head);
    if(!dayEvs.length){
      const e = document.createElement("p");
      e.className = "wd-empty";
      e.textContent = "Nothing scheduled.";
      card.appendChild(e);
    } else {
      dayEvs.forEach(e=>{
        const row = document.createElement("div");
        row.className = "wk-ev";
        row.innerHTML = `
          <div class="bar" style="background:${CATS[e.cat].color}"></div>
          <div class="time">${e.time||""}</div>
          <div class="txt"><div class="t">${e.title}</div>${e.detail?`<div class="d">${e.detail}</div>`:""}</div>
        `;
        card.appendChild(row);
      });
    }
    list.appendChild(card);
  }
  root.appendChild(list);
}

function renderAgenda(root){
  document.getElementById("periodLabel").textContent = "Full agenda";
  const evs = visibleEvents();
  if(!evs.length){
    root.innerHTML = `<p class="empty-msg">No events match the selected categories.</p>`;
    return;
  }
  const byMonth = {};
  evs.forEach(e=>{
    const key = e._d.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
    (byMonth[key] = byMonth[key]||[]).push(e);
  });
  Object.entries(byMonth).forEach(([month, list])=>{
    const sec = document.createElement("div");
    sec.className = "agenda-month";
    const h = document.createElement("h3"); h.textContent = month; sec.appendChild(h);
    list.forEach(e=>{
      const row = document.createElement("div");
      row.className = "agenda-row";
      row.innerHTML = `
        <div class="agenda-date">${e._d.toLocaleDateString('en-GB',{day:'2-digit'})}<span>${e._d.toLocaleDateString('en-GB',{weekday:'short'})}</span></div>
        <div class="agenda-body">
          <span class="agenda-tag" style="background:${CATS[e.cat].tint}; color:${CATS[e.cat].deep}">${CATS[e.cat].label}${e.time? " · "+e.time : ""}</span>
          <p class="agenda-title">${e.title}</p>
          ${e.detail?`<p class="agenda-detail">${e.detail}</p>`:""}
        </div>
      `;
      sec.appendChild(row);
    });
    root.appendChild(sec);
  });
}

document.getElementById("viewSwitch").addEventListener("click", (e)=>{
  const btn = e.target.closest("button"); if(!btn) return;
  view = btn.dataset.view;
  [...document.querySelectorAll("#viewSwitch button")].forEach(b=>b.classList.toggle("active", b===btn));
  renderView();
});

document.getElementById("prevBtn").onclick = ()=>{
  if(view==="month") cursor.setMonth(cursor.getMonth()-1);
  else cursor.setDate(cursor.getDate()-7);
  renderView();
};
document.getElementById("nextBtn").onclick = ()=>{
  if(view==="month") cursor.setMonth(cursor.getMonth()+1);
  else cursor.setDate(cursor.getDate()+7);
  renderView();
};
document.getElementById("todayBtn").onclick = ()=>{
  cursor = new Date(TODAY);
  renderView();
};

renderFilters();
renderView();
</script>
</body>
</html>

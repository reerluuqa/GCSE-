<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 11 — Trinity CE High School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14172A;
    --ink-soft:#54586F;
    --paper:#FFFFFF;
    --wash:#EFF0F3;
    --line:#E1E2E8;
    --line-strong:#C7C9D4;

    --exam:#E14B2A;      --exam-deep:#5E1E0F;
    --entrance:#C6870B;  --entrance-deep:#5C3A02;
    --practical:#0E8C6E; --practical-deep:#04342C;
    --lang:#6152D9;      --lang-deep:#26215C;
    --event:#C23768;     --event-deep:#4B1528;

    --radius: 10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--wash);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--ink);
    color:#E9EAF2;
    padding:30px 24px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .brand{
    display:flex;
    align-items:flex-start;
    gap:11px;
  }
  .brand svg{flex-shrink:0; margin-top:2px;}
  .brand-text h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    line-height:1.15;
    margin:0 0 4px;
  }
  .brand-text p{
    margin:0;
    font-size:12px;
    color:#9498B8;
    line-height:1.5;
  }

  nav.views{
    display:flex;
    background:#22253F;
    border-radius:8px;
    padding:3px;
    gap:3px;
  }
  nav.views button{
    flex:1;
    background:transparent;
    border:none;
    color:#9498B8;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 0;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  nav.views button.active{
    background:var(--exam);
    color:#fff;
  }

  .filters{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .filters .heading{
    font-size:11.5px;
    color:#8B8FB0;
    margin:0 0 2px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:9px;
    background:#22253F;
    border:1px solid #2E3151;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    color:#D3D5E6;
    user-select:none;
    transition:opacity .15s ease, border-color .15s ease;
  }
  .chip .dot{
    width:11px;height:11px;border-radius:3px;flex-shrink:0;
  }
  .chip .count{
    margin-left:auto;
    font-size:12px;
    font-weight:500;
    color:#7377A0;
  }
  .chip.off{opacity:.32;}
  .chip:hover{border-color:#43466E;}

  .side-foot{
    margin-top:auto;
    border-top:1px solid #262A48;
    padding-top:16px;
    font-size:11.5px;
    color:#6E7296;
    line-height:1.6;
  }

  /* ---------- MAIN ---------- */
  main{
    padding:28px 36px 60px;
    max-width:1120px;
  }

  /* HERO */
  .hero{
    background:var(--ink);
    border-radius:16px;
    padding:26px 30px 22px;
    color:#fff;
    position:relative;
    overflow:hidden;
    margin-bottom:24px;
  }
  .hero-chevrons{
    position:absolute;
    right:-40px;
    top:-30px;
    opacity:.5;
    pointer-events:none;
  }
  .hero-top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    position:relative;
  }
  .hero-count{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .hero-count .n{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:72px;
    line-height:1;
    color:var(--exam);
  }
  .hero-count .copy p{margin:0;}
  .hero-count .l1{font-size:15px; color:#C6C9E4; font-weight:500;}
  .hero-count .l2{font-family:'Fraunces',serif; font-size:15px; color:#fff; margin-top:2px !important;}

  .hero-next{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    max-width:480px;
  }
  .hero-next-card{
    background:#1E2138;
    border:1px solid #2C2F52;
    border-radius:10px;
    padding:10px 13px;
    min-width:132px;
  }
  .hero-next-card .hnc-cat{
    font-size:10.5px;
    font-weight:700;
    margin-bottom:5px;
  }
  .hero-next-card .hnc-title{
    font-size:12.5px;
    font-weight:600;
    color:#fff;
    line-height:1.35;
  }
  .hero-next-card .hnc-date{
    font-size:11px;
    color:#8B8FB0;
    margin-top:4px;
  }

  .timeline{
    margin-top:26px;
    position:relative;
    height:46px;
  }
  .timeline-track{
    position:absolute;
    top:8px;
    left:0; right:0;
    height:2px;
    background:#33365A;
  }
  .timeline-track .fill{
    position:absolute;
    top:0; left:0;
    height:2px;
    background:var(--exam);
  }
  .timeline-dot{
    position:absolute;
    top:2px;
    width:14px;height:14px;
    border-radius:50%;
    background:#1E2138;
    border:2px solid #565A82;
    transform:translateX(-50%);
  }
  .timeline-dot.past{border-color:var(--exam); background:var(--exam);}
  .timeline-label{
    position:absolute;
    top:22px;
    transform:translateX(-50%);
    font-size:10.5px;
    color:#9498B8;
    white-space:nowrap;
    text-align:center;
    line-height:1.4;
  }
  .timeline-label b{display:block; color:#DCDEF0; font-size:11px; font-weight:600;}

  /* topbar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:14px;
  }
  .topbar h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0;
  }
  .nav-btns{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .nav-btns button{
    height:34px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    cursor:pointer;
    font-size:15px;
    color:var(--ink);
  }
  .nav-btns button:not(.today){width:34px;}
  .nav-btns button:hover{background:var(--wash);}
  .nav-btns .today{
    padding:0 14px;
    font-size:12.5px;
    font-weight:700;
    font-family:'Inter',sans-serif;
  }

  /* Month grid */
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .weekday-row div{
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    text-align:left;
    padding:0 4px;
    text-transform:uppercase;
    letter-spacing:.3px;
  }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:108px;
    gap:6px;
  }
  .day-cell{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:0;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    cursor:default;
    transition:border-color .12s ease;
  }
  .day-cell.has-events{cursor:pointer;}
  .day-cell.has-events:hover{border-color:var(--line-strong);}
  .day-cell.pad{background:transparent;border-color:transparent;cursor:default;}
  .day-cell.today{border-color:var(--ink); border-width:2px;}
  .day-cell.selected{border-color:var(--exam); border-width:2px;}
  .cat-strip{
    display:flex;
    height:4px;
    width:100%;
    flex-shrink:0;
  }
  .cat-strip span{flex:1;}
  .day-inner{padding:6px 7px; flex:1; display:flex; flex-direction:column; gap:3px; min-height:0;}
  .day-num{
    font-family:'Fraunces',serif;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  .day-cell.pad .day-num{color:var(--line-strong);}
  .ev-pill{
    font-size:10.5px;
    line-height:1.3;
    padding:2px 6px;
    border-radius:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:700;
    color:#fff;
  }
  .ev-more{
    font-size:10px;
    font-weight:600;
    color:var(--ink-soft);
    padding:1px 6px;
  }

  /* Day detail panel */
  .day-detail{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 20px;
    margin-top:14px;
  }
  .day-detail h4{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
  }
  .dd-row{
    display:flex;
    gap:12px;
    padding:9px 0;
    border-top:1px solid var(--line);
    align-items:flex-start;
  }
  .dd-row:first-of-type{border-top:none;}
  .dd-tag{
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    padding:2px 8px;
    border-radius:5px;
    flex-shrink:0;
    margin-top:1px;
  }
  .dd-body .t{font-size:14px; font-weight:600;}
  .dd-body .d{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .dd-body .tm{font-size:12px; color:var(--ink-soft); font-weight:600;}

  /* Week view */
  .week-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .week-day{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 18px;
  }
  .week-day.today{border-color:var(--ink); border-width:2px;}
  .week-day .wd-head{
    display:flex;
    align-items:baseline;
    gap:9px;
    margin-bottom:8px;
  }
  .week-day .wd-head .dow{
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .week-day .wd-head .dnum{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:600;
  }
  .week-day .wd-empty{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .wk-ev{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:8px 10px;
    border-radius:8px;
    margin-top:4px;
  }
  .wk-ev .time{
    font-size:12px;
    color:var(--ink-soft);
    min-width:48px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    padding-top:1px;
  }
  .wk-ev .txt .t{font-size:14px;font-weight:700;}
  .wk-ev .txt .d{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}

  /* Agenda view */
  .agenda-month{margin-bottom:26px;}
  .agenda-month h3{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
    color:var(--ink-soft);
  }
  .agenda-row{
    display:flex;
    gap:14px;
    padding:10px 4px;
    border-top:1px solid var(--line);
    align-items:flex-start;
  }
  .agenda-row:first-child{border-top:none;}
  .agenda-date{
    width:70px;
    flex-shrink:0;
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    padding-top:1px;
  }
  .agenda-date span{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .agenda-body{flex:1;}
  .agenda-tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    padding:2px 8px;
    border-radius:5px;
    margin-bottom:4px;
  }
  .agenda-title{font-size:14.5px;font-weight:700;margin:0 0 2px;}
  .agenda-detail{font-size:13px;color:var(--ink-soft);margin:0;}

  .empty-msg{
    text-align:center;
    padding:60px 0;
    color:var(--ink-soft);
    font-size:14px;
  }

  @media (max-width: 860px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      flex-direction:row;
      flex-wrap:wrap;
      align-items:center;
      padding:16px 18px;
    }
    .brand{width:100%;}
    nav.views{flex:1;min-width:200px;}
    .filters{width:100%;flex-direction:row;flex-wrap:wrap;}
    .chip{flex:1;min-width:120px;}
    .side-foot{display:none;}
    main{padding:20px 16px 50px;}
    .hero{padding:20px 18px 18px;}
    .hero-count .n{font-size:52px;}
    .hero-next{display:none;}
    .month-grid{grid-auto-rows:80px;}
    .ev-pill{font-size:9px;}
    .timeline-label{font-size:9px;}
  }
</style>

</head>

    <div id="viewRoot"></div>
    <div id="dayDetailRoot"></div>
  </main>

</div>

  {date:"2027-06-24", time:"14:30", title:"Y11 celebration assembly", detail:"", cat:"event"}
];

EVENTS.forEach(e => e._d = new Date(e.date + "T00:00:00"));
EVENTS.sort((a,b) => a._d - b._d || (a.time||"").localeCompare(b.time||""));

const TIMELINE_POINTS = [
  {date:"2026-10-06", label:"Entrance exams wk 1"},
  {date:"2026-11-03", label:"November exams"},
  {date:"2026-12-03", label:"Results & consultation"},
  {date:"2027-02-23", label:"Entrance exams wk 2"},
  {date:"2027-05-04", label:"GCSEs begin"},
  {date:"2027-06-23", label:"Prom"}
];
const TL_START = new Date(2026,8,1);
const TL_END   = new Date(2027,6,1);

let activeCats = new Set(Object.keys(CATS));
let view = "month";
let cursor = new Date(2026, 8, 11);
const TODAY = new Date(2026, 8, 11);
let selectedDate = null;

function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function visibleEvents(){return EVENTS.filter(e=>activeCats.has(e.cat));}
function startOfWeek(d){const nd=new Date(d);const day=(nd.getDay()+6)%7;nd.setDate(nd.getDate()-day);nd.setHours(0,0,0,0);return nd;}
function pct(d){return (d-TL_START)/(TL_END-TL_START)*100;}

function renderFilters(){
  const box = document.getElementById("filterList");
  box.innerHTML = "";
  Object.entries(CATS).forEach(([key,c])=>{
    const n = EVENTS.filter(e=>e.cat===key).length;
    const chip = document.createElement("div");
    chip.className = "chip" + (activeCats.has(key) ? "" : " off");
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}<span class="count">${n}</span>`;
    chip.onclick = ()=>{
      if(activeCats.has(key)) activeCats.delete(key); else activeCats.add(key);
      renderFilters(); renderView();
    };
    box.appendChild(chip);
  });
}

function renderHero(){
  const gcse = new Date(2027,4,4);
  const days = Math.round((gcse - TODAY)/86400000);
  document.getElementById("heroDays").textContent = days;

  const upcoming = EVENTS.filter(e=>e._d >= TODAY).slice(0,3);
  const box = document.getElementById("heroNext");
  box.innerHTML = upcoming.map(e=>`
    <div class="hero-next-card">
      <div class="hnc-cat" style="color:${CATS[e.cat].color}">${CATS[e.cat].label}</div>
      <div class="hnc-title">${e.title}</div>
      <div class="hnc-date">${e._d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}${e.time? " · "+e.time:""}</div>
    </div>
  `).join("");

  const tlBox = document.getElementById("timeline");
  const todayPct = pct(TODAY);
  let html = `<div class="timeline-track"><div class="fill" style="width:${todayPct}%"></div></div>`;
  TIMELINE_POINTS.forEach(p=>{
    const d = new Date(p.date+"T00:00:00");
    const p_ = pct(d);
    const past = d <= TODAY;
    html += `<div class="timeline-dot ${past?'past':''}" style="left:${p_}%"></div>`;
    html += `<div class="timeline-label" style="left:${p_}%"><b>${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</b>${p.label}</div>`;
  });
  tlBox.innerHTML = html;
}

function renderView(){
  renderHero();
  const root = document.getElementById("viewRoot");
  root.innerHTML = "";
  document.getElementById("dayDetailRoot").innerHTML = "";
  if(view==="month") renderMonth(root);
  else if(view==="week") renderWeek(root);
  else renderAgenda(root);
}

function renderMonth(root){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById("periodLabel").textContent = cursor.toLocaleDateString('en-GB',{month:'long', year:'numeric'});

  const wrap = document.createElement("div");
  const wdRow = document.createElement("div");
  wdRow.className = "weekday-row";
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d=>{
    const c = document.createElement("div"); c.textContent = d; wdRow.appendChild(c);
  });
  wrap.appendChild(wdRow);

  const grid = document.createElement("div");
  grid.className = "month-grid";

  const firstOfMonth = new Date(y,m,1);
  const startPad = (firstOfMonth.getDay()+6)%7;
  const gridStart = new Date(y,m,1-startPad);

  const evs = visibleEvents();

  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const inMonth = d.getMonth()===m;
    const cell = document.createElement("div");
    const dayEvs = evs.filter(e=>sameDay(e._d,d));
    cell.className = "day-cell" + (inMonth?"":" pad") + (sameDay(d,TODAY)?" today":"") +
      (selectedDate && sameDay(d,selectedDate)?" selected":"") + (dayEvs.length?" has-events":"");

    if(dayEvs.length){
      const cats = [...new Set(dayEvs.map(e=>e.cat))].slice(0,4);
      const strip = document.createElement("div");
      strip.className = "cat-strip";
      cats.forEach(c=>{
        const s = document.createElement("span");
        s.style.background = CATS[c].color;
        strip.appendChild(s);
      });
      cell.appendChild(strip);
    }

    const inner = document.createElement("div");
    inner.className = "day-inner";
    const num = document.createElement("div");
    num.className = "day-num";
    num.textContent = d.getDate();
    inner.appendChild(num);

    const maxShow = 2;
    dayEvs.slice(0,maxShow).forEach(e=>{
      const p = document.createElement("div");
      p.className = "ev-pill";
      p.style.background = CATS[e.cat].color;
      p.textContent = (e.time? e.time+" " : "") + e.title;
      inner.appendChild(p);
    });
    if(dayEvs.length>maxShow){
      const more = document.createElement("div");
      more.className = "ev-more";
      more.textContent = `+${dayEvs.length-maxShow} more`;
      inner.appendChild(more);
    }
    cell.appendChild(inner);

    if(inMonth && dayEvs.length){
      cell.addEventListener("click", ()=>{
        selectedDate = sameDay(d,selectedDate) ? null : new Date(d);
        renderMonth(document.getElementById("viewRoot"));
        renderDayDetail();
      });
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  root.innerHTML = "";
  root.appendChild(wrap);
  renderDayDetail();
}

function renderDayDetail(){
  const box = document.getElementById("dayDetailRoot");
  if(!selectedDate || view!=="month"){ box.innerHTML = ""; return; }
  const dayEvs = visibleEvents().filter(e=>sameDay(e._d,selectedDate));
  if(!dayEvs.length){ box.innerHTML = ""; return; }
  const head = selectedDate.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
  box.innerHTML = `
    <div class="day-detail">
      <h4>${head}</h4>
      ${dayEvs.map(e=>`
        <div class="dd-row">
          <span class="dd-tag" style="background:${CATS[e.cat].color}">${CATS[e.cat].label}</span>
          <div class="dd-body">
            ${e.time? `<div class="tm">${e.time}</div>`:""}
            <div class="t">${e.title}</div>
            ${e.detail? `<div class="d">${e.detail}</div>`:""}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderWeek(root){
  const start = startOfWeek(cursor);
  const end = new Date(start); end.setDate(start.getDate()+6);
  document.getElementById("periodLabel").textContent =
    start.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + " – " + end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  const list = document.createElement("div");
  list.className = "week-list";
  const evs = visibleEvents();

  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const dayEvs = evs.filter(e=>sameDay(e._d,d));
    const card = document.createElement("div");
    card.className = "week-day" + (sameDay(d,TODAY)?" today":"");
    const head = document.createElement("div");
    head.className = "wd-head";
    head.innerHTML = `<span class="dow">${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><span class="dnum">${d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</span>`;
    card.appendChild(head);
    if(!dayEvs.length){
      const e = document.createElement("p");
      e.className = "wd-empty";
      e.textContent = "Nothing scheduled.";
      card.appendChild(e);
    } else {
      dayEvs.forEach(e=>{
        const row = document.createElement("div");
        row.className = "wk-ev";
        row.style.background = "color-mix(in srgb, " + CATS[e.cat].color + " 12%, white)";
        row.innerHTML = `
          <div class="time">${e.time||""}</div>
          <div class="txt"><div class="t">${e.title}</div>${e.detail?`<div class="d">${e.detail}</div>`:""}</div>
        `;
        card.appendChild(row);
      });
    }
    list.appendChild(card);
  }
  root.appendChild(list);
}

function renderAgenda(root){
  document.getElementById("periodLabel").textContent = "Full agenda";
  const evs = visibleEvents();
  if(!evs.length){
    root.innerHTML = `<p class="empty-msg">No events match the selected categories.</p>`;
    return;
  }
  const byMonth = {};
  evs.forEach(e=>{
    const key = e._d.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
    (byMonth[key] = byMonth[key]||[]).push(e);
  });
  Object.entries(byMonth).forEach(([month, list])=>{
    const sec = document.createElement("div");
    sec.className = "agenda-month";
    const h = document.createElement("h3"); h.textContent = month; sec.appendChild(h);
    list.forEach(e=>{
      const row = document.createElement("div");
      row.className = "agenda-row";
      row.innerHTML = `
        <div class="agenda-date">${e._d.toLocaleDateString('en-GB',{day:'2-digit'})}<span>${e._d.toLocaleDateString('en-GB',{weekday:'short'})}</span></div>
        <div class="agenda-body">
          <span class="agenda-tag" style="background:${CATS[e.cat].color}">${CATS[e.cat].label}${e.time? " · "+e.time : ""}</span>
          <p class="agenda-title">${e.title}</p>
          ${e.detail?`<p class="agenda-detail">${e.detail}</p>`:""}
        </div>
      `;
      sec.appendChild(row);
    });
    root.appendChild(sec);
  });
}

document.getElementById("viewSwitch").addEventListener("click", (e)=>{
  const btn = e.target.closest("button"); if(!btn) return;
  view = btn.dataset.view;
  [...document.querySelectorAll("#viewSwitch button")].forEach(b=>b.classList.toggle("active", b===btn));
  renderView();
});

document.getElementById("prevBtn").onclick = ()=>{
  if(view==="month") cursor.setMonth(cursor.getMonth()-1);
  else cursor.setDate(cursor.getDate()-7);
  renderView();
};
document.getElementById("nextBtn").onclick = ()=>{
  if(view==="month") cursor.setMonth(cursor.getMonth()+1);
  else cursor.setDate(cursor.getDate()+7);
  renderView();
};
document.getElementById("todayBtn").onclick = ()=>{
  cursor = new Date(TODAY);
  renderView();
};

renderFilters();
renderView();
</script>

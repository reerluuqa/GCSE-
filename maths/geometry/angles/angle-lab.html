:12px;font-weight:650;background:#f7f9f2}.tag.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.tag.lime{background:#edf4d4;border-color:#dae8af}.notice{border-left:3px solid #a6bb63;background:#eaf0dc;padding:14px 18px;border-radius:0 8px 8px 0;margin:18px 0;font-size:14px}.twocol{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:22px}.question h2{font-size:25px;line-height:1.4;margin-top:20px;letter-spacing:-.4px}.options{display:grid;gap:10px;margin:22px 0}.option{font-weight:500;text-align:left;display:flex;gap:13px;align-items:center;padding:15px 16px}.option b{display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;min-width:28px;height:28px;font-size:12px}.option.selected{border:2px solid var(--green);padding:14px 15px;background:#edf4e6}.option.correct{border-color:var(--green);background:#e8f3df;opacity:1}.option.wrong{background:#fff0e8;border-color:#bb6039;opacity:1}.answer-line{margin:24px 0}.answer-line label{display:block;font-weight:650;margin-bottom:8px}.answer-line input{width:200px;font-size:22px}.diagram{background:#f7f9f3;border:1px solid var(--line);border-radius:12px;text-align:center;margin-top:18px}.diagram svg{max-width:400px;width:100%;height:230px}.diagram small{display:block;color:var(--muted);font-size:11px;margin-bottom:8px}svg path,svg line,svg circle{fill:none;stroke:var(--green);stroke-width:2.2;stroke-linejoin:round}svg text{font:15px system-ui;fill:var(--ink)}svg .dash{stroke-dasharray:6 5;stroke:#9b7018}.progress-track{height:6px;border-radius:8px;background:#dde5d4;overflow:hidden;margin:15px 0 25px}.progress-track i{height:100%;background:var(--green);display:block}.feedback{margin-top:24px;border-top:1px solid var(--line);padding-top:23px}.feedback h3{font-size:22px}.feedback li{padding-left:3px;margin-bottom:10px}.feedback ol{padding-left:24px}.callout{padding:15px;border-radius:10px;background:#edf4e6;margin-top:14px;font-size:14px}.callout.warn{background:var(--rose)}.callout strong{display:block;margin-bottom:3px}.side{position:sticky;top:20px;align-self:start}.side .card{margin-bottom:16px}.side p,.side li{font-size:14px}.side ol{padding-left:20px}.side li{margin-bottom:10px}details{border:1px solid var(--line);padding:14px 18px;border-radius:10px;background:#fff;margin:12px 0}summary{cursor:pointer;font-weight:650}details p{margin:12px 0 0}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:15px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 9px}th{font-size:12px;color:var(--muted)}.table-scroll{overflow-x:auto}.formula{font-size:20px;letter-spacing:.3px;margin:14px 0}.error{color:#a23d1d;font-weight:650;min-height:24px;font-size:14px}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.circle-svg{width:100%;max-height:340px}.circle-svg .projection{stroke:#a77313;stroke-dasharray:4 4}.circle-svg text{font-size:13px}.slider{width:100%;padding:0;accent-color:var(--green)}.tool-result{font-size:21px;background:#edf3e4;padding:15px;border-radius:10px;margin-top:15px;overflow-wrap:anywhere}.field{display:grid;gap:5px;margin:14px 0}.field label{font-size:13px;font-weight:650}.note{font-size:12px;color:var(--muted)}footer{padding:24px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.empty{text-align:center;padding:55px 22px}.empty p{max-width:520px;margin:10px auto 25px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{border:1px solid var(--line);border-radius:16px;padding:26px;max-width:420px;width:calc(100% - 35px);color:var(--ink)}dialog::backdrop{background:#15362faa}.tip-list{padding-left:20px}.tip-list li{margin-bottom:9px}#storageNote{margin:10px auto} @media(max-width:950px){header .wrap{gap:12px;padding-top:16px;padding-bottom:16px}nav{order:3;width:100%;margin:0} .profile{margin-left:auto}.hero{gap:22px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:1fr 1fr;gap:15px}.toolgrid{grid-template-columns:1fr}}@media(max-width:580px){.wrap{padding-left:17px;padding-right:17px}.hero{grid-template-columns:1fr;padding-top:5px;gap:15px}.hero-art{display:none}h1{font-size:42px}.grid{grid-template-columns:1fr}.topic{min-height:180px}.stats{margin-bottom:26px}.stat{padding:16px 10px}.stat strong{font-size:20px}.stat span{font-size:11px}.card{padding:19px}.side{grid-template-columns:1fr}.question h2{font-size:21px}.profile select{max-width:105px}.brand{font-size:20px}nav{justify-content:space-between}nav button{font-size:13px;padding:9px 11px}.row.actions button{width:100%}}@media print{header,footer,button,.side,.hero-art,.profile{display:none!important}body{background:white}main{padding:0!important}.card{box-shadow:none;break-inside:avoid}.twocol{display:block}h1{font-size:30px}.grid{grid-template-columns:1fr 1fr}.feedback{display:block}}

<script>
/* All content, styling and behaviour are embedded. No network requests or dependencies. */
const topics=[
['rules','Choose the method','Read the clues before calculating.','01'],['right','Right-angled triangles','SOH CAH TOA and Pythagoras.','02'],['sine','Sine rule','Match each side to its opposite angle.','03'],['cosine','Cosine rule','Two sides and the included angle, or three sides.','04'],['area','Triangle areas','Perpendicular height or ½ab sin C.','05'],['shapes','Across 2D shapes','Split a shape and share a diagonal.','06'],['space','3D triangles','Find the right triangle inside the solid.','07'],['solids','Areas & volumes','Cylinders, cones, spheres and composites.','08'],['parallel','Parallel line angles','Name the reason, then build an equation.','09'],['exact','Exact trig values','Fractions and surds, without a calculator.','10'],['circle','The unit circle','Connect angles with coordinates.','11'],['bearings','Bearings','Clockwise from north, using three figures.','12']
];
const bank=[]; const rad=x=>x*Math.PI/180,sin=x=>Math.sin(rad(x)),cos=x=>Math.cos(rad(x)),tan=x=>Math.tan(rad(x)),asin=x=>Math.asin(x)*180/Math.PI,acos=x=>Math.acos(x)*180/Math.PI,atan=x=>Math.atan(x)*180/Math.PI,fmt=x=>Number(x.toFixed(4)).toString();
function mc(t,l,p,opts,correct,why,steps,tip,mistake,diagram=''){bank.push({id:t+'-'+bank.filter(q=>q.t===t).length,t,l,p,opts,correct,why,steps,tip,mistake,diagram,calc:false});}
function num(t,l,p,answer,unit,why,steps,tip,mistake,diagram='',dp=1,calc=true){bank.push({id:t+'-'+bank.filter(q=>q.t===t).length,t,l,p,answer,unit,why,steps,tip,mistake,diagram,dp,calc});}
const triangle=(a='A',b='B',c='C',ab='',ac='',bc='',ang='')=>`<svg viewBox="0 0 400 240" role="img" aria-label="Triangle ${a} ${b} ${c}. ${ab}; ${ac}; ${bc}; ${ang}. Schematic, not to scale"><path d="M65 190L325 190L150 40Z"/><text x="45" y="208">${a}</text><text x="332" y="208">${b}</text><text x="146" y="28">${c}</text><text x="170" y="218">${ab}</text><text x="40" y="105">${ac}</text><text x="255" y="105">${bc}</text><text x="98" y="177">${ang}</text></svg>`;
const cuboid=`<svg viewBox="0 0 400 240" role="img" aria-label="Cuboid ABCD EFGH. E F G H are vertically above A B C D. AG is the space diagonal."><path d="M65 195H265V85H65Z M65 85L125 35H325V145L265 195 M265 85L325 35 M65 195L125 145H325 M125 35V145"/><path class="dash" d="M65 195L325 35 M65 195L325 145"/><text x="46" y="213">A</text><text x="266" y="215">B</text><text x="334" y="155">C</text><text x="108" y="144">D</text><text x="48" y="81">E</text><text x="264" y="77">F</text><text x="331" y="33">G</text><text x="108" y="30">H</text></svg>`;
const quad=`<svg viewBox="0 0 400 240" role="img" aria-label="Quadrilateral ABCD split into triangles ABC and ACD by diagonal AC. B and D lie on opposite sides of AC."><path d="M55 125L170 30L345 125L210 215Z"/><path class="dash" d="M55 125H345"/><text x="32" y="130">A</text><text x="166" y="23">B</text><text x="351" y="132">C</text><text x="208" y="236">D</text></svg>`;
const north=`<svg viewBox="0 0 400 240" role="img" aria-label="North reference at A, with an example clockwise bearing to B. Schematic only."><path d="M100 205V25 M94 37L100 25L106 37 M100 205L310 100"/><path class="dash" d="M100 135Q145 135 164 173"/><text x="91" y="20">N</text><text x="81" y="222">A</text><text x="315" y="100">B</text><text x="160" y="145">clockwise</text></svg>`;
mc('rules',1,'A triangle has no right angle. You know two angles and one side. Which method usually finds another side?',['Sine rule','Pythagoras','Cosine rule using three sides','½ × base × height'],0,'A known side and its opposite angle give a matching pair.', ['Find the third angle first if needed: angles sum to 180°.','Label opposite pairs a ↔ A and b ↔ B.','Use a/sin A = b/sin B, putting the unknown in the numerator.'],'Mark an opposite pair before writing a formula.','Pythagoras only applies to a right-angled triangle.');
mc('rules',1,'You know two sides and the angle between them. You need the third side. Choose the most direct method.',['Sine rule','Cosine rule','SOH CAH TOA','Triangle area formula'],1,'This is side–angle–side (SAS). There is no complete opposite pair yet.',['Call the missing side a and the included angle A.','Write a² = b² + c² − 2bc cos A.','Substitute, calculate a², then take the positive square root.'],'The angle must be between the two known sides.','Do not forget the square root at the end.');
mc('rules',1,'You know all three sides of a non-right-angled triangle. You need an angle.',['Sine rule immediately','Cosine rule rearranged','tan θ = opposite/adjacent','Add the sides and divide by 180'],1,'Three sides (SSS) fit the cosine rule for an angle.',['Choose the required angle A and its opposite side a.','cos A = (b² + c² − a²)/(2bc).','Use inverse cosine in degree mode.'],'Draw a ring around the side opposite the angle you want.','cos⁻¹ means inverse cosine here, not 1/cos.');
mc('rules',1,'Which statement is always true about a triangle labelled with sides a, b, c and angles A, B, C?',['a is next to A','a is opposite A','a is always the longest side','A must be 90°'],1,'Matching letters identify opposite side–angle pairs.',['Find vertex A.','The side that does not touch A is side a.','Repeat for b/B and c/C.'],'The largest angle is opposite the longest side.','Do not match a side to an angle simply because their labels look close on the page.',triangle('A','B','C','c','b','a'));
mc('rules',2,'A non-right triangle has sides 7 cm and 11 cm enclosing 42°. You need its area, not its third side. What is most efficient?',['Find every angle first','Use ½ × 7 × 11 × sin 42°','Use 7 × 11 × cos 42°','Use ½ × 7 × 11'],1,'Two sides and their included angle are exactly what ½ab sin C requires.',['Identify the two sides touching the 42° angle.','Substitute into area = ½ab sin C.','Give the result in cm².'],'Choose a formula that gives the quantity requested directly.','½ab alone assumes the included angle is 90°.');
mc('rules',3,'A cuboid question asks for the angle between a space diagonal and the base. What should you find first?',['The total surface area','The base diagonal','The volume','The perimeter of a vertical face'],1,'The projection of the space diagonal onto the base is the base diagonal.',['Use Pythagoras on the rectangular base.','Make a right triangle from base diagonal, vertical height and space diagonal.','Use tan θ = vertical height/base diagonal.'],'Sketch the extracted right triangle separately.','Using just the base length misses the width.',cuboid);
mc('right',1,'Relative to angle θ in a right triangle, which equation is correct?',['sin θ = adjacent/hypotenuse','cos θ = opposite/adjacent','tan θ = opposite/adjacent','tan θ = hypotenuse/opposite'],2,'TOA means tangent = opposite ÷ adjacent.',['The hypotenuse is opposite the right angle.','Opposite is across from θ; adjacent touches θ but is not the hypotenuse.','Choose the ratio containing the sides you know or need.'],'Write O, A and H on your sketch.','Opposite and adjacent change when you choose the other acute angle.');
mc('right',1,'Which side is the hypotenuse?',['The horizontal side','The side opposite the right angle','The side next to the chosen acute angle','The shortest side'],1,'The hypotenuse lies opposite 90° and is the longest side.',['Locate the right-angle marker.','Look across the triangle to the side that does not touch it.','Use that side as c in a² + b² = c².'],'The drawing may be rotated.','Never identify the hypotenuse by its slope alone.');
num('right',2,'A right triangle has perpendicular sides 9 cm and 12 cm. Find its hypotenuse.',15,'cm','The sides meet at 90°, so Pythagoras applies.',['c² = 9² + 12² = 225.','c = √225 = 15 cm.'],'A hypotenuse must be longer than either shorter side.','Do not add the lengths instead of their squares.','',1,false);
num('right',2,'A right triangle has hypotenuse 13 cm and one shorter side 5 cm. Find the other side.',12,'cm','The unknown is a shorter side, so subtract squares.',['x² + 5² = 13².','x² = 169 − 25 = 144.','x = 12 cm.'],'Rearrange before calculating.','Adding the squares would incorrectly give a length greater than the hypotenuse.','',1,false);
num('right',2,'A right triangle has hypotenuse 14 cm. Find the side opposite its 38° angle.',14*sin(38),'cm','Opposite and hypotenuse select sine.',['sin 38° = x/14.','x = 14 sin 38° = '+fmt(14*sin(38))+' cm.'],'Use degree mode.','Multiplying by cos 38° finds the adjacent side instead.');
num('right',3,'A 6 m ladder rests against a vertical wall. Its foot is 1.8 m from the wall. Find the angle the ladder makes with the ground.',acos(1.8/6),'°','The ground distance is adjacent and the ladder is the hypotenuse.',['cos θ = 1.8/6 = 0.3.','θ = cos⁻¹(0.3) = '+fmt(acos(.3))+'°.'],'Identify which end of the ladder contains the requested angle.','Using sine with 1.8/6 gives the angle with the wall.');
mc('sine',1,'Which is the sine rule?',['a/sin A = b/sin B','a cos A = b cos B','a² + b² = c²','a/sin B = b/sin A'],0,'Each side is divided by the sine of its opposite angle.',['Pair a with A and b with B.','Write only the two ratios you need.','Rearrange to isolate the unknown.'],'You can also use sin A/a = sin B/b when finding angles.','Never mix side/angle with angle/side across the equals sign.');
mc('sine',1,'When can the sine rule be used directly to find a missing side?',['You know a complete opposite pair and the angle opposite the missing side','You know just three angles','You know two sides and their included angle only','You know one side only'],0,'A complete opposite pair fixes the scale of the triangle.',['Find the known side and the angle across from it.','Match the unknown side to its opposite angle.','Use x = known side × sin(opposite angle of x)/sin(known angle).'],'Angles alone determine shape but not size.','Do not use the included angle as though it were opposite a known side.');
for(const [a,A,B] of [[8,35,70],[12,48,65],[9,42,81]]){let b=a*sin(B)/sin(A);num('sine',2,`In triangle ABC, a = ${a} cm, A = ${A}° and B = ${B}°. Find b.`,b,'cm','You know the opposite pair a/A and the angle opposite b.',[`b/sin ${B}° = ${a}/sin ${A}°.`,`b = ${a} sin ${B}° / sin ${A}° = ${fmt(b)} cm.`],'Check: the larger angle should have the larger opposite side.','Do not reverse the sine fraction.',triangle('A','B','C','c','b = ?',`a = ${a}`,`${A}°`));}
num('sine',3,'In triangle ABC, a = 10 cm, b = 7 cm and A = 50°. Find B. (Use the triangle angle sum to check whether a second solution is possible.)',asin(.7*sin(50)),'°','Use the sine rule in angle form, then check the supplementary angle.',['sin B/7 = sin 50°/10.','sin B = 0.7 sin 50° = '+fmt(.7*sin(50))+'.','B = sin⁻¹(0.7 sin 50°) = '+fmt(asin(.7*sin(50)))+'°.','The supplementary option is about 147.6°; adding 50° exceeds 180°, so it is impossible.'],'Keep full calculator precision until the final line.','Inverse sine returns one angle; sometimes the supplementary angle also works.');
mc('sine',3,'The sine rule gives sin B = 0.6 and A = 20°. Which angles B produce valid triangles?',['36.9° only','143.1° only','Both 36.9° and 143.1°','Neither'],2,'Both angles have sine 0.6 and both leave a positive third angle.',['B₁ = sin⁻¹(0.6) ≈ 36.9°.','B₂ = 180° − 36.9° ≈ 143.1°.','20° + 36.9° < 180° and 20° + 143.1° < 180°. Both are valid.'],'Use any extra information, such as “B is obtuse”, to choose between them.','The SSA information can describe two different triangles.');
mc('cosine',1,'In a² = b² + c² − 2bc cos A, where is angle A?',['Between b and c','Between a and b','Always at the top','Always 90°'],0,'A is opposite a and enclosed by sides b and c.',['Locate the side you want, a.','The opposite vertex is A.','The other two sides meet at A.'],'Relabel your sketch to fit the formula.','The included angle is essential.',triangle('A','B','C','c','b','a','A'));
mc('cosine',1,'Which rearrangement finds angle A from all three sides?',['A = cos((b²+c²−a²)/(2bc))','A = cos⁻¹((b²+c²−a²)/(2bc))','A = sin⁻¹(a/b)','A = (b+c−a)/2'],1,'First isolate cos A, then use inverse cosine.',['Move a² and the cosine term to opposite sides.','2bc cos A = b² + c² − a².','Divide by 2bc and apply cos⁻¹.'],'Put the whole numerator and denominator in brackets.','Using cos instead of cos⁻¹ does not turn a ratio into an angle.');
for(const [b,c,A] of [[7,10,60],[9,13,42],[8,11,120]]){const a=Math.sqrt(b*b+c*c-2*b*c*cos(A));num('cosine',2,`Two sides of a triangle are ${b} cm and ${c} cm, enclosing ${A}°. Find the third side x.`,a,'cm','Two sides and the included angle select the cosine rule.',[`x² = ${b}² + ${c}² − 2 × ${b} × ${c} × cos ${A}°.`,`x² = ${fmt(a*a)}.`,`x = √(${fmt(a*a)}) ≈ ${fmt(a)} cm.`],'For an obtuse included angle, cos is negative; the subtraction then increases x².','Take the square root only after evaluating the entire expression.');}
num('cosine',3,'Triangle ABC has AB = 8 cm, AC = 11 cm and BC = 14 cm. Find angle BAC.',acos((64+121-196)/176),'°','BAC is the angle at A, opposite BC = 14 cm.',['cos A = (8² + 11² − 14²)/(2 × 8 × 11).','cos A = −11/176 = −0.0625.','A = cos⁻¹(−0.0625) = '+fmt(acos(-.0625))+'°.'],'A negative cosine means an obtuse angle.','Subtract the square of the side opposite the angle being found.',triangle('A','B','C','8 cm','11 cm','14 cm','?'));
mc('area',1,'In area = ½ab sin C, what must C be?',['Any angle in the triangle','The angle between sides a and b','The right angle only','The largest angle'],1,'The formula uses the included angle between the two selected sides.',['Choose the two known sides.','Find the angle where they meet.','Substitute into ½ab sin C.'],'If C = 90°, sin C = 1 and the formula becomes ½ab.','A non-included angle cannot be inserted unchanged.');
mc('area',1,'A triangle has base 10 cm, sloping side 8 cm and perpendicular height 6 cm. What is its area?',['40 cm²','60 cm²','30 cm²','48 cm²'],2,'Area uses the perpendicular height, not the sloping side.',['Area = ½ × base × perpendicular height.','Area = ½ × 10 × 6 = 30 cm².'],'Look for the 90° marker on the height.','The sloping side is not usually the height.');

num('area',3,'A triangle has sides 8 cm and 10 cm enclosing an obtuse angle C. Its area is 24 cm². Find C.',180-asin(.6),'°','The area gives a sine value; “obtuse” selects the supplementary angle.',['24 = ½ × 8 × 10 × sin C, so sin C = 0.6.','The acute angle is sin⁻¹(0.6) ≈ 36.8699°.','C = 180° − 36.8699° ≈ 143.1301°.'],'Underline whether the required angle is acute or obtuse.','Stopping at inverse sine would give the wrong angle.');

mc('shapes',1,'A diagonal divides a parallelogram. Which extra fact is always available?',['All four angles are 90°','Opposite sides are equal and parallel','Diagonals are equal','Every side is the same length'],1,'A parallelogram gives matching opposite sides and parallel-line angle facts.',['Mark opposite sides equal.','Use alternate angles when a diagonal crosses the parallel sides.','Use the resulting triangle data to choose a rule.'],'Record geometric facts before calculating.','A general parallelogram is not a rectangle or a rhombus.');
num('shapes',2,'In parallelogram ABCD, AB = 8 cm, AD = 5 cm and angle BAD = 60°. Find diagonal BD.',7,'cm','Triangle ABD has two sides and their included angle.',['BD² = 8² + 5² − 2 × 8 × 5 cos 60°.','BD² = 64 + 25 − 40 = 49.','BD = 7 cm.'],'Name the triangle containing the diagonal you need.','AC is a different diagonal and generally has a different length.');
num('shapes',3,'Quadrilateral ABCD has B and D on opposite sides of AC. AB = 7 cm, BC = 9 cm, angle ABC = 60°, AD = 8 cm and CD = 6 cm. Find angle ADC.',acos((64+36-67)/96),'°','Find shared diagonal AC using the cosine rule, then use it to find the angle at D.',['In ABC: AC² = 7² + 9² − 2 × 7 × 9 cos 60° = 67.','In ADC: cos D = (8² + 6² − AC²)/(2 × 8 × 6).','cos D = 33/96, so D = '+fmt(acos(33/96))+'°.'],'Carry AC² = 67 directly into the second formula to avoid rounding.','At D, the opposite side is AC, not AD or CD.',quad);
num('shapes',3,'Quadrilateral ABCD has B and D on opposite sides of AC. In ABC, AB = 10 cm, angle BAC = 40° and angle ABC = 75°. In ACD, CD = 9 cm and angle ACD = 50°. Find the area of triangle ACD.',.5*(10*sin(75)/sin(65))*9*sin(50),'cm²','Find AC with the sine rule in ABC, then use the included-angle area formula in ACD.',['Angle ACB = 180° − 40° − 75° = 65°.','AC/sin 75° = 10/sin 65°, so AC = '+fmt(10*sin(75)/sin(65))+' cm.','Area ACD = ½ × AC × 9 × sin 50° = '+fmt(.5*(10*sin(75)/sin(65))*9*sin(50))+' cm².'],'Keep the unrounded diagonal in your calculator.','The 50° angle belongs to the second triangle.',quad);
num('shapes',3,'Quadrilateral ABCD has B and D on opposite sides of AC. AB = 6 cm, BC = 8 cm and angle ABC = 90°. AD = CD = 13 cm. Find the total area of ABCD.',84,'cm²','Split the quadrilateral into a right triangle and an isosceles triangle.',['AC = √(6² + 8²) = 10 cm. Area ABC = ½ × 6 × 8 = 24 cm².','In isosceles ACD, the perpendicular height bisects AC into two lengths of 5 cm.','Height = √(13² − 5²) = 12 cm. Area ACD = ½ × 10 × 12 = 60 cm².','Total area = 24 + 60 = 84 cm².'],'Adding triangle areas works because the triangles do not overlap.','Do not use the sloping length 13 as the perpendicular height.',quad,1,false);
mc('space',1,'A cuboid has length l, width w and height h. Which expression gives its space diagonal?',['l + w + h','√(l² + w² + h²)','√(l² + w²)','lwh'],1,'Use Pythagoras twice: once on a face, then through the solid.',['Base diagonal d² = l² + w².','Space diagonal D² = d² + h².','Therefore D = √(l² + w² + h²).'],'This formula relies on the cuboid’s mutually perpendicular edges.','A face diagonal leaves out one dimension.',cuboid);
mc('space',1,'Which angle is the angle between line AG and the base ABCD of a cuboid, with G vertically above C?',['Angle GAB','Angle GAC','Angle AGC','Angle ACG'],1,'The angle to a plane is measured to the line’s perpendicular projection onto that plane.',['G projects vertically down to C.','AG projects onto AC.','The required angle is between AG and AC, at A: GAC.'],'Draw triangle ACG, right-angled at C.','Using a front edge instead of AC gives the wrong triangle.',cuboid);
num('space',2,'Cuboid ABCD EFGH has E, F, G, H vertically above A, B, C, D. AB = 6 cm, BC = 8 cm, CG = 12 cm. Find face diagonal AC.',10,'cm','AC lies in the rectangular base.',['AC² = AB² + BC² = 6² + 8² = 100.','AC = 10 cm.'],'Only use the dimensions in the face containing your diagonal.','The height 12 cm is not needed for the base diagonal.',cuboid,1,false);
num('space',2,'A cuboid has dimensions 6 cm by 8 cm by 12 cm. Find the length of its space diagonal.',Math.sqrt(244),'cm','Two perpendicular triangles link the three dimensions.',['Base diagonal = √(6² + 8²) = 10 cm.','Space diagonal = √(10² + 12²) = √244 ≈ '+fmt(Math.sqrt(244))+' cm.'],'Draw the internal triangle using the base diagonal.','Adding the three dimensions does not give a straight-line distance.',cuboid);
num('space',3,'A cuboid has a 6 cm by 8 cm base and height 12 cm. Find the angle between its space diagonal and its base.',atan(1.2),'°','In the vertical cross-section, the base diagonal is adjacent and height is opposite.',['Base diagonal d = √(6² + 8²) = 10 cm.','tan θ = 12/10.','θ = tan⁻¹(1.2) = '+fmt(atan(1.2))+'°.'],'Angle to the base means angle to the projection in the base.','Using 12/8 ignores the other base dimension.',cuboid);
num('space',3,'A right square-based pyramid has base side 10 cm. Its apex is 12 cm vertically above the centre of the base. Find the sloping edge from the apex to a base corner.',Math.sqrt(194),'cm','Use the centre-to-corner distance, then the vertical height.',['The base diagonal is √(10² + 10²) = 10√2 cm.','Centre to corner is half of this: 5√2 cm.','Sloping edge² = 12² + (5√2)² = 194.','Sloping edge = √194 ≈ '+fmt(Math.sqrt(194))+' cm.'],'Distinguish an edge to a corner from a face slant height to a side midpoint.','Using 5 cm gives the face slant height, not the sloping edge.');
num('space',3,'A right square-based pyramid has base side 10 cm and vertical height 12 cm. Find its total surface area.',360,'cm²','The triangular face height runs to a side midpoint.',['Face slant height = √(12² + 5²) = 13 cm.','Each triangular face area = ½ × 10 × 13 = 65 cm².','Four faces and the base: 4 × 65 + 10² = 360 cm².'],'A face height must lie within that triangular face.','The edge from apex to corner is not the triangle’s perpendicular height.','',1,false);
mc('solids',1,'Which formula gives the volume of a cone with radius r and vertical height h?',['πr²h','⅓πr²h','πrl','4πr²'],1,'A cone has one third of the volume of a cylinder with the same base and height.',['Base area is πr².','Multiply by perpendicular height h.','Divide by 3.'],'Volume uses vertical height; curved area uses slant height.','Do not use the diameter as r.');
mc('solids',1,'What is the total surface area of a closed cylinder?',['2πrh','πr²h','2πr² + 2πrh','4πr²'],2,'A closed cylinder has two circular ends and one curved surface.',['Two circles contribute 2πr².','The curved surface unwraps into a rectangle, 2πr by h.','Add to get 2πr² + 2πrh.'],'Check whether the question says open, closed or curved surface only.','Volume and area have different dimensions and units.');
mc('solids',1,'Which pair gives a sphere’s surface area and volume, in that order?',['4πr² and ⁴⁄₃πr³','πr² and 2πr','⁴⁄₃πr³ and 4πr²','2πr² and ⅓πr²h'],0,'Sphere area uses r²; sphere volume uses r³.',['Surface area = 4πr².','Volume = (4/3)πr³.','Use square units for area and cubic units for volume.'],'A hemisphere has half the volume, but a closed hemisphere also has a flat circular base.','Do not halve sphere surface area if a hemisphere’s flat base is included.');
num('solids',2,'A cylinder has diameter 10 cm and height 12 cm. Find its volume.',300*Math.PI,'cm³','A cylinder is a prism with circular cross-section.',['Radius = 10/2 = 5 cm.','V = πr²h = π × 5² × 12 = 300π cm³.','300π ≈ '+fmt(300*Math.PI)+' cm³.'],'Keep π in the calculation until the end.','Squaring the diameter would make the answer four times too large.');
num('solids',2,'A closed cylinder has radius 3 cm and height 8 cm. Find its total surface area.',66*Math.PI,'cm²','Include both circular ends and the curved surface.',['A = 2πr² + 2πrh.','A = 2π × 3² + 2π × 3 × 8 = 66π cm².','A ≈ '+fmt(66*Math.PI)+' cm².'],'Write an inventory of exposed surfaces.','2πrh gives only the curved area.');
num('solids',2,'A cone has radius 5 cm and vertical height 12 cm. Find its volume.',100*Math.PI,'cm³','Use one third of base area times vertical height.',['V = ⅓π × 5² × 12 = 100π cm³.','V ≈ '+fmt(100*Math.PI)+' cm³.'],'The cone’s slant height is irrelevant to its volume.','Do not forget the factor of one third.');
num('solids',2,'A sphere has radius 6 cm. Find its volume.',288*Math.PI,'cm³','The sphere formula is V = (4/3)πr³.',['V = (4/3)π × 6³ = 288π cm³.','V ≈ '+fmt(288*Math.PI)+' cm³.'],'Cube the radius for volume.','Using r² gives an area-like quantity.');
num('solids',2,'A sphere has diameter 14 cm. Find its surface area.',196*Math.PI,'cm²','First convert diameter to radius.',['r = 7 cm.','A = 4πr² = 4π × 7² = 196π cm².','A ≈ '+fmt(196*Math.PI)+' cm².'],'Area always uses square units.','14 cm is the diameter, not the radius.');
num('solids',3,'A cone has radius 5 cm and vertical height 12 cm. Find its total surface area, including the circular base.',90*Math.PI,'cm²','First find slant height by Pythagoras, then add curved area and base.',['l = √(5² + 12²) = 13 cm.','A = πrl + πr² = π × 5 × 13 + π × 5² = 90π cm².','A ≈ '+fmt(90*Math.PI)+' cm².'],'In πrl, l is the sloping height of the cone.','Using vertical height 12 in the curved area formula is incorrect.');
num('solids',3,'A solid consists of a cylinder of radius 3 cm and height 10 cm topped by a hemisphere of the same radius. The bottom is closed. Find the exposed surface area.',87*Math.PI,'cm²','The joining circle is internal; count only exposed surfaces.',['Cylinder curved area = 2π × 3 × 10 = 60π.','Hemisphere curved area = 2π × 3² = 18π.','Bottom circle = π × 3² = 9π.','Total = 87π ≈ '+fmt(87*Math.PI)+' cm².'],'List the exposed parts before adding.','Do not count the circular join between the cylinder and hemisphere.');
num('solids',3,'A sphere of radius 3 cm is melted into a cone of radius 3 cm with no loss of material. Find the cone’s vertical height.',12,'cm','The volume stays the same when the solid is reshaped.',['Sphere volume = (4/3)π × 3³ = 36π.','Cone volume = (1/3)π × 3² × h = 3πh.','3πh = 36π, so h = 12 cm.'],'Cancel π before calculating.','Equal volumes do not mean equal heights or surface areas.','',1,false);
num('solids',3,'A cone frustum is made by removing a small cone of height 4 cm and radius 2 cm from a cone of height 10 cm and radius 5 cm. Find the frustum’s volume.',78*Math.PI,'cm³','A frustum volume is the large cone volume minus the removed cone volume.',['Large cone: V = ⅓π × 5² × 10 = (250/3)π.','Small cone: V = ⅓π × 2² × 4 = (16/3)π.','Difference = (234/3)π = 78π ≈ '+fmt(78*Math.PI)+' cm³.'],'Use each cone’s own radius and full vertical height.','The frustum height 6 cm cannot be substituted into a full-cone formula with radius 5.');

num('parallel',3,'Two alternate angles on parallel lines are (3x + 12)° and (5x − 28)°. Find x.',20,'','Alternate angles are equal, giving a linear equation.',['3x + 12 = 5x − 28.','40 = 2x, so x = 20.','Check: both angles are 72°.'],'The question asks for x, not the angle 72°.','Adding the expressions to 180 uses the wrong angle rule.','',1,false);

num('bearings',3,'C is 6 km east and 8 km north of A. Find the bearing of C from A to 1 decimal place.',atan(6/8),'°','Measure the acute angle clockwise from north.',['tan θ = east/north = 6/8.','θ = tan⁻¹(0.75) = '+fmt(atan(.75))+'°.','The bearing to 1 decimal place is 036.9°.'],'The app accepts 36.9 here because the question asks for a decimal angle.','Using north/east gives the angle measured from east instead.');
num('space',3,'Cuboid ABCD EFGH has E, F, G, H vertically above A, B, C, D. AB = 6 cm, BC = 8 cm and CG = 12 cm. Triangle ACF is formed by three face diagonals. Find angle AFC.',acos(288/(2*Math.sqrt(180)*Math.sqrt(208))),'°','Triangle ACF is not right-angled. Find its three sides on rectangular faces, then use the cosine rule.',['Base diagonal AC² = 6² + 8² = 100.','Front face diagonal AF² = 6² + 12² = 180.','Right face diagonal CF² = 8² + 12² = 208.','At F, the opposite side is AC. cos AFC = (180 + 208 − 100)/(2√180√208) = 288/(2√180√208).','Angle AFC = '+fmt(acos(288/(2*Math.sqrt(180)*Math.sqrt(208))))+'°.'],'First label which rectangular face each side lies in.','Not every triangle formed from a cuboid’s vertices contains a right angle.',cuboid);
num('bearings',3,'B is 10 km due east of A. C is on a bearing of 040° from A and 320° from B. Find AC.',10*sin(50)/sin(80),'km','Convert both bearings into interior angles, then use the sine rule.',['At A, angle BAC = 90° − 40° = 50°.','From B, A is due west (270°). Angle ABC = 320° − 270° = 50°.','Angle ACB = 180° − 50° − 50° = 80°.','AC/sin 50° = 10/sin 80°, so AC = '+fmt(10*sin(50)/sin(80))+' km.'],'Draw a separate north line at each starting point.','AB is opposite angle C, so 10 must pair with sin 80°, not sin 50°.');

const guides={
rules:{f:'Choose from the information, not the appearance.',notes:['Right angle + two sides → Pythagoras. Right angle + a side and angle → SOH CAH TOA.','Non-right triangle + an opposite side–angle pair → sine rule.','Two sides + included angle, or three sides → cosine rule.','Area + two sides and included angle → ½ab sin C.','Across a shape? Split it, solve one triangle, and carry a shared length into the next.']},
right:{f:'a² + b² = c² · SOH CAH TOA',notes:['c is the hypotenuse: opposite 90°, and the longest side.','sin θ = O/H, cos θ = A/H, tan θ = O/A. O and A are relative to the chosen angle.','For a shorter side, subtract squares. For the hypotenuse, add squares.','For an angle, use sin⁻¹, cos⁻¹ or tan⁻¹ in degree mode.']},
sine:{f:'a/sin A = b/sin B = c/sin C',notes:['Lower-case sides lie opposite matching upper-case angles.','Find a side: a = b sin A / sin B. Find an angle: A = sin⁻¹(a sin B / b).','If two angles are known, find the third using a total of 180°.','When finding an angle from sine, check 180° − the calculator angle too. Reject any option that makes the angle sum impossible or contradicts the question.']},
cosine:{f:'a² = b² + c² − 2bc cos A',notes:['A is between b and c and opposite a. Use this for SAS or SSS.','For an angle: A = cos⁻¹((b² + c² − a²)/(2bc)).','For a side, evaluate the whole right-hand side before taking the square root.','An obtuse angle has negative cosine. A negative value of cos A can be valid; a value outside −1 to 1 cannot.']},
area:{f:'Area = ½bh = ½ab sin C',notes:['In ½bh, h must be perpendicular to base b.','In ½ab sin C, C must be the included angle between a and b.','To find a missing side: a = 2 × Area/(b sin C).','To find an angle: sin C = 2 × Area/(ab). Use acute/obtuse information to choose the right angle.','Areas use square units, such as cm².']},
shapes:{f:'Split → solve → transfer → solve',notes:['Draw a useful diagonal. Redraw each triangle separately.','Use the first triangle to find a shared side or angle. Use that result in the second triangle.','In a parallelogram, opposite sides are equal and parallel. A diagonal creates alternate-angle relationships.','A general diagonal does not automatically bisect an angle or meet another line at 90°.','Use full precision in intermediate steps. Add areas only when the pieces do not overlap.']},
space:{f:'Cuboid diagonal = √(l² + w² + h²)',notes:['First find a face diagonal; then use a second right triangle through the solid.','Angle between a line and a plane means the angle to its perpendicular projection on the plane.','For a cuboid space diagonal’s angle to its base: tan θ = height/base diagonal.','In a right square-based pyramid, centre-to-corner is half the base diagonal; centre-to-side-midpoint is half a base side.','Extract a flat triangle. Never infer a right angle from a perspective sketch.']},
solids:{f:'Identify the radius, the height and the exposed surfaces.',notes:['Cylinder: V = πr²h; curved area = 2πrh; closed total area = 2πrh + 2πr².','Cone: V = ⅓πr²h; curved area = πrl; total area = πrl + πr². For a right cone, l = √(r² + h²).','Sphere: V = (4/3)πr³; area = 4πr². Hemisphere: V = (2/3)πr³; curved area = 2πr²; closed total area = 3πr².','Triangle = ½bh; parallelogram = bh; trapezium = ½(a+b)h; circle = πr². A prism has volume = cross-sectional area × length.','Composite solids: add or subtract volumes. For surface area, exclude hidden joins and include exposed bases.','1 cm³ = 1 ml; 1000 cm³ = 1 litre. Convert lengths before using a formula. Area and volume scale with the square and cube of the length scale factor.']},
parallel:{f:'Corresponding = equal · Alternate = equal · Co-interior total = 180°',notes:['Corresponding angles occupy matching positions at two intersections (F pattern).','Alternate interior angles are inside the parallel lines on opposite sides of the transversal (Z pattern).','Co-interior angles are inside the parallel lines on the same side (C pattern).','Vertically opposite angles are equal; angles on a straight line total 180°; angles at a point total 360°. These do not need parallel lines.','Use the rule to form an equation, solve it, then check whether the question asks for x or an angle.']},
exact:{f:'Exact means fractions and surds, without rounding.',notes:['For angles 0°, 30°, 45°, 60°, 90°, sine follows √0/2, √1/2, √2/2, √3/2, √4/2.','Cosine is the same list in reverse order.','tan θ = sin θ/cos θ: 0, √3/3, 1, √3, undefined at 90°.','A 45°–45°–90° triangle has sides 1 : 1 : √2. A 30°–60°–90° triangle has opposite sides 1 : √3 : 2.','Substitute exact values first, then simplify. Do not introduce decimal approximations.']},
circle:{f:'(x, y) = (cos θ, sin θ) on radius 1',notes:['Start at the positive x-axis and measure anticlockwise. This is different from bearings.','Cosine is horizontal position; sine is vertical position. Both range from −1 to 1.','In quadrants I, II, III, IV, the signs (cos, sin) are (+,+), (−,+), (−,−), (+,−).','tan θ = y/x, so it is undefined where x = 0: 90° and 270°.','Use a reference angle and the quadrant sign to explain angles beyond 90°. This is a supporting visual model for exact values, obtuse angles and trig graphs.']},
bearings:{f:'Clockwise from north · Three figures · Start at “from”',notes:['“The bearing of B from A” starts at A. Draw north there.','For a reverse bearing, add 180° and reduce modulo 360°, or subtract 180° when convenient.','Bearings from the same point share a north line; their difference gives an angle. Choose the correct interior angle, especially across north.','At a turning point, reverse the incoming bearing before finding the interior angle.','North lines are parallel, so corresponding, alternate and co-interior angle rules can connect bearings at different points.']}

function home(){let c=counts();$('main').innerHTML=`<section class="hero"><div><span class="eyebrow">Small steps. Clear methods. Stronger maths.</span><h1>Make the next<br>angle click.</h1><p class="muted">Build confidence with triangles, shapes and bearings. Choose a method, have a go, then learn from every answer.</p><div class="row actions"><button class="primary" id="guided">Start with the basics →</button><button id="custom">Choose your practice</button></div><p class="note" style="margin-top:15px">No timer. No installation. All ${bank.length} questions work offline.</p></div><div class="hero-art" aria-hidden="true"><span class="art-label">Know the clues. Choose the rule.</span><svg viewBox="0 0 330 220"><path d="M40 175L280 175L200 35Z"/><path d="M83 175Q81 151 66 143"/><text x="39" y="196">A</text><text x="286" y="194">B</text><text x="197" y="26">C</text><text x="104" y="94">b</text><text x="258" y="99">a</text><text x="153" y="200">c</text><text x="91" y="159">θ</text></svg><span class="art-label">One triangle at a time.</span></div></section><div class="stats"><div class="stat"><strong>${bank.length}</strong><span>worked questions</span></div><div class="stat"><strong>${c.seen} / ${c.n}</strong><span>questions explored</span></div><div class="stat"><strong>${c.review}</strong><span>ready to revisit</span></div></div><div class="section-head row between"><div><span class="eyebrow">Your topic map</span><h2>Start where you need a hand.</h2><p class="muted">Each topic moves from foundations to calculations and challenges.</p></div><span class="tag">12 topics · 3 stages</span></div><div class="grid">${topics.map(([id,name,desc,n])=>{let c=counts(id);return `<article class="card topic"><span class="num">${n} / ${c.n} QUESTIONS</span><h3>${name}</h3><p>${desc}</p><div class="row between" style="width:100%"><button data-topic="${id}">Practise topic →</button><span class="note">${c.secure}/${c.n} independent</span></div></article>`;}).join('')}</div><details style="margin-top:25px"><summary>How to use this with your teenagers</summary><p>Use separate learner profiles with the + button at the top. Start with a topic’s foundations, then try its calculations, then challenges. Aim for 10–15 minutes, with paper for working. Ask the learner to explain why a rule fits before using it. Revisit missed or hinted questions later, without the solution in view.</p><p>Progress records first attempts and whether the latest answer was independent. A correct repeat is useful practice, not a predicted GCSE grade. Browser storage is tied to this browser and local file; export progress to keep a portable backup.</p><p>Paper 1 is non-calculator; Papers 2 and 3 allow calculators. Questions here are original teaching practice, not official past-paper questions. Calculator labels refer to each exercise. The unit circle is included as a supporting explanation.</p><p>Topic scope checked against <a href="https://www.aqa.org.uk/subjects/mathematics/gcse/mathematics-8300/specification/subject-content/3.4-geometry-and-measures" target="_blank" rel="noopener">AQA 8300 Geometry and measures (G15–G23)</a> and the <a href="https://www.aqa.org.uk/subjects/mathematics/gcse/mathematics-8300/specification" target="_blank" rel="noopener">AQA specification</a>, September 2026. These optional reference links need internet; the learning app does not.</p></details>`;$('guided').onclick=()=>start('rules','all',10,'guided');$('custom').onclick=()=>go('setup');document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>setup(b.dataset.topic));}
function setup(topic='all'){view='setup';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav==='setup'));$('main').innerHTML=`<span class="eyebrow">Practice, at your pace</span><h1>Build your session.</h1><div class="twocol"><section class="card"><h2>What shall we work on?</h2><form id="setupForm"><div class="field"><label for="topic">Topic</label><select id="topic"><option value="all">Mixed topics</option>${topics.map(t=>`<option value="${t[0]}" ${t[0]===topic?'selected':''}>${t[1]}</option>`).join('')}</select></div><div class="field"><label for="level">Stage</label><select id="level"><option value="all">Build up: foundations → challenge</option><option value="1">1 · Foundations: definitions and method choice</option><option value="2">2 · Calculations: put the method to work</option><option value="3">3 · Challenge: link steps and explain</option></select></div><div class="field"><label for="mode">Question selection</label><select id="mode"><option value="guided">Guided: unseen questions first</option><option value="review">Revisit: missed, hinted or revealed</option><option value="shuffle">Shuffle: include previous questions</option></select></div><div class="field"><label for="length">Session length</label><select id="length"><option value="6">6 questions</option><option value="10" selected>10 questions</option><option value="20">20 questions</option><option value="1000">All matching questions</option></select></div><p id="poolInfo" class="notice"></p><div class="row"><button class="primary" type="submit">Begin practice →</button>${session&&session.index<session.queue.length?'<button type="button" id="resume">Resume current session</button>':''}</div></form></section><aside class="side"><div class="card"><span class="eyebrow">A useful routine</span><ol><li><b>Read.</b> Mark what is known and what is wanted.</li><li><b>Choose.</b> Name your method and explain why it fits.</li><li><b>Work.</b> Write a formula, substitute, calculate.</li><li><b>Check.</b> Units, size, angle and rounding.</li></ol><p class="note">Use paper for working. Calculator questions use degrees. Numerical answers are requested to 1 decimal place unless stated otherwise.</p></div></aside></div>`;function update(){let n=pool($('topic').value,$('level').value,$('mode').value).length;$('poolInfo').textContent=`${n} matching question${n===1?'':'s'}. Your session uses up to the selected length, without repeating a question.`;}$('setupForm').onchange=update;update();$('setupForm').onsubmit=e=>{e.preventDefault();start($('topic').value,$('level').value,+$('length').value,$('mode').value);};if($('resume'))$('resume').onclick=()=>go('quiz');window.scrollTo(0,0);}
function pool(t,l,mode){return bank.filter(q=>(t==='all'||q.t===t)&&(l==='all'||q.l===+l)&&(mode!=='review'||(records()[q.id]&&(!records()[q.id].lastCorrect||records()[q.id].lastAssisted))));}
function start(t,l,length,mode){let qs=pool(t,l,mode).map(q=>({q,r:Math.random()}));qs.sort((a,b)=>(l==='all'?a.q.l-b.q.l:0)||(mode==='guided'?(!!records()[a.q.id])-(!!records()[b.q.id]):0)||a.r-b.r);let queue=qs.slice(0,length).map(x=>x.q.id);if(!queue.length){$('poolInfo').textContent='No questions match yet. Try Guided selection or another stage.';return;}session={queue,index:0,results:[],topic:t,level:l};questionState=null;go('quiz');}

function renderQuestion(){if(!session){go('setup');return;}if(session.index>=session.queue.length){go('summary');return;}let q=current();if(!questionState||questionState.id!==q.id)questionState={id:q.id,selected:null,value:'',done:false,hinted:false,revealed:false,correct:false};let s=questionState;$('main').innerHTML=`<div class="row between"><span class="eyebrow" style="margin:0">${esc(learner().name)}’s practice</span><button class="small" id="leave">Pause session</button></div><div class="row between" style="margin-top:20px"><span class="muted">Question ${session.index+1} of ${session.queue.length}</span><span class="note">${session.results.filter(r=>r.correct&&!r.assisted).length} independent correct</span></div><div class="progress-track" aria-label="Session progress"><i style="width:${session.index/session.queue.length*100}%"></i></div><div class="twocol"><article class="card question"><div class="row"><span class="tag dark">${topicName(q.t)}</span><span class="tag lime">${q.l} · ${stage[q.l]}</span><span class="tag">${q.calc?'Calculator · DEG':'Non-calculator'}</span></div><h2 id="questionTitle">${q.p}</h2>${q.diagram?`<div class="diagram">${q.diagram}<small>Schematic only — not to scale. Use the stated information.</small></div>`:''}<form id="answerForm" aria-labelledby="questionTitle">${q.opts?`<div class="options" role="group" aria-label="Answer options">${q.opts.map((o,i)=>`<button type="button" class="option ${s.selected===i?'selected':''} ${s.done&&i===q.correct?'correct':''} ${s.done&&s.selected===i&&!s.correct?'wrong':''}" data-choice="${i}" aria-pressed="${s.selected===i}" ${s.done?'disabled':''}><b>${String.fromCharCode(65+i)}</b><span>${o}${s.done&&i===q.correct?' <strong>✓ Correct answer</strong>':''}</span></button>`).join('')}</div>`:`<div class="answer-line"><label for="answer">${q.bearing?'Three-figure bearing':`Your answer${q.dp===1?' (to 1 decimal place)':''}`}</label><div class="row"><input id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="${q.bearing?'e.g. 047':'Enter a number'}" value="${esc(s.value)}" ${s.done?'disabled':''} aria-describedby="answerHelp"><span>${q.unit}</span></div><p id="answerHelp" class="note" style="margin-top:8px">${q.bearing?'Enter exactly three digits, without the degree symbol.':'Enter a number only; units are shown beside the box. A decimal comma is accepted.'}</p></div>`}<div class="error" id="answerError" role="alert"></div><div class="row actions">${!s.done?'<button class="primary" type="submit">Check answer</button><button type="button" id="hint">Give me a hint</button><button type="button" id="reveal" class="linkbtn">Show worked solution</button>':'<button class="primary" type="button" id="next">'+(session.index+1===session.queue.length?'See session summary':'Next question →')+'</button>'}</div></form>${s.hinted&&!s.done?`<div class="notice"><b>Start here:</b> ${q.why}<br><span class="note">This will be recorded as practice with help.</span></div>`:''}<section id="feedback" tabindex="-1" class="${s.done?'feedback':''}" aria-live="polite">${s.done?feedback(q,s):''}</section></article><aside class="side"><div class="card"><span class="eyebrow">Before you calculate</span><h3>What are the clues?</h3><ol><li>What do I know?</li><li>What do I need to find?</li><li>Which rule connects them?</li></ol><p class="muted">Write the formula before the numbers. Your method matters as much as your final answer.</p></div><div class="card"><h3>Need the formula?</h3><p class="muted">Open a short topic reminder. Using it counts as help for this question.</p><button id="reminder" class="small">${s.hinted?'Show topic reminder':'Open topic reminder'}</button><div id="reminderContent"></div></div></aside></div>`;
$('leave').onclick=()=>go('setup');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.selected=+b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b));});$('answerError').textContent='';});if($('answer'))$('answer').oninput=e=>s.value=e.target.value;$('answerForm').onsubmit=e=>{e.preventDefault();check();};if($('hint'))$('hint').onclick=()=>{s.hinted=true;renderQuestion();};if($('reveal'))$('reveal').onclick=()=>finish(false,true);const advance=()=>{session.index++;questionState=null;go(session.index>=session.queue.length?'summary':'quiz');};if($('next'))$('next').onclick=advance;if($('nextBottom'))$('nextBottom').onclick=advance;$('reminder').onclick=()=>{if(!s.done)s.hinted=true;$('reminderContent').innerHTML=`<div class="notice">${guides[q.t].f}</div><ul class="tip-list">${guides[q.t].notes.map(n=>`<li>${n}</li>`).join('')}</ul>`;$('reminder').disabled=true;};}
function check(){let q=current(),s=questionState;if(s.done)return;let correct=false;if(q.opts){if(s.selected===null){$('answerError').textContent='Choose an answer first, or open the worked solution.';return;}correct=s.selected===q.correct;}else{let str=s.value.trim().replace(',','.');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(str)||!Number.isFinite(Number(str))){$('answerError').textContent='Enter a number without units, or choose “Show worked solution”.';return;}if(q.bearing&&!/^\d{3}$/.test(str)){$('answerError').textContent='Use three digits for a bearing: for example, 007 or 065.';return;}let value=Number(str);correct=q.bearing?value===q.answer:Math.round(value*Math.pow(10,q.dp))===Math.round(q.answer*Math.pow(10,q.dp));}finish(correct,false);}
function finish(correct,revealed){let q=current(),s=questionState;if(s.done)return;s.done=true;s.correct=correct;s.revealed=revealed;let assisted=s.hinted||revealed;let r=records()[q.id]||{attempts:0,firstCorrect:correct&&!assisted};r.attempts++;r.lastCorrect=correct;r.lastAssisted=assisted;r.lastDate=new Date().toISOString();records()[q.id]=r;session.results.push({id:q.id,correct,assisted,revealed});save();renderQuestion();setTimeout(()=>{if(view==='quiz'&&$('feedback')){$('feedback').focus({preventScroll:true});$('feedback').scrollIntoView({behavior:'smooth',block:'start'});}},40);}
function feedback(q,s){return `<span class="eyebrow">${s.revealed?'Worked example':s.correct?'Answer checked':'A useful mistake to learn from'}</span><h3>${s.revealed?'Let’s walk through it.':s.correct?(s.hinted?'Correct — with a little help.':'Correct. You’ve got this step.'):'Not quite — here’s how to get there.'}</h3>${!s.revealed?`<p class="muted">Your answer: <b>${esc(q.opts?q.opts[s.selected]:s.value+(q.unit?' '+q.unit:''))}</b></p>`:''}<div class="notice"><strong>${q.opts?'Correct choice':'Answer'}: ${answerText(q)}</strong></div><h3>Why this method?</h3><p>${q.why}</p><h3>Work it through</h3><ol>${q.steps.map(step=>`<li>${step}</li>`).join('')}</ol>${!q.opts?`<p class="note">${q.bearing?'Write the final bearing using three figures.':`Final answer: ${q.answer.toFixed(q.dp)} ${q.unit}${q.dp===1?' to 1 decimal place':''}. The checker also accepts an unrounded number that rounds to this answer. Intermediate decimals above are displayed to 4 decimal places; keep full precision when calculating.`}</p>`:''}<div class="callout"><strong>Tip to take into the exam</strong>${q.tip}</div><div class="callout warn"><strong>Mistake to avoid</strong>${q.mistake}</div><p class="note" style="margin-top:18px">Before moving on, explain aloud why this rule fits. ${s.hinted||s.revealed?'This question is saved for independent retry.':!s.correct?'This question is saved for another go.':'Try a similar question later to check you can still choose the method.'}</p><button type="button" class="primary" id="nextBottom">${session.index+1===session.queue.length?'See session summary':'Next question →'}</button>`;}
function summary(){let rs=session?.results||[],ind=rs.filter(r=>r.correct&&!r.assisted).length,help=rs.filter(r=>r.assisted).length;$('main').innerHTML=`<span class="eyebrow">Session complete</span><h1>Keep the method.<br>Learn from the mistakes.</h1><div class="stats"><div class="stat"><strong>${ind} / ${rs.length}</strong><span>independent correct</span></div><div class="stat"><strong>${help}</strong><span>questions with help</span></div><div class="stat"><strong>${rs.filter(r=>!r.correct||r.assisted).length}</strong><span>worth another go</span></div></div><div class="card"><h2>Your session, question by question</h2><div class="table-scroll"><table><thead><tr><th>Topic / stage</th><th>Question</th><th>Result</th></tr></thead><tbody>${rs.map(r=>{let q=bank.find(q=>q.id===r.id);return `<tr><td>${topicName(q.t)}<br><span class="note">${stage[q.l]}</span></td><td>${q.p}</td><td>${r.revealed?'Solution studied':r.correct?(r.assisted?'Correct with help':'Independent correct'):(r.assisted?'Retry · help used':'Retry')}</td></tr>`;}).join('')}</tbody></table></div></div><div class="row actions" style="margin-top:24px"><button class="primary" id="retry">Retry this session’s learning points</button><button id="another">Choose another session</button><button id="allProgress">View progress</button></div><p class="note" style="margin-top:15px">For a stronger check of recall, revisit these questions tomorrow as well.</p>`;$('retry').onclick=()=>{let queue=rs.filter(r=>!r.correct||r.assisted).map(r=>r.id);if(!queue.length){$('retry').textContent='All independent correct — choose another session';return;}session={queue,index:0,results:[],topic:'review',level:'all'};questionState=null;go('quiz');};$('another').onclick=()=>go('setup');$('allProgress').onclick=()=>go('progress');}
function toolsView(){$('main').innerHTML=`<span class="eyebrow">Understand the why</span><h1>Your maths toolkit.</h1><p class="muted">Use these as teaching aids, then close them and try a question independently.</p><div class="toolgrid"><section class="card"><h2>Which rule do I need?</h2><div class="field"><label for="ruleNeed">What are you trying to find?</label><select id="ruleNeed"><option value="rightSide">A side in a right triangle, with two sides known</option><option value="rightTrig">A side or angle in a right triangle, using trig</option><option value="pair">A side with a known opposite side–angle pair</option><option value="sas">A third side, given two sides and their included angle</option><option value="sss">An angle, given three sides</option><option value="area">Area, given two sides and their included angle</option><option value="space">A space diagonal or angle to a plane</option></select></div><div id="ruleResult" class="notice"></div></section><section class="card"><h2>Degree-mode calculator</h2><p class="note">A small helper for trig values and inverse trig. Use paper or your own scientific calculator for full expressions.</p><div class="row"><div class="field"><label for="calcOp">Function</label><select id="calcOp"><option>sin</option><option>cos</option><option>tan</option><option>sin⁻¹</option><option>cos⁻¹</option><option>tan⁻¹</option><option>√</option><option>x²</option></select></div><div class="field"><label for="calcInput">Number</label><input id="calcInput" type="text" inputmode="decimal" value="30" style="width:145px"></div><button id="calculate">Calculate</button></div><div id="calcResult" class="tool-result" aria-live="polite">sin(30°) = 0.5</div></section><section class="card"><div class="row between"><h2>The unit circle</h2><span class="tag">Interactive</span></div><p class="muted">Move the angle. Watch cosine move across and sine move up or down.</p><svg class="circle-svg" viewBox="0 0 360 300" role="img" aria-label="Interactive unit circle: coordinates are cosine and sine"><line x1="25" y1="150" x2="335" y2="150"/><line x1="180" y1="15" x2="180" y2="285"/><circle cx="180" cy="150" r="110"/><text x="321" y="170">x</text><text x="191" y="20">y</text><text x="296" y="145">0°</text><text x="184" y="34">90°</text><text x="29" y="145">180°</text><text x="184" y="279">270°</text><line id="circleRadius" x1="180" y1="150" x2="275" y2="95"/><line id="circleX" class="projection"/><line id="circleY" class="projection"/><circle id="circleDot" r="5" style="fill:#a77313;stroke:#a77313"/><text id="pointLabel" x="25" y="295"></text></svg><label for="theta"><b>Angle: <span id="thetaLabel">30</span>°</b> anticlockwise from positive x</label><input class="slider" id="theta" type="range" min="0" max="360" step="1" value="30"><div class="row">${[0,30,45,60,90,120,180,270].map(a=>`<button class="small" data-angle="${a}">${a}°</button>`).join('')}</div><div class="tool-result" id="circleValues" aria-live="polite"></div><p class="note" style="margin-top:13px">Bearings start at north and turn clockwise. Do not mix the two conventions.</p></section><section class="card"><h2>Exact values, made memorable</h2><p class="muted">Sine climbs the square-root pattern. Cosine goes backwards. Tangent is sine divided by cosine.</p><div class="table-scroll"><table><thead><tr><th>θ</th><th>sin θ</th><th>cos θ</th><th>tan θ</th></tr></thead><tbody>${[['0°','0','1','0'],['30°','½','√3/2','√3/3'],['45°','√2/2','√2/2','1'],['60°','√3/2','½','√3'],['90°','1','0','Undefined']].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice">Sine pattern: √0/2, √1/2, √2/2, √3/2, √4/2.</div><h3>Where the values come from</h3><p>A square of side 1 splits along its diagonal into two 45° triangles. Pythagoras gives a hypotenuse of √2, so sin 45° = 1/√2 = √2/2.</p><p>Split an equilateral triangle of side 2 into two right triangles. Their sides are 1, √3 and 2, giving sin 30° = ½ and sin 60° = √3/2.</p><p class="note">The 90° tangent is undefined because it would divide by zero.</p></section></div><div class="section-head" style="margin-top:35px"><h2>Topic reference cards</h2><p class="muted">The essential formulas, conditions and checks.</p></div>${topics.map(t=>`<details><summary>${t[1]}</summary><div class="formula">${guides[t[0]].f}</div><ul class="tip-list">${guides[t[0]].notes.map(n=>`<li>${n}</li>`).join('')}</ul></details>`).join('')}`;
const choices={rightSide:['Pythagoras','c² = a² + b², where c is opposite 90°. Add squares for the hypotenuse; subtract for a shorter side.'],rightTrig:['SOH CAH TOA','Label opposite, adjacent and hypotenuse relative to your angle. Choose the ratio containing the known and wanted quantities.'],pair:['Sine rule','a/sin A = b/sin B. Pair every side with its opposite angle. When finding an angle, check whether the supplementary angle is possible.'],sas:['Cosine rule for a side','a² = b² + c² − 2bc cos A. A is between b and c. Take the square root at the end.'],sss:['Cosine rule for an angle','A = cos⁻¹((b² + c² − a²)/(2bc)). Side a is opposite A.'],area:['Sine area formula','Area = ½ab sin C. C must be the angle between a and b.'],space:['Extract two triangles','Find a face diagonal with Pythagoras. Use it in the right triangle inside the solid; use trig if an angle is requested.']};function rule(){let r=choices[$('ruleNeed').value];$('ruleResult').innerHTML=`<h3>${r[0]}</h3><p>${r[1]}</p>`;}$('ruleNeed').onchange=rule;rule();$('calculate').onclick=calculate;$('calcInput').onkeydown=e=>{if(e.key==='Enter')calculate();};$('theta').oninput=updateCircle;document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{$('theta').value=b.dataset.angle;updateCircle();});updateCircle();}
function calculate(){let raw=$('calcInput').value.trim().replace(',','.'),x=Number(raw),op=$('calcOp').value;let y;if(!raw||!Number.isFinite(x)){y='Enter a finite number.';}else if((op==='sin⁻¹'||op==='cos⁻¹')&&Math.abs(x)>1){y='Inverse sine and cosine need a value from −1 to 1.';}else if(op==='√'&&x<0){y='Use a non-negative number for a real square root.';}else if(op==='tan'&&Math.abs(cos(x))<1e-12){y='Undefined: cosine is zero at this angle.';}else{let f={'sin':sin,'cos':cos,'tan':tan,'sin⁻¹':asin,'cos⁻¹':acos,'tan⁻¹':atan,'√':Math.sqrt,'x²':x=>x*x};let v=f[op](x);y=`${op}(${x}${['sin','cos','tan'].includes(op)?'°':''}) = ${Number.isFinite(v)?Number(v.toFixed(10)):'Result too large'}${op.includes('⁻¹')?'°':''}`;}$('calcResult').textContent=y;}
function updateCircle(){let a=+$('theta').value,c=cos(a),s=sin(a),x=180+110*c,y=150-110*s;$('thetaLabel').textContent=a;for(const [id,attrs] of [['circleRadius',{x2:x,y2:y}],['circleX',{x1:x,y1:y,x2:x,y2:150}],['circleY',{x1:x,y1:y,x2:180,y2:y}],['circleDot',{cx:x,cy:y}]])Object.entries(attrs).forEach(([k,v])=>$(id).setAttribute(k,v));let coords=`(${Number(c.toFixed(4))}, ${Number(s.toFixed(4))})`;$('pointLabel').textContent='P = '+coords;$('circleValues').textContent=`cos = ${Number(c.toFixed(4))} · sin = ${Number(s.toFixed(4))} · tan = ${Math.abs(c)<1e-10?'undefined':Number((s/c).toFixed(4))}`;}
function progressView(){let c=counts(),rs=Object.values(records()),first=rs.filter(r=>r.firstCorrect).length;$('main').innerHTML=`<span class="eyebrow">${esc(learner().name)}’s learning record</span><h1>Progress is practice<br>you can build on.</h1><div class="stats"><div class="stat"><strong>${c.seen} / ${c.n}</strong><span>questions explored</span></div><div class="stat"><strong>${first} / ${c.seen}</strong><span>independent on first attempt</span></div><div class="stat"><strong>${c.review}</strong><span>ready to revisit</span></div></div><div class="card"><h2>Where to focus next</h2><div class="table-scroll"><table><thead><tr><th>Topic</th><th>Explored</th><th>Latest: independent correct</th><th>Revisit</th><th></th></tr></thead><tbody>${topics.map(t=>{let c=counts(t[0]);return `<tr><td>${t[1]}</td><td>${c.seen}/${c.n}</td><td>${c.secure}</td><td>${c.review}</td><td><button class="small" data-practice="${t[0]}">Practise</button></td></tr>`;}).join('')}</tbody></table></div><p class="note" style="margin-top:18px">“Independent” means no hint, formula reminder or solution was opened before that answer in the app. “Revisit” includes incorrect, hinted and revealed answers. Results reflect these practice questions, not a grade prediction.</p></div><div class="row actions" style="margin-top:22px"><button class="primary" id="reviewAll">Practise learning points</button><button id="export">Export progress</button><button id="import">Import progress</button><button id="print">Print progress</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><p class="note" style="margin-top:13px">Profiles are saved in this browser when available. Export saves all learners to a small backup file; import adds their records as separate profiles.</p><div id="progressMessage" role="status"></div><details><summary>Reset this learner’s progress</summary><p>This clears the saved answers for ${esc(learner().name)} only.</p><button id="reset" style="margin-top:12px">Reset progress…</button></details>`;document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>setup(b.dataset.practice));$('reviewAll').onclick=()=>{if(!c.review){$('progressMessage').textContent='No learning points yet. Try a new topic or a harder stage.';return;}start('all','all',10,'review');};$('export').onclick=()=>download(JSON.stringify(data,null,2),'angle-lab-progress.json','application/json');$('import').onclick=()=>$('importFile').click();$('importFile').onchange=importProgress;$('print').onclick=()=>window.print();$('reset').onclick=()=>{if(confirm('Reset all saved answers for '+learner().name+'? This cannot be undone unless you exported a backup.')){learner().records={};session=null;questionState=null;save();progressView();}};}
function download(content,name,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importProgress(e){try{let f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('File is too large.');let obj=JSON.parse(await f.text());if(obj.version!==1||!Array.isArray(obj.profiles)||!obj.profiles.length||obj.profiles.length>100)throw Error('Not an Angle Lab progress backup.');let clean=obj.profiles.map((p,i)=>{if(typeof p.name!=='string'||!p.records||typeof p.records!=='object')throw Error('Invalid learner record.');let records={};for(let q of bank){let r=p.records[q.id];if(!r)continue;if(!Number.isInteger(r.attempts)||r.attempts<1||typeof r.firstCorrect!=='boolean'||typeof r.lastCorrect!=='boolean'||typeof r.lastAssisted!=='boolean')throw Error('Invalid question record.');records[q.id]={attempts:r.attempts,firstCorrect:r.firstCorrect,lastCorrect:r.lastCorrect,lastAssisted:r.lastAssisted,lastDate:typeof r.lastDate==='string'?r.lastDate:''};}return {id:'p'+Date.now()+'_'+i,name:p.name.slice(0,25)+' (imported)',records};});data.profiles.push(...clean);save();profileUI();$('progressMessage').textContent=`Imported ${clean.length} learner profile(s). Choose one using the learner menu at the top.`;}catch(err){$('progressMessage').textContent='Could not import: '+err.message;}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));$('profileSelect').onchange=e=>{data.active=e.target.value;session=null;questionState=null;save();go('home');};$('addProfile').onclick=()=>{$('profileDialog').showModal();$('profileName').focus();};$('cancelProfile').onclick=()=>$('profileDialog').close();$('profileForm').onsubmit=e=>{e.preventDefault();let name=$('profileName').value.trim();if(!name)return;let p={id:'p'+Date.now(),name,records:{}};data.profiles.push(p);data.active=p.id;session=null;questionState=null;save();profileUI();$('profileDialog').close();$('profileName').value='';go('home');};profileUI();storageStatus();go('home');

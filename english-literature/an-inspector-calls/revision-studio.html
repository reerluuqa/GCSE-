.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:38px 0 16px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:3px 0 0;color:var(--muted)}.grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 12px 34px rgba(0,0,0,.08)}.card.hover{transition:.2s}.card.hover:hover{transform:translateY(-3px);border-color:rgba(139,124,255,.35)}.metric{font-size:31px;font-weight:900;letter-spacing:-.03em}.muted{color:var(--muted)}.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:11px;color:var(--muted);font-weight:750}.tag.accent{background:rgba(139,124,255,.12);color:#b8afff}.tag.green{background:rgba(53,211,182,.11);color:#73e2cc}.tag.warn{background:rgba(255,190,92,.1);color:#ffd28d}.tag.danger{background:rgba(255,111,145,.1);color:#ff9db4}.tags{display:flex;gap:7px;flex-wrap:wrap}.divider{height:1px;background:var(--line);margin:17px 0}.callout{border-left:3px solid var(--accent);background:rgba(139,124,255,.08);padding:12px 14px;border-radius:0 12px 12px 0}.callout.green{border-color:var(--accent2);background:rgba(53,211,182,.07)}

.flash-wrap{max-width:900px;margin:10px auto}.flash-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:10px}.flashcard{height:380px;perspective:1200px;cursor:pointer}.flash-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}.flashcard.flipped .flash-inner{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:var(--shadow);padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.flash-face.back{transform:rotateY(180deg);background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 90%,#2ec9af),var(--panel))}.flash-label{text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:800;font-size:10px;position:absolute;top:25px}.flash-question{font-size:clamp(26px,4vw,42px);line-height:1.12;font-weight:850;max-width:740px}.flash-answer{font-size:clamp(20px,3vw,31px);line-height:1.3;font-weight:750;max-width:760px}.flash-hint{position:absolute;bottom:22px;color:var(--muted);font-size:12px}.flash-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.flash-actions button{padding:13px}.known{background:rgba(53,211,182,.11);border:1px solid rgba(53,211,182,.3);color:var(--text)}.missed{background:rgba(255,111,145,.1);border:1px solid rgba(255,111,145,.25);color:var(--text)}
.character-card{position:relative;overflow:hidden}.character-card h3{font-size:23px;margin:8px 0 2px}.character-card .role{color:var(--muted);margin-bottom:13px}.character-card .arc{font-size:13px}.character-card button{margin-top:16px}.character-number{position:absolute;right:17px;top:10px;font-size:56px;font-weight:900;opacity:.045}.detail-hero{display:grid;grid-template-columns:1fr .75fr;gap:20px}.detail-hero h2{font-size:38px;margin:7px 0}.quote-list{display:grid;gap:10px}.quote-chip{padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:13px}.quote-chip q{font-weight:800}.bullet-list{padding-left:20px}.bullet-list li{margin:7px 0}
.theme-card h3{font-size:21px;margin:10px 0 7px}.theme-card p{color:var(--muted)}.thesis{font-weight:750;color:var(--text)!important}.connection{display:grid;grid-template-columns:160px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.connection:first-child{border-top:0}.connection strong{color:var(--accent2)}
.timeline{position:relative;margin:12px 0}.timeline:before{content:"";position:absolute;left:23px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--accent),var(--accent2))}.timeline-item{position:relative;padding:0 0 25px 65px}.timeline-dot{position:absolute;left:13px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--panel);border:5px solid var(--accent)}.timeline-item:nth-child(even) .timeline-dot{border-color:var(--accent2)}.timeline-item h3{margin:0}.timeline-item p{color:var(--muted);margin:5px 0}.timeline-year{font-size:12px;font-weight:850;color:var(--accent)}
.quote-card q{display:block;font-size:20px;font-weight:800;line-height:1.28;margin:12px 0}.quote-card .quote-by{color:var(--muted);font-size:12px}.quote-uses{margin:12px 0}.quote-surgery{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}.quote-surgery strong{color:var(--accent2)}
.exam-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:18px}.question-box{background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 94%,#7b6cff),var(--panel));border:1px solid var(--line);border-radius:26px;padding:27px}.question-box h2{font-size:28px;line-height:1.25}.timer{font-variant-numeric:tabular-nums;font-size:31px;font-weight:900}.plan-grid{display:grid;gap:10px}.plan-field label{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.plan-field textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px;outline:none}.plan-field textarea:focus{border-color:var(--accent)}.model-answer{white-space:pre-line;line-height:1.72}.answer-hidden{filter:blur(7px);user-select:none;opacity:.55}.mark-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mark-chip{padding:10px;border:1px solid var(--line);border-radius:12px;text-align:center;background:var(--panel2)}.mark-chip strong{display:block}
.quiz-option{width:100%;text-align:left;padding:12px 14px;margin:7px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);cursor:pointer}.quiz-option:hover{border-color:rgba(139,124,255,.45)}.quiz-option.correct{border-color:var(--accent2);background:rgba(53,211,182,.1)}.quiz-option.wrong{border-color:var(--danger);background:rgba(255,111,145,.09)}.quiz-explain{margin-top:12px;padding:12px;border-radius:12px;background:var(--panel2);color:var(--muted)}
.blurting textarea{width:100%;min-height:190px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:14px;resize:vertical}.recall-points{display:grid;gap:8px;margin-top:13px}.recall-point{padding:10px 12px;border-radius:11px;background:var(--panel2);border-left:3px solid var(--accent2)}
.toast{position:fixed;bottom:26px;right:26px;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:750;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:80}.toast.show{transform:none;opacity:1}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);z-index:60;padding:24px;overflow:auto}.modal{position:relative;max-width:900px;margin:5vh auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:var(--shadow)}.modal-close{position:absolute;right:16px;top:13px;border:0;background:transparent;color:var(--muted);font-size:28px;cursor:pointer}.modal h2{font-size:32px;margin:6px 0 16px}.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:1px 6px;font-size:11px;background:var(--panel2);color:var(--muted)}
.focus-mode .sidebar,.focus-mode .topbar{display:none}.focus-mode .main{grid-column:1/-1}.focus-mode .view{max-width:1100px;padding-top:60px}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.hero,.exam-layout,.detail-hero{grid-template-columns:1fr}.quote-of-day{min-height:260px}}
@media(max-width:780px){.app-shell{display:block}.sidebar{transform:translateX(-102%);transition:.25s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.main{display:block}.menu-btn{display:inline-grid;place-items:center}.topbar{padding:14px 16px}.view{padding:24px 16px 55px}.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.hero-card{padding:27px}.hero-card h2{font-size:39px}.flashcard{height:420px}.flash-face{padding:30px 22px}.connection{grid-template-columns:1fr}.mark-grid{grid-template-columns:1fr 1fr}.modal-backdrop{padding:10px}.modal{padding:24px 18px;margin:2vh auto}}

<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AIC</div>
        <div><strong>Revision Studio</strong><span>GCSE • AQA • Offline</span></div>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-card">
        <div class="eyebrow">Revision streak</div>
        <div class="streak-row"><strong id="streakCount">0</strong><span>days</span></div>
        <div class="mini-progress"><i id="sidebarProgress"></i></div>
        <small id="sidebarProgressText">Start reviewing to build progress.</small>
      </div>
      <button class="ghost wide" id="resetProgressBtn">Reset local progress</button>
      <div class="source-note">Built from your uploaded revision transcripts. Obvious speech-to-text spelling errors have been normalised for study clarity.</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="topbar-title"><span id="sectionKicker">Revision dashboard</span><h1 id="sectionTitle">An Inspector Calls</h1></div>
        <div class="top-actions">
          <button class="icon-btn" id="focusBtn" title="Focus mode">◎</button>
          <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
const DATA = {
  nav: [
    ['dashboard','⌂','Dashboard','Revision dashboard'],['flashcards','▣','Flashcards','Active recall'],['characters','♟','Characters','Character mastery'],['themes','⌘','Themes','Big ideas'],['quotes','“','Quotations','Quote bank'],['context','◷','Context','1912 ↔ 1945'],['priestley','✦','Priestley','Writer & purpose'],['exam','✎','Exam Lab','Question practice'],['quiz','✓','Quick Quiz','Retrieval practice'],['connections','⤢','Connections','Think like Grade 9']
  ],
  quotes: [
    {id:'q1',q:'“Unsinkable, absolutely unsinkable.”',by:'Mr Birling',act:'Act 1',themes:['Capitalism','Class','Power','Dramatic irony'],word:'unsinkable',analysis:'Birling’s certainty becomes dramatic irony because the audience knows the Titanic sank. Priestley undermines Birling’s confidence and, by extension, the complacent worldview he represents.',pivot:'Use it beyond Birling: the “unsinkable” image can symbolise an elite class that imagines its wealth and status make it untouchable.'},
    {id:'q2',q:'“A man has to make his own way.”',by:'Mr Birling',act:'Act 1',themes:['Capitalism','Responsibility','Masculinity'],word:'man',analysis:'The individualistic phrasing makes self-interest sound like a rule of masculinity. It clashes directly with the Inspector’s collective message.',pivot:'Use it to contrast individualism with “members of one body”, or to discuss how patriarchal expectations shape men such as Eric and Gerald.'},
    {id:'q3',q:'“Girls of that class—”',by:'Mrs Birling',act:'Act 2',themes:['Class','Gender','Prejudice','Dehumanisation'],word:'that',analysis:'The distancing determiner “that” reduces working-class women to a stereotype rather than individuals. Class prejudice becomes a way of refusing empathy.',pivot:'Use it for class and gender together: Eva is disadvantaged by both poverty and being a young woman.'},
    {id:'q4',q:'“I accept no blame for it at all.”',by:'Mrs Birling',act:'Act 2',themes:['Responsibility','Generations','Pride'],word:'no',analysis:'The absolute “no” exposes her refusal to self-examine. Her certainty makes her a foil to Sheila, who accepts fault quickly.',pivot:'Useful for the older generation, moral blindness, and Priestley’s warning about people who protect status rather than learn.'},
    {id:'q5',q:'“We are members of one body.”',by:'Inspector Goole',act:'Act 3',themes:['Socialism','Responsibility','Community'],word:'one',analysis:'The body metaphor turns society into an interdependent organism: harm to one part damages the whole. “One” erases the hierarchy the Birlings depend on.',pivot:'This is a universal quote: link it to Eva, class, gender, capitalism/socialism, the Inspector, and Priestley’s post-war message.'},
    {id:'q6',q:'“Fire and blood and anguish.”',by:'Inspector Goole',act:'Act 3',themes:['Responsibility','War','Morality','Warning'],word:'fire',analysis:'The tricolon forms a prophetic, almost biblical warning. For a 1945 audience it also echoes the suffering of two world wars.',pivot:'Use it as the consequence of refusing responsibility: private selfishness can scale into social catastrophe.'},
    {id:'q7',q:'“You’re not the kind of father a chap could go to.”',by:'Eric Birling',act:'Act 3',themes:['Family','Generations','Masculinity'],word:'father',analysis:'Eric directly exposes the emotional failure beneath Birling’s material success. The family has status and possessions, but weak trust and intimacy.',pivot:'Use this to challenge the idea that capitalism automatically creates security or happiness.'},
    {id:'q8',q:'“She was a good sport.”',by:'Eric Birling',act:'Act 3',themes:['Gender','Power','Objectification'],word:'sport',analysis:'Calling Eva a “sport” sounds casual and depersonalising, revealing how male privilege can turn a vulnerable woman into an experience rather than a person.',pivot:'Use it to discuss objectification, gendered power and the need for accountability.'},
    {id:'q9',q:'“These girls aren’t cheap labour — they’re people.”',by:'Sheila Birling',act:'Act 1',themes:['Class','Responsibility','Change'],word:'people',analysis:'Sheila rejects the economic label “labour” and restores humanity with “people”. Her language starts moving from privilege toward empathy.',pivot:'A strong bridge between Sheila’s development and Priestley’s criticism of treating workers as costs.'},
    {id:'q10',q:'“It was my own fault.”',by:'Sheila Birling',act:'Act 1',themes:['Responsibility','Change','Generations'],word:'own',analysis:'The possessive “own” shows genuine personal accountability. Sheila does not need legal punishment to recognise moral responsibility.',pivot:'Contrast with Mrs Birling’s “no blame” to create a clear generational argument.'},
    {id:'q11',q:'“An impression of massiveness.”',by:'Stage direction: Inspector',act:'Act 1',themes:['Inspector','Power','Morality'],word:'massiveness',analysis:'His moral authority exceeds his physical size. Priestley gives him symbolic weight that can dominate people with far greater social status.',pivot:'Use it to argue that moral power is presented as stronger than wealth, class rank or patriarchal authority.'},
    {id:'q12',q:'“Millions and millions of Eva Smiths and John Smiths.”',by:'Inspector Goole',act:'Act 3',themes:['Class','Responsibility','Eva Smith','Society'],word:'millions',analysis:'The repetition widens Eva’s story into a social pattern. She becomes representative rather than exceptional.',pivot:'Use this to explain why Eva’s exact identity matters less than what she symbolises.'}
  ],
  characters: [
    {name:'Arthur Birling',role:'Capitalist patriarch • older generation',summary:'Confident, status-conscious and resistant to collective responsibility.',arc:'He begins certain of his worldview and ends trying to escape consequences rather than change.',methods:['Dramatic irony makes his certainty unreliable.','Business language reduces people to costs and status.','His conflict with Eric exposes a weak family beneath material success.'],quotes:['q1','q2'],nuance:'Do not reduce him to “evil”. Priestley makes him persuasive enough to represent a real ideology, then systematically undermines it.',links:['Capitalism','Class','Responsibility','Generations','Masculinity']},
    {name:'Sybil Birling',role:'Class privilege • tradition • older generation',summary:'Cold, proud and deeply invested in class hierarchy and respectability.',arc:'Her interrogation reveals prejudice, then her refusal of blame shows that social status has hardened into moral certainty.',methods:['Distancing language categorises poorer women.','Dramatic irony makes her condemn the father of Eva’s child before learning it is Eric.','She contrasts with Sheila’s willingness to learn.'],quotes:['q3','q4'],nuance:'A stronger interpretation: she also lives inside the patriarchal system she defends, so Priestley can show how oppressive systems reproduce themselves through their beneficiaries.',links:['Class','Gender','Responsibility','Pride','Generations']},
    {name:'Sheila Birling',role:'Younger generation • capacity for change',summary:'Starts sheltered and privileged, but develops empathy, independence and moral awareness.',arc:'From childish dependence to one of the clearest voices of responsibility after the Inspector leaves.',methods:['Her language becomes more assertive.','The ring becomes a symbol of changing attitudes to marriage and gender expectations.','She increasingly echoes the Inspector’s moral logic.'],quotes:['q9','q10'],nuance:'Her change is meaningful because she is not innocent at the start: she has already used class power against Eva.',links:['Change','Responsibility','Gender','Class','Generations']},
    {name:'Eric Birling',role:'Younger generation • damaged privilege',summary:'Uneasy, isolated and morally conflicted; capable of empathy but also serious harm.',arc:'His confession exposes the family’s failures and his own misuse of power. He accepts the night matters, but his redemption is less complete than Sheila’s.',methods:['Stage directions establish discomfort early.','Third-person or distancing language can reveal avoidance.','His attack on his parents turns family conflict into moral conflict.'],quotes:['q7','q8'],nuance:'Avoid calling Eric a simple hero. Priestley gives him some capacity to learn while keeping the consequences of his behaviour central.',links:['Gender','Responsibility','Family','Generations','Power']},
    {name:'Gerald Croft',role:'Old money • attractive face of privilege',summary:'Polished, socially secure and more sympathetic than Birling — but still invested in the same hierarchy.',arc:'He seems remorseful, yet ultimately helps dismantle the Inspector’s case and seeks a return to normality.',methods:['His charm complicates audience judgement.','His relationship with Daisy combines rescue with unequal power.','Structurally, he returns with information that lets the older generation evade the lesson.'],quotes:[],nuance:'A high-level reading is that Gerald is dangerous precisely because privilege appears reasonable and charming through him.',links:['Class','Gender','Capitalism','Power','Responsibility']},
    {name:'Inspector Goole',role:'Moral authority • Priestley’s structural engine',summary:'Controls the pace of revelation and forces private actions into a public moral framework.',arc:'He enters as an outsider, dismantles the family’s certainty, delivers a final warning and leaves the lesson behind.',methods:['Stage directions give him “massiveness”.','He reveals information in a controlled sequence.','His final speech uses collective pronouns, metaphor and prophetic imagery.'],quotes:['q5','q6','q11','q12'],nuance:'His supernatural identity is less important than his function: Priestley keeps the mystery open so the audience focuses on the message.',links:['Responsibility','Socialism','Morality','Structure','Community']},
    {name:'Eva Smith / Daisy Renton',role:'Absent centre • working-class “everywoman”',summary:'Never appears on stage, yet every major character is defined by how they treat her.',arc:'Her fragmented story reveals a chain of consequences across work, class, gender, charity and sexual power.',methods:['Absence makes her easy for privileged characters to speak over.','The common surname “Smith” supports her representative function.','The Inspector widens her story to “millions and millions”.'],quotes:['q12'],nuance:'The uncertainty over whether the stories concern one woman does not weaken the moral argument; it can strengthen the idea that Eva represents many vulnerable people.',links:['Class','Gender','Responsibility','Power','Symbolism']}

  themes: [
    {name:'Responsibility',icon:'◎',thesis:'Priestley presents responsibility as moral and collective, not merely legal: people must consider the consequences of their power on others.',quotes:['q4','q5','q6','q10'],characters:['Inspector Goole','Sheila Birling','Arthur Birling','Sybil Birling'],context:'The 1945 audience had lived through collective sacrifice in wartime, making the Inspector’s communal language especially forceful.'},
    {name:'Class & inequality',icon:'◆',thesis:'Class hierarchy allows the wealthy to convert money and status into control over work, reputation and access to help.',quotes:['q1','q3','q9','q12'],characters:['Eva Smith / Daisy Renton','Arthur Birling','Sybil Birling','Gerald Croft'],context:'The play is set in 1912, when class divisions and worker protections were far more unequal than the post-war Britain watching the play.'},
    {name:'Capitalism vs socialism',icon:'⇄',thesis:'Priestley sets Birling’s individualism against the Inspector’s image of society as “one body”, turning ideology into a conflict between isolation and interdependence.',quotes:['q2','q5','q6'],characters:['Arthur Birling','Inspector Goole','Gerald Croft'],context:'The contrast between 1912 and 1945 lets Priestley challenge pre-war complacency from a post-war perspective.'},
    {name:'Gender & patriarchy',icon:'⚖',thesis:'Women’s vulnerability is intensified by class, while upper-class women are also expected to live inside restrictive gender roles.',quotes:['q3','q8'],characters:['Eva Smith / Daisy Renton','Sheila Birling','Sybil Birling','Eric Birling','Gerald Croft'],context:'The play looks back at Edwardian gender expectations from a Britain transformed by women’s wartime roles and expanded political rights.'},
    {name:'Generations & change',icon:'↗',thesis:'The younger generation is presented as more capable of change, but Priestley avoids making youth automatically virtuous.',quotes:['q4','q7','q10'],characters:['Sheila Birling','Eric Birling','Arthur Birling','Sybil Birling'],context:'A 1945 audience is invited to decide whether society will repeat old mistakes or build something different after war.'},
    {name:'Power & dehumanisation',icon:'▰',thesis:'Privilege becomes dangerous when other people are reduced to labour, stereotypes, entertainment or social inconvenience.',quotes:['q3','q8','q9','q11'],characters:['Eva Smith / Daisy Renton','Arthur Birling','Sybil Birling','Eric Birling','Inspector Goole'],context:'Priestley repeatedly shifts attention from legal guilt to moral use of power.'}
  ],
  timeline: [
    {year:'1912',title:'The play is set',text:'The Birling household sits inside a rigid class structure. Birling speaks with confidence about progress, business and the future.'},
    {year:'1912',title:'Titanic & pre-war confidence',text:'Birling’s “unsinkable” certainty becomes dramatic irony for audiences who know what happens next.'},
    {year:'1914–1918',title:'First World War',text:'The confidence of 1912 is shattered. The Inspector’s warnings gain extra force because the audience knows the suffering that follows.'},
    {year:'1939–1945',title:'Second World War',text:'Britain experiences mass mobilisation and collective sacrifice. Ideas about society, welfare and responsibility become urgent.'},
    {year:'1945',title:'The play appears',text:'Priestley writes for a post-war audience while setting the action before both world wars, creating a powerful double perspective.'},
    {year:'1945',title:'A political appetite for change',text:'The revision material links the play to the growing appeal of social reform and collective responsibility in post-war Britain.'}

  questions: [
    {q:'How does Priestley present responsibility in An Inspector Calls?',focus:'Responsibility',points:['Birling’s individualism','Sheila’s acceptance of fault','Inspector’s “one body” metaphor','Ending as warning against forgetting'],model:'Priestley presents responsibility as a moral duty that reaches beyond the individual. Birling’s belief that “a man has to make his own way” reduces society to private self-interest, but the Inspector replaces this with the metaphor that “we are members of one body”. The noun “members” suggests each person has a function within a larger whole, while “one” removes the class divisions the Birlings depend upon. Priestley therefore turns Eva’s death into a test of whether privileged people will recognise the consequences of their power. For a 1945 audience shaped by war and collective sacrifice, the Inspector’s message would challenge any attempt to return to the complacency represented by Birling.'},
    {q:'How does Priestley present Sheila as a character who changes?',focus:'Sheila',points:['Privilege at the start','“my own fault”','defence of workers as “people”','continues the Inspector’s lesson'],model:'Priestley uses Sheila to show that change begins with honest self-judgement. Her admission that “it was my own fault” is significant because the possessive “own” accepts responsibility without waiting for punishment or proof. This separates her from Mrs Birling, whose absolute refusal of blame shows how status can block self-knowledge. Sheila’s later insistence that workers are “people” also restores the humanity that capitalist language removes. Priestley does not make her innocent; instead, he makes her valuable because she learns from the harm she has caused.'},
    {q:'How does Priestley present class inequality?',focus:'Class',points:['Eva’s vulnerability','Mrs Birling’s stereotypes','Birling’s business logic','Inspector widens Eva into “millions”'],model:'Priestley presents class inequality as a system that encourages the powerful to stop seeing poorer people as individuals. Mrs Birling’s phrase “girls of that class” uses the distancing word “that” to compress different women into a single stereotype. Once Eva is treated as a category rather than a person, refusing her help becomes easier. This is challenged by the Inspector’s reference to “millions and millions” of people like Eva: the repetition transforms one private tragedy into evidence of a social pattern. Priestley therefore asks the audience to judge the system, not only the behaviour of one family.'},
    {q:'How does Priestley use the Inspector to communicate his ideas?',focus:'Inspector',points:['“massiveness”','controlled revelations','“one body”','“fire and blood and anguish”'],model:'Priestley gives the Inspector authority that is moral rather than social. The stage direction describing an “impression of massiveness” is paradoxical because his physical size does not explain his power; instead, his certainty dominates people who possess more wealth and status. Structurally, he controls the order of revelations and prevents the family from hiding behind respectability. His final warning of “fire and blood and anguish” sounds prophetic and almost biblical, making social responsibility feel like an urgent moral law rather than a polite political preference.'},
    {q:'How does Priestley present the conflict between generations?',focus:'Generations',points:['parents resist blame','Sheila learns','Eric partly changes','ending tests whether lesson lasts'],model:'Priestley uses generational conflict to explore whether society can change. Mrs Birling’s declaration that she accepts “no blame” contrasts sharply with Sheila’s “my own fault”, creating two opposing responses to the same moral test. The older generation protects certainty and status; Sheila treats discomfort as a reason to rethink her values. Eric is more complicated because he recognises the lesson while also having caused serious harm. Priestley therefore offers hope through youth, but not automatic innocence: change requires responsibility, not simply being young.'},
    {q:'How does Priestley present gender and power?',focus:'Gender',points:['Eva doubly vulnerable','Gerald/Eric unequal power','Mrs Birling accepts conventions','Sheila challenges expectations'],model:'Priestley presents gender inequality as inseparable from class. Eva’s lack of wealth means that male attention is not balanced by equal social power, so relationships that may appear romantic or casual are shaped by dependence. Eric’s description of her as a “good sport” is revealing because “sport” turns a person into an experience, suggesting emotional distance and objectification. By contrast, Sheila increasingly questions the expectations around her engagement. Priestley uses these women to show that patriarchy restricts people differently according to class and status.'}
  ],
  flashcards: []
};

function save(){localStorage.setItem('aic_page',state.page);localStorage.setItem('aic_examIndex',state.examIndex);localStorage.setItem('aic_progress',JSON.stringify(state.progress));}
function todayKey(){return new Date().toISOString().slice(0,10)}
function touchDay(){const t=todayKey(); if(state.progress.lastDay!==t){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);state.progress.streak=state.progress.lastDay===y?(state.progress.streak||0)+1:1;state.progress.lastDay=t;save();}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function qById(id){return DATA.quotes.find(q=>q.id===id)}
function nav(){const n=$('#nav');n.innerHTML=DATA.nav.map(([id,icon,label])=>`<button class="nav-btn ${state.page===id?'active':''}" data-page="${id}"><span class="nav-icon">${icon}</span><span>${label}</span></button>`).join(''); $$('.nav-btn').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function go(page){state.page=page;state.progress.visits[page]=(state.progress.visits[page]||0)+1;touchDay();save();nav();render();window.scrollTo({top:0,behavior:'smooth'});$('#sidebar').classList.remove('open')}
function setHeader(){const item=DATA.nav.find(x=>x[0]===state.page)||DATA.nav[0];$('#sectionKicker').textContent=item[3];$('#sectionTitle').textContent=item[2]==='Dashboard'?'An Inspector Calls':item[2];}

 characters(){return `<div class="controls"><input class="search" id="charSearch" placeholder="Search a character or idea…"></div><div class="grid grid-3" id="charGrid">${characterCards(DATA.characters)}</div>`},
 themes(){return `<div class="grid grid-3">${DATA.themes.map(t=>`<article class="card hover theme-card"><span class="tag accent">${t.icon} Theme</span><h3>${t.name}</h3><p class="thesis">${t.thesis}</p><div class="tags">${t.characters.slice(0,4).map(c=>`<span class="tag">${c.split(' ')[0]}</span>`).join('')}</div><div class="divider"></div><div class="muted">Context move</div><p>${t.context}</p><button class="ghost" data-theme="${t.name}">Open evidence map →</button></article>`).join('')}</div>`},
 quotes(){const themeOpts=['All',...new Set(DATA.quotes.flatMap(q=>q.themes))];const filtered=DATA.quotes.filter(q=>(state.quoteFilter==='All'||q.themes.includes(state.quoteFilter))&&(!state.quoteSearch||(`${q.q} ${q.by} ${q.analysis} ${q.themes.join(' ')}`.toLowerCase().includes(state.quoteSearch.toLowerCase()))));return `<div class="controls"><input class="search" id="quoteSearch" value="${escapeHtml(state.quoteSearch)}" placeholder="Search quote, character, theme or method…"><select class="search" id="quoteFilter">${themeOpts.map(x=>`<option ${x===state.quoteFilter?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid grid-3" id="quoteGrid">${filtered.map(quoteCard).join('')||'<div class="card">No matching quotations.</div>'}</div>`},
 context(){return `<div class="detail-hero"><div class="card"><span class="tag accent">The master context move</span><h2>1912 is the trap.<br>1945 is the judgement.</h2><p class="muted">Priestley sets the action before the First World War but writes for an audience that already knows the consequences of that confidence. Context works best when it explains the dramatic choice — not when it is bolted on as a history fact.</p><div class="callout"><strong>Exam sentence:</strong> “By setting the play in 1912 but addressing a 1945 audience, Priestley turns Birling’s certainty into dramatic irony and invites viewers to reject the complacency of the pre-war elite.”</div></div><div class="card"><div class="eyebrow">Context rule</div><div class="metric">C → M → E</div><p><strong>Context → Method → Effect.</strong> Connect the historical fact to something Priestley actually does on stage, then explain why it matters.</p><div class="divider"></div><span class="tag green">Never write a history paragraph on its own</span></div></div><div class="section-head"><div><h2>Timeline</h2><p>Learn the contrast, not a list of dates.</p></div></div><div class="card timeline">${DATA.timeline.map(t=>`<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-year">${t.year}</div><h3>${t.title}</h3><p>${t.text}</p></div>`).join('')}</div><div class="section-head"><div><h2>Context lenses</h2></div></div><div class="grid grid-3"><div class="card"><span class="tag">Class</span><h3>Hierarchy</h3><p class="muted">The materials emphasise sharp class divisions and the ease with which wealth becomes power over workers and access to help.</p></div><div class="card"><span class="tag">Politics</span><h3>Collective responsibility</h3><p class="muted">Priestley’s socialist outlook makes the Inspector’s “one body” message the ideological counterweight to Birling.</p></div><div class="card"><span class="tag">Form</span><h3>Morality play</h3><p class="muted">The revision material reads the play through morality-play conventions: social failings are exposed so the audience can learn a moral lesson.</p></div></div>`},
 priestley(){return `<div class="detail-hero"><div class="card"><span class="tag accent">J. B. Priestley</span><h2>The writer behind the warning</h2><p class="muted">Your revision material presents Priestley as a socialist writer using drama to argue for collective responsibility and to criticise class hierarchy, selfish capitalism and social complacency.</p><div class="divider"></div><h3>What he wants the audience to do</h3><ul class="bullet-list"><li>Judge behaviour morally, not only legally.</li><li>See Eva as representative of many vulnerable people.</li><li>Question inherited class and gender hierarchies.</li><li>Recognise that private actions can have public consequences.</li><li>Choose change instead of repeating the past.</li></ul></div><div class="card"><span class="tag green">Purpose toolkit</span><h3>Better than “Priestley wants to show…”</h3><p>Use more precise verbs:</p><div class="tags">${['challenges','undermines','warns','exposes','contrasts','satirises','humanises','condemns','urges','destabilises'].map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="divider"></div><div class="callout green"><strong>High-level move:</strong> describe the audience Priestley is trying to create — more sceptical of status, more alert to inequality, and more willing to accept collective responsibility.</div></div></div><div class="section-head"><div><h2>Priestley’s dramatic toolbox</h2></div></div><div class="grid grid-3"><div class="card"><h3>Dramatic irony</h3><p class="muted">Birling makes confident predictions a later audience knows are wrong, weakening his ideological authority.</p></div><div class="card"><h3>Controlled revelation</h3><p class="muted">The Inspector uncovers one link at a time, turning a celebration into a moral investigation.</p></div><div class="card"><h3>Cyclical ending</h3><p class="muted">The final phone call suggests lessons rejected may have to be learned again — this time with real consequences.</p></div></div>`},
 exam(){const e=DATA.questions[state.examIndex%DATA.questions.length];return `<div class="exam-layout"><div><div class="question-box"><div class="eyebrow">Hypothetical AQA-style question</div><h2>${e.q}</h2><div class="tags"><span class="tag accent">${e.focus}</span><span class="tag">Whole play</span><span class="tag">No extract</span></div><div class="hero-actions"><button class="primary" id="newQuestion">New question</button><button class="secondary" id="timerBtn">Start 12-min plan</button><span class="timer" id="timerDisplay">12:00</span></div></div><div class="section-head"><div><h2>Build your plan</h2><p>Thesis → 3 arguments → evidence → writer’s purpose.</p></div></div><div class="plan-grid">${['Thesis: your answer in one arguable sentence','Paragraph 1: idea + quote + method','Paragraph 2: idea + quote + method','Paragraph 3: idea + quote + method','Context / Priestley purpose woven through'].map((x,i)=>`<div class="plan-field"><label>${x}</label><textarea data-plan="${i}" placeholder="Write from memory…"></textarea></div>`).join('')}</div></div><aside><div class="card"><div class="eyebrow">Model route</div><h3>Possible paragraph map</h3>${e.points.map((p,i)=>`<div class="connection"><strong>0${i+1}</strong><span>${p}</span></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="eyebrow">Short model answer</div><div class="model-answer answer-hidden" id="modelAnswer">${e.model}</div><button class="ghost wide" id="revealModel">Reveal model</button></div><div class="card" style="margin-top:16px"><div class="eyebrow">Self-check</div><div class="mark-grid"><div class="mark-chip"><strong>AO1</strong>argument</div><div class="mark-chip"><strong>AO2</strong>methods</div><div class="mark-chip"><strong>AO3</strong>context</div><div class="mark-chip"><strong>✓</strong>focus</div></div></div></aside></div>`},
 quiz(){const qs=quizQuestions();const item=qs[state.quizIndex%qs.length];return `<div class="grid grid-2"><div class="card"><div class="flash-meta"><span>Question ${state.quizIndex+1} / 10</span><span>Score ${state.quizScore}</span></div><div class="progress-line"><i style="width:${(state.quizIndex+1)*10}%"></i></div><h2>${item.q}</h2><div>${item.opts.map((o,i)=>`<button class="quiz-option" data-quiz="${i}">${o}</button>`).join('')}</div><div id="quizFeedback"></div></div><div class="card"><span class="tag accent">Why this works</span><h3>Retrieval beats recognition</h3><p class="muted">The questions mix quotations, methods, character interpretation, structure and context so you have to switch between knowledge types — exactly what an essay requires.</p><div class="divider"></div><div class="metric">${state.progress.quizBest||0}/10</div><strong>Personal best</strong></div></div>`},
 connections(){return `<div class="detail-hero"><div class="card"><span class="tag accent">Grade 9 habit</span><h2>Stop asking “What does this quote mean?”</h2><p class="muted">Ask: “How many defensible arguments can I make from it?” The best revision evidence is portable.</p><div class="callout">Pick one quote below. Cover the analysis. Force yourself to connect it to <strong>three</strong> different exam questions before reading the suggested pivots.</div></div><div class="card blurting"><div class="eyebrow">Blurting station</div><h3 id="blurtPrompt">Explain “We are members of one body” in 60 seconds.</h3><textarea id="blurtText" placeholder="Type everything you can remember — method, meaning, context, purpose, alternative use…"></textarea><button class="ghost" id="checkBlurt">Compare with key points</button><div id="blurtResult"></div></div></div><div class="section-head"><div><h2>One quote → many questions</h2><p>Portable evidence map.</p></div></div><div class="grid grid-2">${DATA.quotes.slice(0,8).map(q=>`<div class="card"><div class="quote-by">${q.by}</div><h3>${q.q}</h3><div class="tags">${q.themes.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="divider"></div><div class="connection"><strong>Word zoom</strong><span><b>${q.word}</b> — ${q.analysis}</span></div><div class="connection"><strong>Pivot</strong><span>${q.pivot}</span></div></div>`).join('')}</div>`}
};

function characterCards(arr){return arr.map((c,i)=>`<article class="card hover character-card"><div class="character-number">0${i+1}</div><span class="tag accent">${c.role.split('•')[0]}</span><h3>${c.name}</h3><div class="role">${c.role}</div><p class="arc">${c.summary}</p><div class="tags">${c.links.slice(0,3).map(x=>`<span class="tag">${x}</span>`).join('')}</div><button class="ghost" data-character="${c.name}">Open character profile →</button></article>`).join('')}
function quoteCard(q){return `<article class="card hover quote-card"><div class="quote-by">${q.by} • ${q.act}</div><q>${q.q.replace(/[“”]/g,'')}</q><div class="tags">${q.themes.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="quote-surgery"><strong>Zoom:</strong> “${q.word}” — ${q.analysis}</div><button class="ghost" style="margin-top:14px" data-modal-quote="${q.id}">See flexible uses →</button></article>`}

function openModal(html){$('#modalContent').innerHTML=html;$('#modalBackdrop').hidden=false;document.body.style.overflow='hidden'}
function closeModal(){$('#modalBackdrop').hidden=true;document.body.style.overflow=''}
function characterModal(c){openModal(`<span class="tag accent">Character profile</span><h2>${c.name}</h2><p class="muted">${c.role}</p><div class="grid grid-2"><div><h3>Core argument</h3><p>${c.summary}</p><h3>Arc</h3><p>${c.arc}</p><h3>Priestley’s methods</h3><ul class="bullet-list">${c.methods.map(m=>`<li>${m}</li>`).join('')}</ul></div><div><h3>Useful quotations</h3><div class="quote-list">${c.quotes.length?c.quotes.map(id=>{const q=qById(id);return `<div class="quote-chip"><q>${q.q.replace(/[“”]/g,'')}</q><div class="muted">${q.themes.join(' • ')}</div></div>`}).join(''):'<div class="quote-chip">Use his actions and structural role alongside quotations from other characters.</div>'}</div><h3>Nuanced interpretation</h3><div class="callout green">${c.nuance}</div></div></div>`)}
function quoteModal(q){openModal(`<span class="tag accent">Quote surgery</span><h2>${q.q}</h2><p class="muted">${q.by} • ${q.act}</p><div class="grid grid-2"><div><h3>Word-level zoom</h3><div class="callout"><strong>${q.word}</strong><br>${q.analysis}</div><h3>Portable uses</h3><div class="tags">${q.themes.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div><h3>Grade 9 pivot</h3><p>${q.pivot}</p><h3>Sentence stem</h3><p class="quote-chip">Priestley’s use of “${q.word}” can be read not only as __________, but also as __________, allowing him to challenge __________.</p></div></div>`)}
function themeModal(t){openModal(`<span class="tag accent">Theme evidence map</span><h2>${t.name}</h2><div class="callout"><strong>Thesis:</strong> ${t.thesis}</div><h3>Evidence</h3><div class="quote-list">${t.quotes.map(id=>{const q=qById(id);return `<div class="quote-chip"><q>${q.q.replace(/[“”]/g,'')}</q><div class="muted">${q.by} — ${q.analysis}</div></div>`}).join('')}</div><h3>Context woven in</h3><p>${t.context}</p>`)}

function bindPage(){
 $$('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));
 $$('[data-character]').forEach(x=>x.onclick=()=>characterModal(DATA.characters.find(c=>c.name===x.dataset.character)));
 $$('[data-modal-quote]').forEach(x=>x.onclick=()=>quoteModal(qById(x.dataset.modalQuote)));
 $$('[data-theme]').forEach(x=>x.onclick=()=>themeModal(DATA.themes.find(t=>t.name===x.dataset.theme)));
 if(state.page==='flashcards')bindFlash(); if(state.page==='characters')bindCharacters(); if(state.page==='quotes')bindQuotes(); if(state.page==='exam')bindExam(); if(state.page==='quiz')bindQuiz(); if(state.page==='connections')bindConnections();
}
function bindFlash(){
 const pool=()=>state.flashFilter==='All'?DATA.flashcards:DATA.flashcards.filter(f=>f.cat===state.flashFilter);
 const flip=()=>$('#flashcard')?.classList.toggle('flipped'); $('#flashcard').onclick=flip;
 $('#nextFlash').onclick=()=>{state.flashIndex=(state.flashIndex+1)%pool().length;render()};$('#prevFlash').onclick=()=>{state.flashIndex=(state.flashIndex-1+pool().length)%pool().length;render()};
 $('#shuffleFlash').onclick=()=>{state.flashIndex=Math.floor(Math.random()*pool().length);render()};
 $$('[data-flash-filter]').forEach(b=>b.onclick=()=>{state.flashFilter=b.dataset.flashFilter;state.flashIndex=0;render()});
 $$('[data-rate]').forEach(b=>b.onclick=()=>{const idx=+b.dataset.card;const a=b.dataset.rate,other=a==='known'?'missed':'known';if(!state.progress[a].includes(idx))state.progress[a].push(idx);state.progress[other]=state.progress[other].filter(x=>x!==idx);save();touchDay();toast(a==='known'?'Marked secure ✓':'Added to “needs work”');state.flashIndex=(state.flashIndex+1)%pool().length;render()});
}
function bindCharacters(){const s=$('#charSearch');s.oninput=()=>{const q=s.value.toLowerCase();const arr=DATA.characters.filter(c=>JSON.stringify(c).toLowerCase().includes(q));$('#charGrid').innerHTML=characterCards(arr);$$('[data-character]').forEach(x=>x.onclick=()=>characterModal(DATA.characters.find(c=>c.name===x.dataset.character)))} }
function bindQuotes(){const s=$('#quoteSearch'),f=$('#quoteFilter');s.oninput=()=>{state.quoteSearch=s.value;render()};f.onchange=()=>{state.quoteFilter=f.value;render()}}
function bindExam(){
 $('#newQuestion').onclick=()=>{state.examIndex=(state.examIndex+1)%DATA.questions.length;save();stopTimer();render()};
 $('#revealModel').onclick=()=>{const a=$('#modelAnswer');a.classList.toggle('answer-hidden');$('#revealModel').textContent=a.classList.contains('answer-hidden')?'Reveal model':'Hide model'};
 $('#timerBtn').onclick=()=>{if(state.timer){stopTimer();$('#timerBtn').textContent='Start 12-min plan';return}state.timerSeconds=720;$('#timerBtn').textContent='Pause timer';state.timer=setInterval(()=>{state.timerSeconds--;const m=String(Math.floor(state.timerSeconds/60)).padStart(2,'0'),s=String(state.timerSeconds%60).padStart(2,'0');const d=$('#timerDisplay');if(d)d.textContent=`${m}:${s}`;if(state.timerSeconds<=0){stopTimer();toast('Planning time complete.')}} ,1000)};
}
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function quizQuestions(){return [
 {q:'Why is “unsinkable, absolutely unsinkable” powerful?',opts:['It proves Birling is brave','It creates dramatic irony that undermines his certainty','It shows the Inspector is wrong','It is a metaphor for Eva'],a:1,e:'The audience knows the Titanic sank, so Birling’s certainty damages his authority.'},
 {q:'Which quotation best expresses collective responsibility?',opts:['“Girls of that class”','“My own fault”','“Members of one body”','“Good sport”'],a:2,e:'The body metaphor presents society as interdependent.'},
 {q:'What does “that” suggest in “girls of that class”?',opts:['Affection','Distance and stereotyping','Uncertainty','Admiration'],a:1,e:'The determiner distances Mrs Birling from working-class women and reduces them to a category.'},
 {q:'What is the strongest contrast to Birling’s individualism?',opts:['Gerald’s charm','The Inspector’s collective pronouns and body metaphor','Eric’s drinking','The engagement ring'],a:1,e:'Priestley stages an ideological clash between self-interest and communal responsibility.'},
 {q:'Why is Sheila useful in an essay on change?',opts:['She never makes mistakes','She immediately accepts responsibility and grows more assertive','She is older than Eric','She agrees with Mrs Birling'],a:1,e:'Her value lies in learning from harm, not in being innocent.'},
 {q:'What does the final phone call help create?',opts:['Comic relief','Cyclical structure','A romantic ending','A flashback'],a:1,e:'The family may have to face the lesson again because some characters rejected it.'},
 {q:'Why is Eva’s absence from the stage significant?',opts:['She is unimportant','It mirrors how vulnerable people can be spoken about rather than heard','It proves she is imaginary','It makes the play shorter'],a:1,e:'Her absence strengthens the theme of invisibility and lets her operate symbolically.'},
 {q:'“Fire and blood and anguish” is best described as…',opts:['A tricolon with prophetic imagery','A simile','Comic hyperbole only','A stage direction'],a:0,e:'The three-part phrase sounds prophetic and evokes severe consequences.'},
 {q:'Which is the best way to use context?',opts:['Write a separate history paragraph','Link context to a dramatic method and Priestley’s purpose','List as many dates as possible','Avoid it'],a:1,e:'Context earns its value when it explains how and why Priestley constructs the play.'},
 {q:'Why can Gerald be read as especially dangerous?',opts:['He is openly foolish','He makes privilege appear charming and reasonable while still protecting hierarchy','He has no status','He completely accepts the Inspector’s lesson'],a:1,e:'A polished defender of privilege may be more persuasive than Birling’s obvious arrogance.'}
]}
function bindQuiz(){
 const questions=quizQuestions();
 const item=questions[state.quizIndex%questions.length];
 function showFeedback(){
  $$('[data-quiz]').forEach((button,i)=>{
   button.classList.toggle('correct',i===item.a);
   button.classList.toggle('wrong',i===state.quizAnswer&&i!==item.a);
   button.disabled=true;
  });
  $('#quizFeedback').innerHTML=`<div class="quiz-explain" role="status">${item.e}</div><button class="primary" id="nextQuiz" style="margin-top:12px">${state.quizIndex===questions.length-1?'Finish quiz':'Next question'}</button>`;
  $('#nextQuiz').onclick=()=>{
   if(state.quizIndex===questions.length-1){
    state.progress.quizBest=Math.max(state.progress.quizBest||0,state.quizScore);
    save();toast(`Quiz complete: ${state.quizScore}/${questions.length}`);
    state.quizIndex=0;state.quizScore=0;
   }else state.quizIndex++;
   state.quizLocked=false;state.quizAnswer=null;render();
  };
 }
 $$('[data-quiz]').forEach(button=>button.onclick=()=>{
  if(state.quizLocked)return;
  state.quizAnswer=+button.dataset.quiz;
  state.quizLocked=true;
  if(state.quizAnswer===item.a)state.quizScore++;
  showFeedback();
 });
 if(state.quizLocked)showFeedback();
}
function bindConnections(){$('#checkBlurt').onclick=()=>{$('#blurtResult').innerHTML=`<div class="recall-points"><div class="recall-point"><strong>Method:</strong> body metaphor / collective pronoun.</div><div class="recall-point"><strong>Meaning:</strong> society is interdependent; harm cannot be isolated.</div><div class="recall-point"><strong>Contrast:</strong> directly opposes Birling’s individualism.</div><div class="recall-point"><strong>Context:</strong> resonates with a 1945 audience shaped by collective wartime experience.</div><div class="recall-point"><strong>Purpose:</strong> makes social responsibility feel universal, not optional.</div></div>`}}

$('#modalClose').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('aic_theme',document.body.classList.contains('light')?'light':'dark')};$('#focusBtn').onclick=()=>document.body.classList.toggle('focus-mode');$('#resetProgressBtn').onclick=()=>{if(confirm('Reset flashcard ratings, streak and quiz best?')){state.progress={known:[],missed:[],quizBest:0,visits:{},streak:0,lastDay:''};save();updateProgressUI();toast('Progress reset')}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.code==='Space'&&state.page==='flashcards'&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();$('#flashcard')?.classList.toggle('flipped')}if(e.key==='ArrowRight'&&state.page==='flashcards')$('#nextFlash')?.click();if(e.key==='ArrowLeft'&&state.page==='flashcards')$('#prevFlash')?.click()});
if(localStorage.getItem('aic_theme')==='light')document.body.classList.add('light');
touchDay();nav();render();

</script>

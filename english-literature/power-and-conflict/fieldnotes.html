<style>

<script>
const DATA={"poems": [{"title": "Ozymandias", "author": "Percy Bysshe Shelley", "era": "1818", "themes": ["Power", "Nature", "Identity"], "meaning": "A traveller describes the broken statue of a ruler in an empty desert. The ruler’s boast survives; his empire does not.", "argument": "Political power depends on an illusion of permanence that time and nature expose.", "journey": ["A distant, second-hand account reduces the ruler’s authority.", "The sculptor preserves the ruler’s arrogance in a broken face.", "The boast is answered by an empty landscape."], "form": "A 14-line sonnet with an interwoven rhyme scheme. The nested voices distance us from the ruler; the abrupt turn from boast to emptiness makes the ending an answer to his claim of greatness.", "context": "Shelley’s opposition to tyranny helps explain why this ruler is remembered for arrogance rather than achievement. The ancient setting can become a warning to rulers in any age.", "nuance": "The art and words outlast the empire, so not everything has vanished. Art preserves evidence of tyranny while also exposing its failure.", "quotes": [{"text": "sneer of cold command", "method": "Facial imagery and alliteration", "analysis": "The sculptor captures contempt, making domination the ruler’s defining legacy. The hard consonants can sharpen the phrase’s severity."}, {"text": "King of Kings", "method": "Grandiose title", "analysis": "The ruler claims supremacy over other rulers. Set against ruins, the title becomes evidence of self-deception."}, {"text": "Nothing beside remains.", "method": "Abrupt sentence / structural turn", "analysis": "The blunt negation answers the boast. The surviving monument cannot preserve the political power it was built to advertise."}]}, {"title": "London", "author": "William Blake", "era": "1794", "themes": ["Power", "Identity", "Place"], "meaning": "A speaker walks through London and hears suffering everywhere, linking it to political, religious and social institutions.", "argument": "Oppression becomes most powerful when institutions make it seem normal and people internalise it.", "journey": ["Streets and river appear controlled.", "Repeated cries reveal suffering across society.", "The final image contaminates marriage and the next generation."], "form": "Four quatrains with an ABAB rhyme scheme create an insistent pattern. Repeated words and the return to suffering offer little sense of escape; the final oxymoron extends corruption into intimate life.", "context": "Blake’s radical critique of late eighteenth-century institutions makes the Church and monarchy accountable for suffering. Use this to explain his accusations, rather than listing historical events.", "nuance": "The speaker exposes mental imprisonment but the poem itself is an act of resistance. Its bleak ending does not mean Blake approves of resignation.", "quotes": [{"text": "charter’d", "method": "Repetition", "analysis": "Applied to streets and the Thames, the word suggests official ownership or regulation reaching even into nature."}, {"text": "mind-forg’d manacles", "method": "Metaphor", "analysis": "Chains become psychological: belief, fear and accepted social rules help sustain material oppression."}, {"text": "marriage hearse", "method": "Oxymoronic image", "analysis": "A union associated with new life is fused with death. The final image suggests corruption reaches love, family and the future."}]}, {"title": "Extract from The Prelude", "author": "William Wordsworth", "era": "1850 publication", "themes": ["Nature", "Identity", "Memory"], "meaning": "A boy takes a boat and rows confidently until a mountain seems to pursue him. He returns shaken and remains troubled afterwards.", "argument": "An encounter with nature dismantles human confidence and reshapes the imagination.", "journey": ["Pleasure is mixed with awareness of wrongdoing.", "Confident rowing gives way to the mountain’s overwhelming presence.", "The event returns as a lasting disturbance in the mind."], "form": "An autobiographical first-person narrative in blank verse: mainly iambic pentameter without rhyme. The shift from confident movement to disturbed reflection makes psychological change central.", "context": "Romantic writing often explores the sublime: awe mixed with terror before something vast. Wordsworth’s reflective adult voice revisits a formative childhood experience.", "nuance": "The mountain does not literally chase the boy. Personification shows his changing perception; nature can educate as well as frighten.", "quotes": [{"text": "an act of stealth / And troubled pleasure", "method": "Juxtaposition", "analysis": "Enjoyment is already unsettled by guilt. The later fear develops a tension present from the start."}, {"text": "a huge peak, black and huge", "method": "Repetition and visual imagery", "analysis": "The repeated adjective suggests that scale overwhelms the boy’s ability to describe what he sees."}, {"text": "Trouble to my dreams", "method": "Ending / psychological aftermath", "analysis": "The power of the encounter survives after the physical danger has passed, transforming the boy’s inner life."}]}, {"title": "My Last Duchess", "author": "Robert Browning", "era": "1842", "themes": ["Power", "Identity", "Memory"], "meaning": "A Duke shows a visitor a portrait of his former wife while negotiating another marriage. His complaints reveal jealousy and a desire for control.", "argument": "Possessive power turns a living person into an object, but the ruler’s own speech exposes his moral weakness.", "journey": ["The Duke controls access to a portrait.", "His complaints reveal resentment of the Duchess’s independent pleasure.", "Marriage bargaining and an artwork return women and nature to possessions."], "form": "A dramatic monologue in rhyming iambic pentameter couplets. Enjambment and pauses complicate the polished surface; a single controlling voice accidentally reveals more than it intends.", "context": "The Renaissance aristocratic setting foregrounds inheritance, status and marriage as a transaction. Browning’s Victorian readers could also recognise patriarchal attitudes.", "nuance": "The Duke implies that his commands ended her smiles; the exact fate and mechanism are not stated. Distinguish the Duke’s values from Browning’s critique.", "quotes": [{"text": "my last Duchess", "method": "Possessive determiner", "analysis": "The relationship is introduced through ownership and succession, as if the Duchess were part of a collection."}, {"text": "I gave commands", "method": "Euphemism and withheld detail", "analysis": "The chilling brevity hides what happened while displaying his authority. The omission invites suspicion rather than providing a confession with full details."}, {"text": "Neptune", "method": "Mythological allusion at the ending", "analysis": "The final artwork of a god controlling a sea-horse reinforces the Duke’s admiration for domination."}]}, {"title": "The Charge of the Light Brigade", "author": "Alfred Lord Tennyson", "era": "1854", "themes": ["Conflict", "Power", "Identity"], "meaning": "A cavalry brigade follows a mistaken order into deadly gunfire. The poem commemorates the soldiers’ courage while acknowledging a failure of command.", "argument": "Soldiers’ collective courage deserves remembrance even when the authority directing them is fallible.", "journey": ["The charge begins with urgent forward momentum.", "Obedience and encirclement expose danger and flawed leadership.", "Survivors return and the audience is commanded to honour the brigade."], "form": "Six stanzas, strong dactylic rhythms and repeated references to the six hundred give this narrative poem a ballad-like, commemorative quality. The movement through the valley ends in a public call to remember.", "context": "The poem responds to the Battle of Balaclava in the Crimean War. As Poet Laureate, Tennyson writes public commemoration, yet explicitly acknowledges a military blunder.", "nuance": "It neither simply glorifies war nor only condemns it. Analyse the tension between honouring soldiers and questioning the order they obeyed.", "quotes": [{"text": "Someone had blunder’d", "method": "Blunt statement / indefinite pronoun", "analysis": "The mistake is acknowledged, yet its author is unnamed. This distinguishes soldiers’ bravery from command failure."}, {"text": "Theirs not to reason why", "method": "Repetition and negation", "analysis": "Individual judgement is subordinated to duty. The line can celebrate discipline while exposing the cost of unquestioning obedience."}, {"text": "Honour the Light Brigade", "method": "Imperative ending", "analysis": "The poet directs public memory towards the soldiers’ sacrifice, asking readers to sustain their reputation."}]}, {"title": "Exposure", "author": "Wilfred Owen", "era": "First World War", "themes": ["Conflict", "Nature", "Power"], "meaning": "Soldiers endure cold, uncertainty and exhausting waiting in the trenches. Imagined warmth at home gives way to doubt and death.", "argument": "War destroys through prolonged exposure and abandonment as well as spectacular violence.", "journey": ["Physical cold and mental strain dominate the opening.", "The men imagine warmth and home but remain excluded.", "A burial scene returns to the same bleak refrain."], "form": "Eight five-line stanzas, short final lines, pararhyme and a recurring refrain resist satisfying resolution. “But nothing happens” appears four times, not after every stanza; its final return makes waiting feel inescapable.", "context": "Owen’s experience of the First World War informs a challenge to heroic representations of combat. The men’s sacrifice and threatened faith matter more than disconnected biographical facts.", "nuance": "Nature is a hostile force, but the poem also asks why men have been left to endure it. “Nothing” is bitterly ironic because suffering and death are happening.", "quotes": [{"text": "merciless iced east winds that knive us", "method": "Personification and violent verb", "analysis": "Weather takes the role of an attacker. “Merciless” denies comfort while “knive” makes an invisible force bodily and lethal."}, {"text": "But nothing happens", "method": "Refrain and irony", "analysis": "The repeated absence of military progress contrasts with accumulating damage. The ending withholds rescue or heroic victory."}, {"text": "love of God seems dying", "method": "Spiritual imagery / qualification", "analysis": "Conflict threatens the men’s sense of divine care. “Seems” leaves uncertainty: this is damaged faith, not a simple declaration that God does not exist."}]}, {"title": "Storm on the Island", "author": "Seamus Heaney", "era": "1966", "themes": ["Nature", "Conflict", "Power"], "meaning": "Islanders explain their preparations for storms, then describe a violent assault that leaves them confronting fear of an invisible force.", "argument": "Practical preparation cannot remove human vulnerability or the psychological power of fear.", "journey": ["Collective confidence: the community believes itself prepared.", "Reassuring expectations about trees and sea are overturned.", "The ending recognises fear of an apparently empty force."], "form": "A single 19-line stanza in largely blank verse. Conversational address draws the reader into the community; the confident opening is revised by the uncertain final paradox.", "context": "Published in Death of a Naturalist in 1966. Irish political tensions can inform an optional reading of the military imagery, but the poem predates the late-1960s outbreak usually associated with the Troubles.", "nuance": "The “Stormont” echo is a possible interpretation, not proof of an exclusive political meaning. “Nothing” can refer to invisible air: the danger need not be imaginary.", "quotes": [{"text": "We are prepared", "method": "Declarative opening / collective voice", "analysis": "The confident “we” presents practical solidarity, which the ending will test rather than simply confirm."}, {"text": "spits like a tame cat", "method": "Simile", "analysis": "A familiar creature becomes threatening. The comparison undermines the belief that familiarity means control."}, {"text": "a huge nothing", "method": "Paradox", "analysis": "The physical force cannot be grasped as an object, yet fear is immense. The ending shifts attention from buildings to vulnerable minds."}]}, {"title": "Bayonet Charge", "author": "Ted Hughes", "era": "1957", "themes": ["Conflict", "Power", "Nature"], "meaning": "An unnamed soldier runs into battle, briefly questions what drives him, sees a wounded hare, and continues through terror.", "argument": "Immediate bodily fear strips patriotic ideals of their power to explain or justify violence.", "journey": ["The opening throws us into a charge already underway.", "The soldier momentarily questions his role in larger forces.", "The wounded hare precedes a final rush driven by terror."], "form": "Three irregular stanzas and an opening in medias res create an unsettled experience. The pause for questioning interrupts the charge before urgent movement resumes without moral resolution.", "context": "Hughes was born after the First World War; this is an imagined account, not his eyewitness testimony. It interrogates the distance between patriotic ideals and a combatant’s lived experience.", "nuance": "The hare can expose damage to nature and mirror the soldier’s vulnerability. Make either reading serve the question rather than treating it as a detached animal description.", "quotes": [{"text": "Suddenly", "method": "In medias res", "analysis": "The reader has no reassuring preparation, sharing the soldier’s disorientation and urgency."}, {"text": "cold clockwork", "method": "Mechanical metaphor", "analysis": "The soldier appears a tiny component in impersonal national or cosmic machinery, with little control over his fate."}, {"text": "King, honour, human dignity, etcetera", "method": "List and dismissive ending", "analysis": "Abstract ideals become disposable as survival takes over. “Etcetera” compresses grand justifications into an expendable list."}]}, {"title": "Remains", "author": "Simon Armitage", "era": "2008", "themes": ["Conflict", "Memory", "Identity"], "meaning": "A soldier recalls shooting a looter. Once home, uncertainty and intrusive memories prevent the event from ending for him.", "argument": "War persists as personal guilt when physical danger is over and shared responsibility offers no relief.", "journey": ["Conversational narration makes the shooting seem routine.", "The recurring bloodstain keeps the event present.", "At home, private memory replaces the battlefield; the final couplet isolates guilt."], "form": "A dramatic monologue in seven quatrains followed by a final couplet. The movement from collective action to first-person responsibility and the return of uncertainty make memory a continuing conflict.", "context": "Written from testimony by a veteran for The Not Dead. The conversational voice brings an individual’s traumatic aftermath into public attention.", "nuance": "The looter’s weapon is uncertain. Do not resolve that uncertainty for the speaker; it is central to the guilt. Trauma is an interpretive focus, not a diagnosis of the poet.", "quotes": [{"text": "probably armed, possibly not", "method": "Parallel phrasing and uncertainty", "analysis": "The balancing alternatives prevent the speaker from establishing a secure justification for shooting."}, {"text": "dug in behind enemy lines", "method": "Extended military metaphor", "analysis": "The conflict relocates inside the mind. The memory occupies him like an enemy who cannot be removed."}, {"text": "my bloody hands", "method": "Possessive pronoun / double meaning", "analysis": "“Bloody” is both visceral and an intensifier; “my” leaves the speaker bearing responsibility alone."}]}, {"title": "Poppies", "author": "Jane Weir", "era": "2009", "themes": ["Conflict", "Memory", "Identity"], "meaning": "A mother recalls preparing her son to leave and later visits a war memorial. Memories of his childhood intensify separation and possible grief.", "argument": "Conflict reaches into domestic life, where loving care cannot protect against separation or loss.", "journey": ["Remembrance and clothing connect public sacrifice to private care.", "The son’s departure interrupts familiar gestures of affection.", "The mother seeks connection through a memorial and remembered childhood voice."], "form": "A first-person dramatic monologue addressed to an absent “you”, with irregular stanzas and shifts in time. The unanswered address creates distance; memory joins childhood, departure and later longing.", "context": "Written for a collection responding to conflict, the poem shifts attention to families and remembrance. Weir’s textile imagery makes care and injury share the same domestic language.", "nuance": "The poem does not confirm that the son has died. Grief, anxiety and the ordinary pain of a child leaving can coexist in the interpretation.", "quotes": [{"text": "sellotape bandaged around my hand", "method": "Domestic / military imagery", "analysis": "An ordinary task borrows the language of wounds. The home is symbolically touched by conflict before departure."}, {"text": "released a song bird", "method": "Metaphor", "analysis": "Letting go can be an act of love and an experience of loss. Freedom for the son may create emptiness for the mother."}, {"text": "your playground voice", "method": "Auditory memory at the ending", "analysis": "The adult son is recalled as a child. The mother seeks a past closeness that cannot simply be restored."}]}, {"title": "War Photographer", "author": "Carol Ann Duffy", "era": "1985", "themes": ["Conflict", "Memory", "Power"], "meaning": "A photographer develops images at home, recalling suffering abroad and anticipating readers’ brief emotional responses before returning to work.", "argument": "Bearing witness creates lasting responsibility, while distant audiences can consume suffering and quickly move on.", "journey": ["Order in the darkroom offers a ritual for dealing with horror.", "An emerging image brings back a particular death.", "Editorial selection and casual readership lead to a return journey."], "form": "Four six-line stanzas with a regular rhyme pattern create a controlled frame around disturbing memories. The cyclical return to another assignment contrasts with readers’ temporary attention.", "context": "The poem explores the ethics of war reporting: recording suffering may preserve testimony, yet publication and consumption can reduce lives to selected images.", "nuance": "The photographer’s professional task and emotional distress coexist. The final judgement about indifference is forceful, but the poem invites us to examine our own response.", "quotes": [{"text": "spools of suffering", "method": "Metaphor and sibilance", "analysis": "The material film contains human pain. Orderly equipment cannot make its content morally manageable."}, {"text": "a half-formed ghost", "method": "Metaphor", "analysis": "An image developing becomes a haunting presence: the dead return through memory as well as photographic chemistry."}, {"text": "they do not care", "method": "Final judgement", "analysis": "The stark ending challenges the effectiveness of witnessing when viewers’ concern fails to become sustained attention."}]}, {"title": "Tissue", "author": "Imtiaz Dharker", "era": "2006", "themes": ["Power", "Nature", "Identity"], "meaning": "A meditation moves through paper, family records, maps and receipts towards imagined buildings and human skin.", "argument": "Accepting fragility and openness may offer a more humane kind of power than rigid borders, money or monuments.", "journey": ["Light through paper introduces fragility as a possibility.", "Maps and receipts reveal systems that organise human lives.", "Imagined architecture gives way to living human tissue."], "form": "Nine quatrains followed by a single final line, in free verse. Enjambment carries meaning across boundaries; the isolated ending makes the conceptual movement personal and bodily.", "context": "The poem connects family, faith, borders and commerce. Its context of human systems of authority helps explain why paper can be both fragile and influential.", "nuance": "Paper is not only weak: it preserves family history and carries meaning. Light can suggest openness, insight or spiritual illumination, rather than only destructive nature.", "quotes": [{"text": "Paper that lets the light", "method": "Light symbolism", "analysis": "Paper’s permeability becomes a virtue. The opening invites an alternative to opaque or rigid power."}, {"text": "Maps too", "method": "Shift to political organisation", "analysis": "The poem turns from intimate records to borders. Its movement asks how apparently solid divisions depend on fragile representations."}, {"text": "turned into your skin", "method": "Final isolated line / direct address", "analysis": "The metaphor resolves into a human body. Fragility is shared by the reader, so the argument becomes ethical and personal."}]}, {"title": "The Émigrée", "author": "Carol Rumens", "era": "1993", "themes": ["Memory", "Identity", "Place"], "meaning": "A displaced speaker remembers a childhood city through images of light despite reports of tyranny and barriers to return.", "argument": "Memory can preserve identity against displacement, while its idealising power complicates the relation between love and reality.", "journey": ["Childhood recollection resists dark reports of the city.", "Language sustains belonging despite political separation.", "The personified city accompanies the speaker amid hostility."], "form": "Three stanzas of free verse, with sunlight recurring at their endings. The repeated light creates continuity while the movement towards accusations complicates any easy triumph.", "context": "The unnamed homeland broadens the poem’s exploration of exile and displacement. It need not be identified with one historical country or with Rumens’s own biography.", "nuance": "The memory can be resilient and selective at once. The final light is empowering, yet language of accusation means the ending is not uncomplicated happiness.", "quotes": [{"text": "sunlight-clear", "method": "Light imagery", "analysis": "The remembered city appears vivid and hopeful; this emotional clarity does not necessarily guarantee factual completeness."}, {"text": "branded by an impression of sunlight", "method": "Metaphor", "analysis": "The positive memory is also an inescapable mark. Belonging is enduring, even when return is impossible."}, {"text": "my shadow falls as evidence of sunlight", "method": "Paradox / ending", "analysis": "Even darkness testifies to light. The speaker transforms apparent negative evidence into proof of an enduring attachment."}]}, {"title": "Checking Out Me History", "author": "John Agard", "era": "2007", "themes": ["Identity", "Power", "Memory"], "meaning": "A speaker challenges a selective colonial education and celebrates neglected Black historical figures before claiming the power to shape his identity.", "argument": "Controlling historical knowledge constrains identity; recovering excluded voices becomes an act of self-authorship.", "journey": ["Repeated imposed lessons expose a narrow curriculum.", "Lyrical celebrations give excluded figures imaginative prominence.", "The ending shifts to the speaker’s active creation of identity."], "form": "Creole voice, variable line lengths and contrasting verse passages challenge a single authorised way of speaking. The shift from repeated “Dem tell me” to an active “I” dramatises resistance.", "context": "Agard’s Guyanese background and the legacy of colonial education illuminate the challenge to Eurocentric history. His voice is a deliberate assertion of cultural authority, not deficient English.", "nuance": "The poem critiques selective teaching, not all European history or all education. Recovered histories become resources for an identity still being made.", "quotes": [{"text": "Dem tell me", "method": "Refrain and pronouns", "analysis": "An unnamed authority controls the narrative. Repetition makes imposed knowledge feel persistent and one-sided."}, {"text": "Blind me to me own identity", "method": "Metaphor of sight", "analysis": "Withholding history obstructs self-understanding; education that claims to enlighten can instead prevent recognition."}, {"text": "I carving out me identity", "method": "Active metaphor / ending", "analysis": "Identity is made through effort and creativity. The speaker takes over the power to define himself."}]}, {"title": "Kamikaze", "author": "Beatrice Garland", "era": "2013", "themes": ["Conflict", "Identity", "Nature", "Memory"], "meaning": "A daughter recounts how her father returned from a suicide mission and was shunned. She imagines the natural beauty and childhood memories that may have changed his course.", "argument": "Patriotic expectations can make choosing life socially destructive, turning survival into another form of loss.", "journey": ["The departure frames death as an expected national duty.", "An imagined vision of sea life and childhood interrupts the mission.", "Return leads to silence and a question about competing kinds of death."], "form": "Seven six-line stanzas, with shifting reported voices. The pilot is never directly heard; speculative narration and the final unresolved question emphasise the limits of access to his thoughts.", "context": "Japanese kamikaze missions in the Second World War demanded self-sacrifice. The poem questions the pressure of militarised honour through a particular imagined family, not a claim about every Japanese person.", "nuance": "The daughter’s account reconstructs his possible motives. The poem does not establish later reconciliation or prove that the ending is joyful.", "quotes": [{"text": "powerful incantations", "method": "Ritual metaphor", "analysis": "The mission is supported by language that resembles a spell, suggesting the force of learned beliefs and patriotic persuasion."}, {"text": "green-blue translucent sea", "method": "Sensory imagery", "analysis": "The vivid living world offers a rival source of value to a mission organised around death."}, {"text": "which had been the better way to die", "method": "Final question / metaphorical death", "analysis": "Physical survival is weighed against social exclusion. The unresolved comparison exposes the cruelty of defining honour through death."}]}], "devices": [["Metaphor", "Describes one thing as another to reshape how we understand it.", "London: mental manacles turn accepted ideas into instruments of imprisonment.", "Identify what is compared, then explain the transfer of meaning."], ["Simile", "An explicit comparison, often using “like” or “as”.", "Storm on the Island: a tame cat becoming hostile makes familiar nature unpredictable.", "Explain the precise shared quality; a simile does not automatically make a poem vivid."], ["Personification", "Gives non-human things human qualities or actions.", "Exposure: wind becomes an attacker, moving violence beyond enemy soldiers.", "Ask what role nature takes: enemy, companion, teacher or witness?"], ["Semantic field", "A group of words connected by a topic or idea.", "Poppies: language of wounds enters clothing and domestic care.", "Use more than one connected example and explain what worlds are being brought together."], ["Enjambment", "A sentence or phrase continues beyond the line ending.", "Tissue: sentences move across stanza boundaries as the poem questions rigid divisions.", "Inspect the actual line break. It can delay, connect or destabilise; it does not always speed reading up."], ["Caesura", "A pause within a line, often marked by punctuation.", "Ozymandias: the stop after the claim that nothing remains cuts down the ruler’s boast.", "Locate the pause and explain which thought it interrupts or isolates."], ["Refrain / repetition", "A refrain is a recurring phrase or line; repetition is the broader device.", "Exposure: the returning statement of inactivity denies progress despite mounting damage.", "Compare what the repeated words mean at different points in the poem."], ["Anaphora", "Repetition at the start of successive clauses or lines.", "London: repeated “In every” makes suffering seem pervasive.", "Explain the accumulating idea, not simply that repetition creates emphasis."], ["Dramatic monologue", "A constructed speaker addresses a listener whose reply is absent.", "My Last Duchess: the Duke’s control of the conversation exposes his controlling values.", "Separate poet from speaker; consider what the speaker accidentally reveals."], ["Volta / structural turn", "A shift in argument, tone or perspective.", "The Prelude: confidence becomes fear when the mountain appears.", "Name the before and after, then explain why that change matters."], ["Irony", "A gap between a claim or expectation and the reality presented.", "Ozymandias: a boast of supremacy is surrounded by evidence of collapse.", "Explain both sides of the gap. Do not label every contrast ironic."], ["Oxymoron / paradox", "An oxymoron combines conflicting terms; a paradox presents an apparent contradiction that may reveal a truth.", "London fuses marriage and a hearse; Storm on the Island makes nothing huge.", "Explore the tension rather than trying to eliminate it."], ["Sound pattern", "Alliteration repeats initial consonant sounds; sibilance repeats sibilant sounds such as s or sh.", "Ozymandias: the repeated hard consonants in the ruler’s command can sharpen its severity.", "Sound has no fixed meaning. Connect it to the words, mood and argument in this passage."], ["Metre / rhyme", "Metre patterns stresses; rhyme repeats sounds. Blank verse is unrhymed iambic pentameter.", "Charge: insistent dactylic movement can evoke the cavalry’s forward motion and collective discipline.", "Demonstrate a pattern and explain its function. Avoid assuming every irregularity means chaos."], ["Pararhyme", "A form of half-rhyme in which consonants match but vowel sounds differ.", "Exposure: expected sound resolution is withheld, complementing unresolved waiting.", "Use a verified pair from the poem; the interpretation must be supported by the larger pattern."], ["Symbol / motif", "A symbol carries wider meaning; a motif is a recurring image or idea.", "The Émigrée: repeated light preserves attachment to the remembered homeland.", "Follow changes in the image. Light does not have the same meaning in every poem."]], "pairs": [[5, 7, "Conflict", "Both expose the distance between patriotic ideals and bodily experience; Owen stresses prolonged waiting, while Hughes compresses terror into an urgent charge.", "Body under attack|Ideals lose authority|Time traps the soldier", "Contrast the recurring refrain with the interrupted then resumed charge."], [0, 3, "Power", "Both expose the arrogance of possessive rulers; Shelley places domination in the past, while Browning lets a living ruler reveal its continuing threat.", "People treated as possessions|Art preserves and exposes authority|Different endings test the reach of power", "The desert defeats a boast; the final artwork reinforces the Duke’s values."], [1, 13, "Power", "Both challenge authority over the mind; Blake presents pervasive imprisonment, whereas Agard moves towards active self-definition.", "Power controls perception|Voice exposes exclusion|Bleak closure versus creative resistance", "Compare the final marriage image with the speaker’s active carving."], [2, 6, "Nature", "Both show human confidence giving way before nature; Wordsworth follows lasting individual transformation, while Heaney examines shared vulnerability.", "Confidence at the opening|Nature becomes an adversary|Fear outlasts practical control", "Track confident openings into psychologically unsettled endings."], [8, 10, "Memory", "Both show images of war intruding on civilian life; Armitage foregrounds guilt after participation, while Duffy explores the burden and limits of witnessing.", "Home cannot contain war|Images make the past present|Private guilt versus public indifference", "Compare the isolated final couplet with the photographer’s cyclical return to work."], [9, 14, "Conflict", "Both reveal conflict’s damage to family relationships; Weir presents a mother’s longing for connection, while Garland shows a family learning to withhold it.", "Love shaped by public duty|Memory preserves intimacy|Absence versus enforced silence", "Compare an unanswered address with a pilot whose voice is never directly heard."], [12, 13, "Identity", "Both make identity resistant to external control; Rumens protects a remembered home, while Agard actively reconstructs a suppressed history.", "Authority threatens belonging|Language sustains selfhood|Memory preserved versus history recovered", "Compare recurring sunlight with the shift from imposed lessons to an active I."], [0, 11, "Power", "Both question the permanence of human structures; Shelley exposes the ruins of rigid authority, while Dharker imagines an alternative based on human fragility.", "Monuments claim permanence|Nature challenges imposed boundaries|Destruction versus constructive openness", "An empty landscape ends Shelley’s poem; living skin ends Dharker’s."], [4, 7, "Conflict", "Both present soldiers subject to forces beyond their control; Tennyson sustains public honour, while Hughes shows patriotic abstractions losing force in combat.", "Orders and collective power|Body under threat|Different values at the ending", "Public imperatives to honour contrast with survival driven by terror."], [5, 6, "Nature", "Both turn weather into an aggressor; Owen presents soldiers worn down by exposure, while Heaney shows a prepared community discovering the limits of its security.", "Collective vulnerability|Military imagery for nature|No final mastery", "Compare the unchanging refrain with the final paradox of invisible force."], [12, 9, "Memory", "Both show memory sustaining an absent relationship; Rumens’s speaker preserves an idealised city, while Weir’s mother returns to childhood intimacy.", "Separation alters identity|Sensory memory restores presence|Endings keep longing unresolved", "Consider how repeated light and a remembered voice resist complete separation."], [14, 4, "Identity", "Both explore national duty, but Tennyson calls for honour towards obedient soldiers while Garland questions a community that denies honour to a survivor.", "National ideals define courage|Individual lives and collective expectations|Remembrance or erasure", "A public command to remember contrasts with a family’s learned silence."]]};
const MODELS=[{"title": "The cost of conflict", "question": "Compare how poets present the effects of conflict in Bayonet Charge and in one other poem from Power and Conflict.", "pair": [7, 5], "paras": ["In Bayonet Charge and Exposure, conflict destroys the comforting idea that war gives individual suffering a clear purpose. Hughes places an unnamed soldier inside an urgent charge, while Owen presents a collective voice trapped in prolonged waiting. Despite this contrast in pace, both poems reveal men whose bodies and beliefs are subject to forces they cannot control. The enemy is therefore not simply an opposing army: it is also the system of values that sends men into conditions where patriotic explanations cease to be adequate.", "Hughes makes this loss of control immediate through the opening “Suddenly”. The reader receives no settled account of why the soldier is fighting before being thrown into his movement. This narrative choice places physical experience before explanation: survival becomes urgent before purpose can be considered. Owen similarly begins with suffering, but the personified winds that “knive us” shift the attack from a human enemy to the weather. The violent verb makes cold penetrate the body like a weapon, while the collective pronoun expands the pain beyond one exceptional victim. Read together, the openings challenge the expectation that war consists chiefly of purposeful encounters with a visible opponent.", "The poems also expose the inadequacy of the ideals that might justify this suffering. In Hughes’s “cold clockwork”, the soldier seems a small part of an impersonal mechanism. “Cold” suggests an absence of care, while the mechanism implies a larger order that operates without consulting the individual caught inside it. His questioning interrupts the charge, briefly making thought compete with compelled movement. Later, “King, honour, human dignity, etcetera” reduces elevated values to a list that can be discarded. The casual “etcetera” is particularly corrosive: ideas that might have justified the charge lose their distinctions when the body faces death. Hughes does not need to explain a specific recruitment campaign to expose the distance between patriotic language and terror.", "Owen’s men also find their beliefs threatened, although the uncertainty concerns divine care as well as national purpose. The statement that the “love of God seems dying” makes spiritual security vulnerable to the same world that attacks their bodies. Yet “seems” matters: it leaves the soldiers suspended in doubt rather than presenting a confidently settled rejection of religion. Their imagined warmth at home further complicates the sacrifice. They can understand what they are protecting while feeling excluded from its comfort. Owen’s trench setting thus makes the relation between sacrifice and belonging painfully unstable; meaningful context emerges through the men’s experience rather than a detached account of the poet’s life.", "The different structures finally make entrapment visible in different forms. Hughes interrupts the charge with reflection and the wounded hare, whose vulnerable body offers a disturbing counterpart to the soldier. Movement resumes, but it brings no restored confidence in honour. Exposure repeatedly returns to “But nothing happens”, including at its close. The refrain is bitterly ironic because bodily damage and death are occurring even when no decisive military event takes place. Whereas Hughes denies the soldier time to think securely, Owen gives his men time that produces neither progress nor escape. Both poems therefore displace the heroic narrative of battle with an experience in which human suffering continues after its supposed explanations have failed."], "notes": ["AO1: establishes one comparative argument and a meaningful difference, rather than listing themes.", "AO2: analyses the function of the openings, individual words and pronouns; comparison follows an idea.", "AO2 + AO3: connects metaphor and the dismissive list to the ideology that conflict puts under pressure.", "Exploration: uses the qualifying word “seems” to avoid an absolute claim and makes context part of the reading.", "Structure and judgement: explains what changes and what fails to change, then answers the question through both poems."]}, {"title": "Authority and its limits", "question": "Compare how poets present the power of individuals in Ozymandias and in one other poem from Power and Conflict.", "pair": [0, 3], "paras": ["Shelley and Browning present powerful individuals whose desire to control other people exposes their moral limitations. Ozymandias imagines a ruler whose empire has disappeared, while My Last Duchess allows a Duke to display authority that still operates in the present. Both poems use art to reveal the arrogance of power, but their endings produce different judgements: Shelley makes domination look temporary, whereas Browning leaves the reader facing its capacity to repeat itself.", "Ozymandias’s “sneer of cold command” defines authority through contempt. The ruler is remembered less for an achievement than for an expression that makes other people seem beneath him. “Cold” suggests that command excludes sympathy, while the sculptor’s ability to preserve the expression means that the ruler does not entirely control his own representation. The statue intended to celebrate greatness instead supplies evidence of cruelty. Browning creates a comparable gap between intention and revelation through the Duke’s dramatic monologue. As he explains his displeasure with the Duchess, his apparently cultivated speech reveals that he interprets her independent pleasure as an offence against his status. In both poems, the powerful person exposes a failure of self-knowledge.", "This failure is closely connected to possession. The Duke’s opening “my last Duchess” presents the woman through her relation to him, while the portrait enables him to regulate who sees her image. Her painted presence can be controlled in a way that her living responses could not. His compressed statement “I gave commands” is therefore chilling: it displays the capacity to act while withholding the nature of the action. The reader can suspect lethal coercion without treating the poem as a detailed confession of murder. Ozymandias similarly attempts to turn representation into obedience through the title “King of Kings”. The claim places other rulers below him, but the surrounding ruins make that hierarchy impossible to sustain. Both men try to make language confirm ownership of a world that exceeds them.", "The forms of the poems further complicate these claims to mastery. Shelley gives the ruler no direct encounter with the reader: the inscription reaches us through a traveller’s account reported by another speaker. That distance reduces a commanding voice to a surviving fragment within other people’s stories. Browning, by contrast, lets the Duke dominate the speaking space. The rhyming couplets suggest a controlled verbal surface, yet pauses and enjambment allow resentment to emerge through it. These methods do not simply prove that either ruler lacks all power. They show the difference between controlling a representation and controlling the judgement an audience will make of it.", "The endings distinguish the poets’ warnings. Shelley’s abrupt “Nothing beside remains” answers the boast with absence; the desert makes political supremacy look small beside time and nature. This fits a critique of tyranny in which a ruler’s claim to permanence is exposed as self-deception. Browning returns to the Duke’s collection through Neptune, an image of a god exercising mastery. Set beside negotiations for another marriage, the artwork suggests that his possessive outlook persists. Aristocratic status and the marriage transaction give that outlook practical force. Shelley therefore shows that power cannot secure an everlasting legacy, while Browning shows why its eventual limits offer little protection to those who must live under it now."], "notes": ["AO1: develops a controlling comparison with a difference in the poets’ final judgements.", "AO2: explains how representation reveals more than the ruler intends; poet and speaker remain distinct.", "Precision: analyses possession and ambiguity without presenting an implication as an established fact.", "Form: connects narrative distance and dramatic monologue to control over audience judgement.", "AO3 + synthesis: social context explains the Duke’s power; the ending sharpens rather than repeats the thesis."]}, {"title": "Nature changes the mind", "question": "Compare how poets present the power of nature in Extract from The Prelude and in one other poem from Power and Conflict.", "pair": [2, 6], "paras": ["Wordsworth and Heaney present nature as a force that unsettles human confidence. In the Prelude extract, one remembered encounter reshapes a boy’s imagination; in Storm on the Island, a community’s preparation cannot prevent fear. Neither poem makes power simply a matter of physical destruction. Instead, nature is powerful because it forces people to recognise the limits of their knowledge and control.", "Both openings establish confidence that will later be tested, although Wordsworth introduces unease earlier. His “troubled pleasure” joins delight to a sense of wrongdoing as the boy takes the boat. Nature’s later threat therefore enters a mind already capable of guilt: the mountain need not literally pursue him for the fear to be real. Heaney’s “We are prepared” initially seems less conflicted. The collective pronoun implies shared knowledge, and the declarative statement invites trust in practical experience. Yet the poem’s later movement makes this assurance provisional. Human beings can build against a storm without having mastered the fear that it produces.", "Personification and comparison then transform the familiar world into something resistant to human expectations. Wordsworth’s “a huge peak, black and huge” makes the mountain dominate both vision and language. Repetition seems to exhaust the boy’s available description: instead of analysing the sight calmly, he returns to its overwhelming scale. The mountain’s apparent animation can be read through the Romantic sublime, in which awe and terror expose the smallness of the perceiving self. Heaney’s simile of spray that “spits like a tame cat” also revises an expectation, but through something domestic. What appeared familiar and manageable becomes hostile. The comparison makes vulnerability accessible without requiring the reader to experience a vast mountain landscape.", "The poets give this disturbance different formal settings. Wordsworth’s retrospective first-person narrative allows the adult voice to examine how the event changed the boy. Its movement from purposeful rowing to retreat and then reflection makes the aftermath part of the encounter’s significance. Heaney’s conversational address and single continuous stanza keep the reader within the islanders’ account as reassurance gives way to military descriptions of the storm. That language turns weather into an assault, connecting practical shelter with the experience of being besieged. A political reading is possible, particularly in an Irish context, but the poem’s literal storm already supports its argument about vulnerability; an allegory is not required to make the methods meaningful.", "The endings show that nature’s power reaches beyond the immediate event. Wordsworth’s “Trouble to my dreams” places the encounter inside the imagination, where it continues after the boat is returned. This need not mean that nature is merely cruel: an unsettling experience may also challenge a narrow confidence in the self. Heaney’s “a huge nothing” similarly makes fear larger than the object that can be seen. The paradox does not make the storm harmless; invisible air has real effects, while its elusiveness prevents easy mastery. Both poets therefore end by changing the terms of power. Nature matters not only because it can overcome a body or a building, but because it reveals how incomplete human assurance was from the beginning."], "notes": ["Concept: identifies psychological power as the thread for the whole essay.", "Close reading: compares the openings while noticing a difference in when uncertainty begins.", "AO2 + AO3: connects imagery to the sublime without turning context into a biographical paragraph.", "Form and caution: gives a literal reading sufficient attention and treats political allegory as optional.", "Exploration: develops possible education through fear and explains the final paradox precisely."]}, {"title": "Who gets to define identity?", "question": "Compare how poets present challenges to people’s identity in Checking Out Me History and in one other poem from Power and Conflict.", "pair": [13, 12], "paras": ["Agard and Rumens present identity as something threatened by external authority but sustained through imaginative language. In Checking Out Me History, the speaker challenges a history that has excluded important sources of self-knowledge. In The Émigrée, a displaced speaker protects attachment to a remembered city despite hostile accounts and barriers to return. Agard emphasises the active recovery of knowledge, whereas Rumens explores the more uncertain power of an idealised memory.", "Agard establishes the imbalance of authority through the refrain “Dem tell me”. The repeated pronouns separate the speaker from those who decide what counts as knowledge, making education appear one-sided. Repetition reproduces the pressure of being told the same authorised story, yet the speaker’s performance also subjects that story to scrutiny. Rumens’s speaker faces a different distance: reports of conflict and tyranny threaten the childhood city she carries within her. Political change may control access to a place, but it does not automatically determine the emotional meaning that place retains. In each poem, the speaker resists the assumption that an external account has complete authority over personal identity.", "The poems develop this struggle through imagery of perception. Agard’s “Blind me to me own identity” makes exclusion an injury to self-understanding. Education, which might be expected to illuminate, instead prevents sight. The poem answers this damage by giving recovered historical figures distinctive imaginative space and energy. Rumens’s “sunlight-clear” memory similarly associates identity with illumination, but the implication is less straightforward. The clarity describes the strength of a remembered impression, not necessarily the accuracy of a full historical record. Her attachment can therefore be both sustaining and selective. Comparing the images reveals that seeing oneself clearly may require recovering suppressed knowledge or defending an emotional truth that cannot be verified in the same way.", "Voice gives resistance a practical form. Agard’s Creole language asserts the validity of a cultural voice that a narrow educational authority might marginalise. The contrasting passages prevent imposed lessons from occupying the whole poem; form itself makes room for alternative histories. This connects the poem’s argument to the legacy of colonial education without reducing the speaker to a passive victim of that legacy. Rumens instead uses a first-person voice and the recurring motif of sunlight to maintain continuity across displacement. The unnamed city allows the account to speak beyond one country, while its personification makes belonging feel like a relationship that can cross a border even when the speaker cannot.", "The endings test how secure this resistance becomes. Agard’s “I carving out me identity” changes the grammatical centre from an imposing “Dem” to an active “I”. Carving suggests effort and creation: identity is not simply handed back intact but made through the speaker’s work. Rumens’s claim that “my shadow falls as evidence of sunlight” also converts apparent vulnerability into strength. A shadow, usually associated with darkness, becomes proof of light. Yet the language of evidence appears amid accusations, so the poem does not erase the pressure surrounding her. Both speakers preserve agency, but Agard closes on an explicit act of self-construction, while Rumens leaves identity sustained through a memory whose beauty and uncertainty remain inseparable."], "notes": ["AO1: names the specific challenge in each poem and establishes a useful difference.", "Comparison: links political and educational control through the question of who has authority.", "Alternative reading: separates emotional clarity from factual certainty and supports the distinction.", "AO2 + AO3: explains how voice and structure enact resistance in their social contexts.", "Ending: tracks pronoun and image changes; the conclusion develops a nuanced comparative judgement."]}];

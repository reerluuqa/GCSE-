function home(){const reviewed=Object.keys(state.review).filter(k=>state.review[k]).length,learned=Object.values(state.cards).filter(x=>x.level>=2).length;return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Big ideas. Close reading. Confident writing.</div><h1>Know the poems.<br><em>Own the argument.</em></h1><p>A focused space to turn what you know into a perceptive, convincing comparison. Built for students aiming for grades 8–9.</p><div class="actions">${btn('Start with the exam method ↗',"go('method')",'lime')}${btn('Review flashcards',"go('cards')",'light')}</div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 370 380" preserveAspectRatio="xMidYMid slice"><defs><pattern id="lines" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern></defs><rect width="370" height="380" fill="url(#lines)"/><circle cx="205" cy="156" r="109" fill="none" stroke="#b5ca92" stroke-width="1"/><circle cx="205" cy="156" r="82" fill="none" stroke="#b5ca92" stroke-opacity=".35"/><path d="M40 260 120 72 190 257Z" fill="#dce8a2"/><path d="M120 72 153 167 123 155 105 199 90 165Z" fill="#f8f6e9"/><path d="M168 261 246 135 337 261Z" fill="#bb6747"/><path d="M62 285H316M80 296H299" stroke="#ffffff" stroke-opacity=".35"/><circle cx="278" cy="75" r="17" fill="#f2dec5"/><path d="M27 184H74M305 184H354M205 30V60" stroke="#e1e8c5" stroke-opacity=".5"/></svg><div class="art-label">HUMAN POWER / THE NATURAL WORLD</div></div></section><div class="grid g4"><div class="card metric"><span class="eyebrow">Poems reviewed</span><div class="number">${reviewed}<span class="muted" style="font-size:20px"> / 15</span></div><div class="progress"><i style="width:${reviewed/15*100}%"></i></div></div><div class="card metric"><span class="eyebrow">Cards retained</span><div class="number">${learned}<span class="muted" style="font-size:20px"> / ${CARDS.length}</span></div><span class="small muted">Self-rated · two successful reviews</span></div><div class="card metric"><span class="eyebrow">Anthology question</span><div class="number">30 <span class="muted" style="font-size:20px">marks</span></div><span class="small muted">AO1 12 · AO2 12 · AO3 6</span></div><div class="card metric"><span class="eyebrow">Suggested practice</span><div class="number">45 <span class="muted" style="font-size:20px">min</span></div><span class="small muted">5 plan · 35 write · 5 review</span></div></div><div class="section-title"><h2>Make the next 20 minutes count.</h2><span class="eyebrow muted">A little, done well</span></div><div class="grid g3">${[['01','Understand one poem','5 min · Read its argument, three quotations and the change from opening to ending.','poems'],['02','Retrieve, then check','5 min · Say the answer before you turn the card. Bring difficult cards back sooner.','cards'],['03','Write one comparison','10 min · Connect a shared idea, a telling difference and the methods behind them.','practice']].map(x=>`<button class="card path-card" onclick="go('${x[3]}')"><span class="arrow">↗</span><span class="icon">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></button>`).join('')}</div><div class="grid g2" style="margin-top:22px"><div class="card"><div class="eyebrow">The high-attainment move</div><h2>Compare the argument,<br>not just the device.</h2><p class="small muted">Instead of “both poets use imagery”, ask what their imagery reveals about power, and where their views diverge.</p>${btn('Explore a worked comparison →',"go('compare')",'text')}</div><div class="card"><div class="eyebrow">Quick diagnostic</div><h2>Can you spot the trap?</h2><p class="small muted">Ten short checks on evidence, interpretation and exam habits. Find the misconceptions before they reach your essay.</p>${btn('Take the knowledge check →',"startQuiz()",'text')}</div></div><div class="callout">Learn all 15 poems well enough to respond to the named poem. Build deeper recall for several versatile comparisons, then select for the <strong>exact question</strong>. No fixed selection of five poems guarantees every useful pairing.</div>`}
function method(){return heading('01 / The exam cheatsheet','A method you can trust.','An adaptable route through the anthology comparison. Let the question lead; use the framework to support your thinking.',btn('Print cheatsheet',"window.print()",'light no-print'))+`<div class="grid g3"><div class="card"><div class="mini-title">AO1 · 12 marks</div><h3>Argue & compare</h3><p class="small">Give an informed answer to the question. Support an unfolding comparison with precise textual references.</p></div><div class="card"><div class="mini-title">AO2 · 12 marks</div><h3>Explain the making</h3><p class="small">Show how language, form and structure create meaning. Use terminology when it makes your explanation more precise.</p></div><div class="card"><div class="mini-title">AO3 · 6 marks</div><h3>Connect ideas & context</h3><p class="small">Explain relevant relationships between a poem and its social, historical or literary contexts.</p></div></div><div class="callout green"><strong>The task:</strong> compare the named poem printed on the paper with one other poem from Power and Conflict. Paper 2 lasts 2 hours 15 minutes and also includes modern texts and unseen poetry. The 45-minute allocation below is a practice recommendation, not a separately timed AQA rule. This app focuses on anthology poetry.</div><div class="split"><section class="card"><div class="eyebrow">A flexible 45-minute route</div><h2>Plan → develop → sharpen</h2>${[['1','Read the exact focus · 1 minute','Underline the subject and the angle: effects of conflict is different from attitudes towards conflict. Re-read the named poem with that angle in mind.'],['2','Choose & plan · 4 minutes','Choose a poem with relevant evidence you know. Write a one-sentence thesis and two or three comparative ideas. Note brief evidence and one whole-poem change.'],['3','State your thesis · about 3 minutes','Answer the question with a shared idea and a significant difference. Avoid generic introductions about poetry, history or human nature.'],['4','Develop the argument · about 29 minutes','Build two or three substantial sections around ideas. Compare poems within a section, or use paired paragraphs with explicit links. Analyse both poems in enough depth; equal word counts are not required.'],['5','Reach a judgement · about 3 minutes','Explain the most revealing difference and why it matters. A concise conclusion can sharpen the argument without repeating the introduction.'],['6','Review · 5 minutes','Check that each section answers the question. Repair inaccurate references, unsupported claims and sentences that name methods without explaining their function.']].map(x=>`<div class="flow-step"><span>${x[0]}</span><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</section><div class="stack"><section class="card"><div class="eyebrow">A sentence to get you started</div><h2>Both… yet… ultimately…</h2><p class="small">Both poets present <strong>[question focus + precise claim]</strong>. Yet while <strong>[poet A’s emphasis]</strong>, <strong>[poet B]</strong> suggests <strong>[telling difference]</strong>. Ultimately, this reveals <strong>[larger judgement]</strong>.</p><div class="callout green">Both poets expose war’s damage to the individual. Yet Hughes compresses fear into an urgent charge, while Owen makes waiting itself destructive. Both challenge the assumption that sacrifice brings purposeful progress.</div></section><section class="card"><div class="eyebrow">Inside a strong section</div><h3>Idea → evidence → method → meaning → comparison</h3><p class="small">Make a claim. Select a short quotation or precise reference. Examine a word, image or structural choice. Explain its significance for the question. Bring in the second poem and show what the difference reveals.</p><p class="small muted">This is a thinking sequence, not a mandatory five-sentence paragraph. Expand where the evidence warrants it.</p></section><section class="card"><div class="eyebrow">One reliable structural question</div><h3>What changes from opening to ending?</h3><p class="small">In <em>Checking Out Me History</em>, imposed lessons give way to active self-definition. In <em>London</em>, suffering extends into a corrupted vision of marriage and the future. Structure helps distinguish resistance from entrapment.</p></section></div></div><div class="section-title"><h2>Turn a secure point into a perceptive one.</h2></div><div class="grid g2"><div class="card"><span class="tag orange">STARTING POINT</span><p>Owen uses personification to show that nature is dangerous.</p><span class="tag dark">DEVELOPED ANALYSIS</span><p class="small">The winds that “knive us” make weather behave like an armed attacker. The violent verb relocates the threat beyond enemy soldiers, exposing a form of wartime suffering that a heroic account of battle might overlook.</p></div><div class="card"><span class="tag orange">BOLTED-ON CONTEXT</span><p>Owen fought in the First World War.</p><span class="tag dark">CONTEXT DOING WORK</span><p class="small">The trench setting makes waiting a source of damage rather than relief. Owen’s portrayal challenges a public ideal of war as decisive action by showing men consumed by conditions in which little military progress occurs.</p></div></div><div class="section-title"><h2>Keep these habits. Lose these traps.</h2></div><div class="tab-scroll card"><table class="table"><thead><tr><th>Instead of</th><th>Do this</th></tr></thead><tbody>${[['A memorised essay forced onto the question','Adapt a prepared bank of ideas to the precise focus.'],['A fixed 900-word target','Develop a convincing argument in the time available; AQA sets no required word count.'],['The rhythm is irregular, so war is chaotic','Identify the particular interruption, what it interrupts and why that matters.'],['The reader feels sad','Explain how a viewpoint is challenged or sympathy is directed.'],['Every possible interpretation','Explore an alternative only if language or structure supports it.'],['Context as a poet’s life story','Use a relevant contextual relationship to explain the poem’s argument.'],['Level 6 means GCSE grade 6','Level 6 is the top band for this question, 26–30 marks. Overall GCSE grades depend on total marks and that series’ boundaries.']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</tbody></table></div>`}
function poemLibrary(){return heading('02 / Know your anthology','Fifteen poems. Bigger ideas.','Learn the meaning, trace the structure, then build an argument. Each guide includes three compact quotation anchors.')+`<div class="toolbar"><input type="search" aria-label="Search poems" placeholder="Search a poem, poet, idea or quotation…" value="${esc(poemSearch)}" oninput="poemSearch=this.value;updatePoemGrid()"><select aria-label="Filter poems by theme" onchange="poemFilter=this.value;updatePoemGrid()"><option value="">Every theme</option>${['Power','Conflict','Nature','Memory','Identity','Place'].map(t=>`<option ${poemFilter===t?'selected':''}>${t}</option>`).join('')}</select></div><div id="poem-count" class="small muted" aria-live="polite" style="margin-bottom:14px"></div><div id="poem-grid" class="grid g3 poem-grid"></div>`}
function updatePoemGrid(){const matches=poems.map((p,i)=>[p,i]).filter(([p])=>(!poemFilter||p.themes.includes(poemFilter))&&JSON.stringify(p).toLowerCase().includes(poemSearch.toLowerCase()));$('poem-count').textContent=`${matches.length} poem${matches.length===1?'':'s'}`;$('poem-grid').innerHTML=matches.length?matches.map(([p,i])=>`<article class="card"><div class="poem-number"><span>${String(i+1).padStart(2,'0')} / ${p.era}</span>${state.review[i]?'✓ Reviewed':''}</div><h3>${p.title}</h3><p>${p.author}</p><div style="margin-bottom:15px">${tags(p)}</div><p>${p.argument}</p><div class="actions">${btn('Open poem ↗',`go('poems/${i}')`,'light small')}</div></article>`).join(''):'<div class="empty">No poems match. Try a broader search or another theme.</div>'}
function poemDetail(i){const p=poems[i];return `<div class="actions no-print" style="margin-bottom:18px">${btn('← All poems',"go('poems')",'text')}${btn(state.review[i]?'✓ Marked reviewed':'Mark as reviewed',`toggleReviewed(${i})`,'light small')}${btn('Practise cards',`openCards(${i})`,'light small')}${btn('Print guide','window.print()','light small')}</div><section class="poem-header"><div class="eyebrow" style="color:var(--lime);margin-bottom:14px">${p.author} / ${p.era}</div><h1>${p.title}</h1><p>${p.argument}</p>${tags(p)}</section><div class="split"><div class="stack"><section class="card"><div class="eyebrow">01 / Meaning</div><h2>The poem in a breath.</h2><p>${p.meaning}</p><ol class="steps">${p.journey.map(x=>`<li>${x}</li>`).join('')}</ol></section><section class="card"><div class="eyebrow">02 / Evidence to remember</div><h2>Small quotations. Deep reading.</h2>${p.quotes.map(q=>`<div class="quote"><blockquote>“${q.text}”</blockquote><span class="tag">${q.method}</span><p style="margin-top:9px">${q.analysis}</p></div>`).join('')}<p class="small muted" style="margin-top:20px">These are short extract anchors, not the full poem. A slash marks a line break where shown.</p></section></div><div class="stack"><section class="card"><div class="eyebrow">03 / Form & structure</div><h3>How the poem makes its point</h3><p class="small">${p.form}</p></section><section class="card"><div class="eyebrow">04 / Context with a purpose</div><p class="small">${p.context}</p></section><section class="card" style="background:#edf0df"><div class="eyebrow">05 / Push the reading</div><p class="small">${p.nuance}</p></section><section class="card"><div class="eyebrow">Useful comparisons</div>${pairs.map((x,n)=>[x,n]).filter(([x])=>x[0]===i||x[1]===i).map(([x,n])=>`<button class="row-link" onclick="openPair(${n})"><span>${poems[x[0]===i?x[1]:x[0]].title}<br><small class="muted">${x[2]}</small></span><span>↗</span></button>`).join('')}</section></div></div><section class="card no-print" style="margin-top:22px"><label for="poem-note">Your own argument or lesson notes</label><textarea id="poem-note" placeholder="What could you argue about this poem? Add a quotation and explain why it matters." oninput="state.notes[${i}]=this.value;save()">${esc(state.notes[i]||'')}</textarea><span class="small muted">Saved in this browser · export a backup in Sources & data.</span></section><div class="actions no-print" style="margin-top:20px">${i>0?btn('← Previous',`go('poems/${i-1}')`,'light'):''}${i<14?btn('Next poem →',`go('poems/${i+1}')`,'light'):''}</div>`}
function toggleReviewed(i){state.review[i]=!state.review[i];save();render()}
function openPair(i){compareIndex=i;compareTheme=pairs[i][2];go('compare')}
const THEME_NOTES={Power:'Who can control a body, a place, a story or a memory? Ask how power is maintained, resisted and limited.',Conflict:'Look beyond the battlefield: conflict can be physical, internal, domestic or ideological. Fit the comparison to the precise wording.',Nature:'Nature may overwhelm, restore, reveal value or reshape perception. Its role differs between poems.',Memory:'Memory can wound, preserve, idealise or empower. Compare what remembering does to the speaker.',Identity:'Ask who defines the self: national duty, inherited status, education, family or the individual’s own voice.',Place:'Places shape belonging, control and exclusion. Contrast a physical setting with a remembered or imagined one.'};
function compare(){const relevant=pairs.map((p,i)=>[p,i]).filter(([p])=>p[2]===compareTheme);if(relevant.length&&!relevant.some(x=>x[1]===compareIndex))compareIndex=relevant[0][1];const c=pairs[compareIndex];return heading('03 / Build the connection','Same theme. Different argument.','Choose a theme for suggested pairings, then use the two poem lenses to construct a comparison of your own.')+`<div class="theme-row">${Object.keys(THEME_NOTES).map(t=>`<button class="chip ${compareTheme===t?'active':''}" onclick="compareTheme='${t}';render()">${t}</button>`).join('')}</div><div class="callout green">${THEME_NOTES[compareTheme]}</div><div class="small muted">Strong starting points: ${poems.filter(p=>p.themes.includes(compareTheme)).map(p=>p.title).join(' · ')}</div>${relevant.length?`<div class="toolbar" style="margin-top:20px"><label for="pair-select">Worked pairing</label><select id="pair-select" onchange="compareIndex=Number(this.value);render()">${relevant.map(([p,i])=>`<option value="${i}" ${compareIndex===i?'selected':''}>${poems[p[0]].title} + ${poems[p[1]].title}</option>`).join('')}</select></div><div class="compare-hero">${c[3]}</div><div class="grid g3">${c[4].split('|').map((x,i)=>`<div class="card"><div class="mini-title">Possible section ${i+1}</div><h3>${x}</h3><p class="small muted">Select evidence from both poems that supports this idea. Make the contrast explicit.</p></div>`).join('')}</div><div class="callout"><strong>Structural connection:</strong> ${c[5]}</div><div class="grid g2">${c.slice(0,2).map(i=>compareLens(i)).join('')}</div>`:`<div class="compare-hero">London and The Émigrée both make place central to identity, but Blake reveals a present city structured by suffering while Rumens preserves a remembered city through light.</div><p>Try three sections: who controls the city; how the speaker perceives it; whether the ending offers belonging or exclusion.</p><div class="grid g2">${compareLens(1)}${compareLens(12)}</div>`}<div class="section-title"><h2>Choose your own two lenses.</h2></div><div class="grid g2"><label>Poem A<select id="custom-a" onchange="updateCustom()">${optPoems(0)}</select></label><label>Poem B<select id="custom-b" onchange="updateCustom()">${optPoems(3)}</select></label></div><div id="custom-lenses" class="grid g2" style="margin-top:20px">${compareLens(0)}${compareLens(3)}</div><div class="callout">A shared theme is a starting point, not a completed comparison. Finish: <strong>Both poets suggest… but the difference is… This matters because…</strong></div>`}
function compareLens(i){const p=poems[i];return `<section class="card compare-col"><span class="eyebrow muted">${p.author}</span><h2 style="font-size:27px;margin-top:9px">${p.title}</h2><p class="small">${p.argument}</p><div class="mini-title">A useful anchor</div><p class="serif" style="font-size:22px">“${p.quotes[1].text}”</p><p class="small muted">${p.quotes[1].analysis}</p><div class="mini-title">The structural move</div><p class="small">${p.journey[0]} → ${p.journey[2]}</p>${btn('Read full guide ↗',`go('poems/${i}')`,'text')}</section>`}
function updateCustom(){const a=Number($('custom-a').value),b=Number($('custom-b').value);$('custom-lenses').innerHTML=a===b?'<div class="empty">Choose two different poems for an exam comparison.</div>':compareLens(a)+compareLens(b)}
const CARDS=poems.flatMap((p,i)=>[{id:`${i}-meaning`,poem:i,kind:'Meaning',q:`What is the central argument of ${p.title}?`,a:p.argument},{id:`${i}-structure`,poem:i,kind:'Structure',q:`How does the structure of ${p.title} develop its meaning?`,a:p.form},{id:`${i}-nuance`,poem:i,kind:'Interpretation',q:`What qualification makes a reading of ${p.title} more precise?`,a:p.nuance},...p.quotes.flatMap((q,j)=>[{id:`${i}-q${j}`,poem:i,kind:'Analysis',q:`In ${p.title}, explain “${q.text}”.`,a:q.method+'. '+q.analysis},{id:`${i}-recall${j}`,poem:i,kind:'Recall quotation',q:`Recall the quotation anchor for ${q.method.toLowerCase()} in ${p.title}.`,a:'“'+q.text+'” — '+q.analysis}])]);
function openCards(i){cardFilter=String(i);cardMode='all';cardQueue=[];go('cards')}
function resetDeck(){const now=Date.now();cardQueue=CARDS.filter(c=>(cardFilter==='all'||c.poem===Number(cardFilter))&&(cardMode!=='due'||!state.cards[c.id]||state.cards[c.id].due<=now));cardIndex=0;flipped=false}
function flash(){if(!cardQueue.length)resetDeck();return heading('04 / Retrieval practice','Remember it. Then use it.','Answer aloud before revealing. Rate your recall honestly: the interval grows when you retrieve successfully.')+`<div class="flash-wrap"><div class="toolbar"><select aria-label="Choose flashcard poem" onchange="cardFilter=this.value;resetDeck();render()"><option value="all">All 15 poems</option>${poems.map((p,i)=>`<option value="${i}" ${cardFilter===String(i)?'selected':''}>${p.title}</option>`).join('')}</select><select aria-label="Flashcard review mode" onchange="cardMode=this.value;resetDeck();render()"><option value="all" ${cardMode==='all'?'selected':''}>All cards</option><option value="due" ${cardMode==='due'?'selected':''}>Due now</option></select>${btn('Shuffle','shuffleCards()','light small')}</div><div id="flash-inner">${flashInner()}</div><div class="callout">Explain the link to a question, not just the quotation. “I know it” means you could retrieve and apply the idea without looking. Keyboard: <span class="kbd">Space</span> reveal · <span class="kbd">1</span> again · <span class="kbd">2</span> hard · <span class="kbd">3</span> got it.</div><p class="small muted">Intervals: Again 1 minute · Hard 1 day · Got it 1, 3, 7, then 14 days. Due dates and progress stay in this browser.</p></div>`}
function flashInner(){if(!cardQueue.length)return '<div class="empty"><h2>You’re up to date.</h2><p>No cards are due in this selection. Switch to All cards to practise ahead.</p></div>';if(cardIndex>=cardQueue.length)return `<div class="empty"><h2>Session complete.</h2><p>You reviewed ${cardQueue.length} cards. Try writing a comparative sentence from memory.</p>${btn('Start another round','resetDeck();render()')}${btn('Use it in writing',"go('practice')",'light')}</div>`;const c=cardQueue[cardIndex];return `<div class="flash-meta"><span>${poems[c.poem].title} · ${c.kind}</span><span>${cardIndex+1} / ${cardQueue.length}</span></div><div class="progress" style="margin-bottom:18px"><i style="width:${cardIndex/cardQueue.length*100}%"></i></div><button class="flash-card ${flipped?'revealed':''}" onclick="flipCard()" aria-label="${flipped?'Hide answer':'Reveal answer'}"><span class="eyebrow muted">${flipped?'The explanation':'Recall before you reveal'}</span><div class="${flipped?'answer':'question'}">${flipped?c.a:c.q}</div><span class="small muted">${flipped?'How well did you retrieve it?':'Tap to reveal the answer ↗'}</span></button><div class="flash-controls">${flipped?btn('1 · Again','rateCard(0)','light')+btn('2 · Hard','rateCard(1)','light')+btn('3 · Got it','rateCard(2)'):btn('Reveal answer','flipCard()')}</div>`}
function flipCard(){if(cardIndex>=cardQueue.length)return;flipped=!flipped;$('flash-inner').innerHTML=flashInner()}
function rateCard(r){if(!flipped||!cardQueue[cardIndex])return;const id=cardQueue[cardIndex].id,old=state.cards[id]||{level:0};const level=r===0?0:r===1?Math.max(0,old.level-1):Math.min(4,old.level+1);state.cards[id]={level,due:Date.now()+(r===0?60000:r===1?86400000:[1,1,3,7,14][level]*86400000)};save();cardIndex++;flipped=false;$('flash-inner').innerHTML=flashInner()}
function shuffleCards(){resetDeck();for(let i=cardQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cardQueue[i],cardQueue[j]]=[cardQueue[j],cardQueue[i]]}render()}
window.addEventListener('keydown',e=>{if(route!=='cards'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.code==='Space'){if(e.target.tagName==='BUTTON')return;e.preventDefault();flipCard()}else if(['1','2','3'].includes(e.key))rateCard(Number(e.key)-1)});
function models(){const m=MODELS[modelIndex];return heading('05 / Learn from the craft','Read like a writer.','Four original, complete practice essays designed to demonstrate top-band qualities. The annotations explain the decisions; these are teaching models, not examiner-awarded marks.')+`<div class="toolbar no-print"><select aria-label="Choose model essay" onchange="modelIndex=Number(this.value);render()">${MODELS.map((x,i)=>`<option value="${i}" ${i===modelIndex?'selected':''}>${x.title}</option>`).join('')}</select>${btn(annotations?'Hide annotations':'Show annotations','annotations=!annotations;render()','light')}${btn('Print essay','window.print()','light')}</div><div class="essay"><div class="essay-title"><div class="eyebrow" style="margin-bottom:13px">Original exam-style prompt · 30 marks</div><h2>${m.title}</h2><p>${m.question}</p></div><div class="small muted" style="margin-bottom:23px">${m.pair.map(i=>poems[i].title).join(' + ')} · ${m.paras.join(' ').split(/\s+/).length} words · word count is descriptive, not a target</div>${m.paras.map((p,i)=>`<section class="essay-block"><p>${p}</p>${annotations?`<div class="annotation"><strong>${i===0?'Thesis':i===m.paras.length-1?'Final development':'Development '+i}</strong> · ${m.notes[i]}</div>`:''}</section>`).join('')}<div class="callout no-print"><strong>Now transfer the skill:</strong> hide the model, change the question focus, and write a new thesis using the same poems. Keep the analytical habit; change the argument.</div></div>`}
const prompts=poems.map((p,i)=>({poem:i,focus:['the power of individuals','the effects of power on people','the power of nature','the desire for control','attitudes towards duty','the effects of conflict','the power of nature','the effects of conflict','the lasting effects of conflict','the effects of conflict on families','responses to suffering','ideas about human power','the importance of memory','challenges to identity','the effects of conflict on individuals'][i]}));
function questionText(i){const q=prompts[i];return `Compare how poets present ${q.focus} in ${poems[q.poem].title} and in one other poem from Power and Conflict.`}
let seconds=45*60,timerEnd=0,timerRunning=false,timerID=null;
function practice(){const i=state.question;return heading('06 / Deliberate practice','The writing room.','Choose a prompt, plan an argument and write. Your work is saved locally as you type; export it whenever you need.')+`<div class="split"><div class="stack"><div class="card"><div class="eyebrow">Original exam-style question</div><label for="prompt-select">Named poem<select id="prompt-select" onchange="state.question=Number(this.value);if(state.partner===state.question)state.partner=(state.question+1)%15;save();render()">${optPoems(i)}</select></label><p style="font:24px/1.45 Georgia;margin:20px 0">${questionText(i)}</p><label>Compare with<select onchange="state.partner=Number(this.value);save()">${poems.map((p,j)=>j!==i?`<option value="${j}" ${state.partner===j?'selected':''}>${p.title}</option>`:'').join('')}</select></label><details style="margin-top:18px"><summary>Practice setup: where is the printed poem?</summary><div class="detail">In the real exam, the named poem is printed. For a realistic timed attempt, put your anthology copy of the named poem beside you and keep the comparison poem closed. This app contains quotation extracts and guides, not full copyrighted poem texts. ${btn('Open named poem guide',`go('poems/${i}')`,'text')}</div></details></div><div class="card"><div class="eyebrow">Five-minute plan</div>${['Your thesis: shared idea + revealing difference','Section 1: comparative claim + evidence','Section 2: comparative claim + evidence','Section 3 or final judgement: structure + significance'].map((x,j)=>`<label style="margin-top:16px">${x}<textarea style="min-height:85px" oninput="state.plan[${j}]=this.value;save()">${esc(state.plan[j]||'')}</textarea></label>`).join('')}</div><div class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">Make your case.</h2><span class="small muted" id="wordcount">${wordCount(state.draft)} words</span></div><label for="draft" class="small muted" style="margin-top:15px">Essay draft · this workspace keeps one active draft</label><textarea id="draft" style="min-height:470px" placeholder="Both poets present…" oninput="state.draft=this.value;save();$('wordcount').textContent=wordCount(this.value)+' words'">${esc(state.draft)}</textarea><div class="actions" style="margin-top:12px">${btn('Export writing','exportWriting()','light')}${btn('Clear workspace','clearWriting()','text')}</div><p class="small muted" style="margin-top:10px">Changing the prompt keeps your existing draft. Export before starting a new attempt.</p></div></div><div class="stack"><section class="timebox"><div class="eyebrow">Focus timer</div><div class="clock" id="clock" role="timer">45:00</div><p class="small" id="timer-phase">5 min plan · 35 min write · 5 min review</p><div class="actions">${btn(timerRunning?'Pause':'Start','toggleTimer()','lime')}${btn('Reset','resetTimer()','light')}</div><div class="actions" style="margin-top:15px">${btn('10 min paragraph','setTimer(10)','light small')}${btn('45 min essay','setTimer(45)','light small')}</div></section><section class="card"><div class="eyebrow">Self-review · no automatic grading</div><h3>Read it as an examiner.</h3><ul class="checklist">${['My thesis answers the exact question.','I develop a meaningful comparison, including differences.','Both poems receive detailed analysis.','I use precise quotations or references.','I explain how methods create meaning.','I discuss a significant whole-poem change or pattern.','Context helps explain my argument.','My alternative reading is supported by evidence.','I distinguish poet, speaker and character.','My final judgement develops the argument.'].map((x,j)=>`<li><label><input type="checkbox" ${state.checks[j]?'checked':''} onchange="state.checks[${j}]=this.checked;save()"><span>${x}</span></label></li>`).join('')}</ul></section><section class="card"><div class="eyebrow">If you get stuck</div><p class="small">Ask: who has power here? What changes? What remains unresolved? Which word makes that visible? How does the other poet make a different choice?</p><p class="small muted">After reviewing, rewrite your weakest three sentences. A sharper paragraph is more useful than a guessed grade.</p></section></div></div>`}

let timerTotal=45*60;
function updateClock(){if(!$('clock'))return;$('clock').textContent=Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0');$('timer-phase').textContent=seconds===0?'Time complete — review your argument.':timerTotal===2700?(seconds>2400?'Plan your argument':seconds>300?'Develop your comparison':'Review and sharpen'):'One focused comparative paragraph'}
function tick(){seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));updateClock();if(seconds===0){clearInterval(timerID);timerRunning=false;notify('Time complete. Read back your argument.');if(route==='practice')render()}}
function toggleTimer(){if(timerRunning){tick();clearInterval(timerID);timerRunning=false}else{if(seconds<=0)seconds=timerTotal;timerEnd=Date.now()+seconds*1000;timerRunning=true;timerID=setInterval(tick,250)}render()}
function setTimer(m){clearInterval(timerID);timerRunning=false;timerTotal=m*60;seconds=timerTotal;if(route==='practice')render()}

function download(name,text,type='text/plain'){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportWriting(){download('fieldnotes-essay.txt',questionText(state.question)+'\nComparison poem: '+poems[state.partner].title+'\n\nPLAN\n'+state.plan.join('\n\n')+'\n\nESSAY\n'+state.draft);notify('Writing exported.')}

function toolkit(){return heading('07 / Methods with meaning','Name less. Explain more.','A device earns its place when you can explain what it does in this particular poem. Start with meaning; use the term to make it precise.')+`<div class="callout green"><strong>The analysis test:</strong> “The poet uses [method] in [precise reference] to present [specific idea]. This develops the argument about [question focus] because…” If the final explanation could fit any poem, make it more precise.</div><div class="grid g2 device-grid">${devices.map((d,i)=>`<section class="card"><div class="mini-title">${String(i+1).padStart(2,'0')}</div><h2 style="font-size:27px">${d[0]}</h2><p>${d[1]}</p><p class="example">${d[2]}</p><p class="small muted"><strong>Use it well:</strong> ${d[3]}</p></section>`).join('')}</div>`}

let qi=0,qs=0,qa=null;

function sources(){return heading('08 / Sources & data','Built to be used.','One self-contained HTML file. All study content and interactions work offline; the reference links below open online.')+`<div class="grid g2"><section class="card"><div class="eyebrow">Your work</div><h2>Keep a copy.</h2><p class="small">Notes, review status, flashcard schedules, quiz best score and the writing workspace are stored in this browser. Moving the HTML file or using another browser may create a separate storage area. The timer is session-only.</p><p class="small">Storage status: <strong>${storageOK?'available in this session':'unavailable — export before closing'}</strong></p><div class="actions">${btn('Export backup','exportBackup()')}${btn('Import backup',"$('backup-file').click()",'light')}</div><input class="hidden" id="backup-file" type="file" accept="application/json,.json" onchange="importBackup(this.files[0])"><p class="small muted" style="margin-top:15px">Import replaces the app’s existing progress with the selected backup.</p>${btn('Reset all progress','resetAll()','text')}</section><section class="card"><div class="eyebrow">How to study</div><h2>Recall → apply → return</h2><ol class="steps"><li>Learn every poem’s central argument and structural journey.</li><li>Practise quotation anchors without looking, then check your explanation.</li><li>Write a thesis and one comparative paragraph for a new focus.</li><li>Review the weakest part, then revisit the same material after a delay.</li></ol></section></div><section class="card" style="margin-top:22px"><div class="eyebrow">Assessment references · checked 6 October 2026</div><h2>AQA’s requirements.</h2><ul class="source-list"><li><a href="https://www.aqa.org.uk/subjects/english/gcse/english-8702/specification/specification-at-a-glance" target="_blank" rel="noopener">AQA GCSE English Literature 8702 — specification at a glance</a>: paper duration, sections and anthology comparison format.</li><li><a href="https://media.aqa.org.uk/resources/english/AQA-87022-SMS.PDF" target="_blank" rel="noopener">AQA Paper 2 specimen mark scheme — Section B, printed pages 36–38</a>: assessment objectives, mark allocation and performance bands.</li></ul><p class="small">The app’s original practice prompts are not past-paper questions. The teaching essays have not been marked by AQA. A top response band is not the same thing as an overall GCSE grade. There is no required paragraph formula or essay word count.</p></section><section class="card" style="margin-top:22px"><div class="eyebrow">Your supplied revision collection</div><h2>Five sources, carefully adapted.</h2><ul class="source-list"><li>Grade 9 Student Essay Power and Conflict (Mr Salles) ft. Bayonet Charge and Exposure — using a thesis, linking methods to meaning and discarding irrelevant context.</li><li>How to Structure Your ‘Power and Conflict’ Poetry Analysis — organising by ideas rather than mechanically following poem order.</li><li>The ONLY 5 Poems You Need to Revise (Power & Conflict GCSE) — compact recall anchors and flexible thematic connections, expanded here to coverage of all 15 poems.</li><li>3 Key Points on All 15 ‘Power and Conflict’ Poems! — meanings, methods and comparative possibilities.</li><li>Power and Conflict Poetry: Animated Summary of All 15 Poems — narrative and speaker overviews.</li></ul><p class="small">These were supplied as automatically transcribed text. This app synthesises the teaching approaches rather than reproducing the transcripts or the student essay. Original spellings, speculative readings and factual claims were reviewed before inclusion.</p></section><div class="section-title"><h2>Editorial choices that matter.</h2></div>${[['Coverage, not prediction','All 15 poems receive a guide. Deep preparation of a smaller group is useful, but no fixed five-poem selection is presented as a guarantee for every question.'],['Structure, not decorative terminology','Form and structure matter to AO2. The app focuses on specific functions: the order of ideas, changes in voice, repeated endings and patterns of control. It does not teach students to ignore form.'],['Ambiguity, not invented certainty','Poppies does not confirm a death; the Duke’s commands are suggestive rather than a detailed confession; the Kamikaze pilot’s thoughts are reconstructed. The claimed later reconciliation in one transcript is not established by the poem.'],['Nature and political interpretation','Storm on the Island can support a political reading, but that reading is optional. Its 1966 publication predates the late-1960s outbreak commonly used to date the Troubles, so it is not treated as a direct report of later events.'],['Accurate pattern and cautious context','Exposure has eight five-line stanzas; its best-known refrain occurs four times. Biographical details are used only where reliable and relevant. Speakers’ beliefs are not automatically attributed to poets.'],['Quotation extracts, not full texts','The poem guides contain compact study extracts and original analysis. For line-by-line reading and realistic timed practice, use your school anthology. The app’s teaching content can be read offline; external reference pages require a connection.']].map(x=>`<details><summary>${x[0]}</summary><div class="detail">${x[1]}</div></details>`).join('')}`}
function exportBackup(){download('fieldnotes-backup.json',JSON.stringify({app:'fieldnotes',version:1,data:state},null,2),'application/json');notify('Backup exported.')}
function validBackup(x){const d=x?.data;return x?.app==='fieldnotes'&&x.version===1&&d&&typeof d.draft==='string'&&Array.isArray(d.plan)&&d.plan.length===4&&d.plan.every(v=>typeof v==='string')&&Number.isInteger(d.question)&&d.question>=0&&d.question<15&&Number.isInteger(d.partner)&&d.partner>=0&&d.partner<15&&['notes','review','cards','checks'].every(k=>d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))&&Object.values(d.notes).every(v=>typeof v==='string')&&Object.values(d.cards).every(v=>v&&Number.isInteger(v.level)&&v.level>=0&&v.level<=4&&Number.isFinite(v.due))&&Number.isInteger(d.quizBest)&&d.quizBest>=0&&d.quizBest<=10}
async function importBackup(file){if(!file)return;try{if(file.size>5000000)throw Error();const x=JSON.parse(await file.text());if(!validBackup(x))throw Error();if(!confirm('Replace current notes, writing and progress with this backup?'))return;state=x.data;save();cardQueue=[];render();notify('Backup imported.')}catch(e){notify('That file is not a valid Fieldnotes backup. Your work has not been changed.')}}
function resetAll(){if(!confirm('Delete all notes, drafts, card progress and quiz results in this browser? Export a backup first if needed.'))return;state={notes:{},review:{},cards:{},draft:'',plan:['','','',''],checks:{},question:0,partner:5,quizBest:0};save();cardQueue=[];setTimer(45);render();notify('Progress reset.')}
render();
